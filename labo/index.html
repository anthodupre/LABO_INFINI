:root{
  --bg:#141020; --panel:#1c1830; --panel2:#262b44; --line:#3a4466; --line2:#5a6988; --ink:#eef1f8; --dim:#8b9bb4; --dim2:#5a6988;
  --cyan:#2ce8f5; --amber:#feae34; --yellow:#fee761; --green:#63c74d; --red:#e43b44; --violet:#9b5de5; --pink:#f6757a; --lav:#d4b8ff;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"VT323",ui-monospace,Menlo,monospace;font-size:20px;line-height:1.15;-webkit-text-size-adjust:100%;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.px,h1,h2,h3{font-family:"Pixelify Sans","VT323",monospace;font-weight:400}
b,strong{font-weight:400;color:var(--yellow)}
img{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:20px;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-track{background:#120e1e} ::-webkit-scrollbar-thumb{background:var(--line);border:2px solid #120e1e}

#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;padding-left:var(--sl);padding-right:var(--sr);background:var(--bg)}

/* ---------- Barre du haut ---------- */
#top{display:flex;align-items:center;gap:8px;padding:calc(4px + var(--st)) 8px 4px;background:#0e0b18;border-bottom:2px solid var(--line);min-height:calc(42px + var(--st));flex:0 0 auto}
#labName{background:none;border:0;padding:2px 4px;text-align:left;min-width:0;flex:1;overflow:hidden;line-height:1}
#labName .ln{display:block;font-family:"Pixelify Sans",monospace;font-size:19px;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#labName .rk{display:block;font-size:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:var(--panel2);border:2px solid var(--line2);padding:3px;width:44px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 #000;flex:0 0 auto}
.ibtn img{width:28px;height:28px}
.ibtn:active{transform:translate(2px,2px);box-shadow:none}
#godBadge{display:none;color:#1a1000;background:var(--yellow);font-family:"Pixelify Sans";font-size:14px;padding:1px 5px;border:2px solid #000;flex:0 0 auto}
.god #godBadge{display:block}

/* ---------- Fil d'actualités ---------- */
#ticker{flex:0 0 auto;height:26px;overflow:hidden;background:#0b0914;border-bottom:2px solid #221d38;position:relative;color:#c9d2e6;font-size:19px;line-height:24px}
#ticker.off{display:none}
#tickerInner{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;padding-left:100%}
#tickerInner .tag{color:var(--amber)}

/* ---------- Disposition ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
.L-port #main{flex-direction:column}
#paneFlask{position:relative;overflow:hidden;min-height:0;min-width:0;background:#000}
.L-port #paneFlask{flex:0 0 43%}
.L-land #paneFlask{flex:0 0 45%}
.L-wide #paneFlask{flex:0 0 31%}
#paneMid{display:none;min-width:0;min-height:0}
.L-wide #paneMid{display:flex;flex-direction:column;flex:0 0 35%;border-left:2px solid var(--line)}
#paneSide{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;border-left:2px solid var(--line);background:var(--panel)}
.L-port #paneSide{border-left:0;border-top:2px solid var(--line)}
#paneMid{background:var(--panel)}
#scene{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none;cursor:pointer}

/* ---------- HUD (compteur) ---------- */
#hud{position:absolute;left:0;right:0;top:4px;text-align:center;pointer-events:none;z-index:2;padding:0 6px}
#hud .box{display:inline-block;background:rgba(14,11,24,.78);border:2px solid rgba(90,105,136,.55);padding:3px 12px 4px;box-shadow:3px 3px 0 rgba(0,0,0,.5);max-width:100%}
#molCount{font-family:"VT323",monospace;font-size:34px;line-height:1.05;color:#fff;text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#molLabel{font-size:17px;color:var(--dim);line-height:1}
#cpsLine{font-size:18px;color:var(--cyan);line-height:1.05;text-shadow:1px 1px 0 #000;white-space:nowrap}
#cpsLine.buffed{color:var(--yellow)}
#buffs{position:absolute;left:6px;top:78px;display:flex;flex-direction:column;gap:4px;z-index:3;pointer-events:none}
.buff{display:flex;align-items:center;gap:4px;background:rgba(14,11,24,.82);border:2px solid var(--amber);padding:1px 4px 1px 1px;font-size:15px;max-width:190px}
.buff img{width:24px;height:24px}
.buff .bt{display:flex;flex-direction:column;line-height:1;min-width:0}
.buff .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--yellow)}
.buff .bb{height:4px;background:#000;margin-top:2px}
.buff .bb i{display:block;height:100%;background:var(--amber)}
#eurekaWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:2;display:flex;align-items:center;gap:6px;pointer-events:none;width:min(240px,70%)}
#eurekaWrap span{font-family:"Pixelify Sans";font-size:13px;color:var(--yellow);text-shadow:1px 1px 0 #000;letter-spacing:1px}
#eurekaBar{flex:1;height:10px;background:#0e0b18;border:2px solid #000;box-shadow:0 0 0 2px var(--line2)}
#eurekaFill{height:100%;width:0;background:linear-gradient(90deg,#f77622,#fee761)}
#eurekaWrap.on #eurekaFill{background:#fff;animation:blinkfill .25s steps(2) infinite}
@keyframes blinkfill{50%{background:var(--yellow)}}
#chalBanner{position:absolute;right:6px;top:78px;z-index:3;max-width:48%;background:rgba(14,11,24,.85);border:2px solid var(--violet);padding:3px 6px;font-size:16px;line-height:1.05;display:none}
#chalBanner.on{display:block}
#chalBanner .cn{color:var(--lav)}
.pbar{height:6px;background:#000;border:1px solid var(--line);margin-top:2px}
.pbar i{display:block;height:100%;background:var(--violet)}

/* ---------- Onglets ---------- */
.tabs{display:flex;flex:0 0 auto;background:#0e0b18;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:50px;background:none;border:0;border-right:2px solid #221d38;padding:4px 4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--dim);font-size:15px;position:relative}
.tab img{width:26px;height:26px;opacity:.7}
.tab.on{background:var(--panel);color:#fff;box-shadow:inset 0 -3px 0 var(--cyan)}
.tab.on img{opacity:1}
.tab .dot{position:absolute;top:3px;right:6px;width:9px;height:9px;background:var(--red);border:2px solid #000;display:none}
.tab.notif .dot{display:block}
.pages{flex:1;position:relative;min-height:0}
.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 8px calc(24px + var(--sb));display:none}
.page.on{display:block}
#page-lab{padding:0}
.ptitle{font-family:"Pixelify Sans";font-size:21px;color:var(--cyan);margin:4px 0 6px;display:flex;align-items:center;gap:8px}
.ptitle img{width:28px;height:28px}
.sub{color:var(--dim);font-size:17px}
.sect{font-family:"Pixelify Sans";font-size:17px;color:var(--amber);margin:12px 0 6px;border-bottom:2px solid #2c2645;padding-bottom:2px;display:flex;align-items:center;gap:6px}

/* ---------- Boutons ---------- */
.btn{background:var(--panel2);border:2px solid var(--line2);padding:5px 10px;box-shadow:2px 2px 0 #000;font-size:19px;line-height:1.1}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.on{background:#1d4b5c;border-color:var(--cyan);color:#fff}
.btn.gold{border-color:var(--amber);color:var(--yellow);background:#3a2a10}
.btn.warn{border-color:var(--red);color:#ffb0b4;background:#3a1418}
.btn.violet{border-color:var(--violet);color:var(--lav);background:#2a1742}
.btn.green{border-color:var(--green);color:#c8ffb8;background:#173a1c}
.btn[disabled],.btn.dis{opacity:.45}
.btn.big{font-family:"Pixelify Sans";font-size:20px;padding:8px 16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- Boutique ---------- */
.shopbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.shopbar .btn{padding:3px 9px;font-size:18px;min-height:38px}
.shopbar .sep{width:6px}
#upsGrid{display:flex;flex-wrap:wrap;gap:4px;min-height:10px}
.upt{width:48px;height:48px;padding:0;border:0;background:none;position:relative;opacity:.55;filter:saturate(.5)}
.upt img{width:48px;height:48px;display:block}
.upt.can{opacity:1;filter:none}
.upt.can::after{content:"";position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;border:2px solid var(--yellow);animation:pulse 1.2s steps(2) infinite}
.upt.sel{outline:3px solid var(--cyan);outline-offset:1px}
@keyframes pulse{50%{border-color:transparent}}
.updet{margin:6px 0;background:#141026;border:2px solid var(--line);padding:6px 8px;display:none}
.updet.on{display:block}
.updet .h{display:flex;gap:8px;align-items:center}
.updet .h > img{width:40px;height:40px;flex:0 0 auto}
.updet .nm{font-family:"Pixelify Sans";font-size:18px;color:#fff}
.updet .ds{font-size:18px;margin:3px 0}
.updet .qq{font-size:17px;color:var(--dim);font-style:italic}
.cost{white-space:nowrap}
.cost.no{color:#ff7a80}
.cost.yes{color:#8dff7a}
.molIco{width:16px;height:16px;vertical-align:-2px;margin-right:2px}
#bList{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.bItem{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#272140,#1c1830);border:2px solid #34304f;padding:3px 8px 3px 4px;cursor:pointer;position:relative;box-shadow:2px 2px 0 #000;min-height:58px}
.bItem:active{transform:translate(2px,2px);box-shadow:none}
.bItem.can{border-color:#4f6a8a;background:linear-gradient(90deg,#2b3456,#1c1f36)}
.bItem.no{opacity:.62}
.bItem.myst{opacity:.5;cursor:default}
.bItem .bIcon{width:48px;height:48px;flex:0 0 auto}
.bItem .bInfo{flex:1;min-width:0}
.bItem .bName{font-family:"Pixelify Sans";font-size:18px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bItem .bCost{font-size:18px}
.bItem .bOwned{font-family:"VT323";font-size:34px;color:rgba(255,255,255,.35);min-width:40px;text-align:right}
.bItem .bAmt{font-size:15px;color:var(--dim);margin-left:6px}
.sellmode .bItem{border-color:#6a3040}
.sellmode .bItem .bCost{color:#ffb0b4}

/* ---------- Grilles d'icônes (succès, Nobel) ---------- */
.igrid{display:flex;flex-wrap:wrap;gap:4px}
.ic{width:44px;height:44px;padding:0;border:0;background:none;position:relative}
.ic img{width:44px;height:44px;display:block}
.ic.lock img{filter:grayscale(1) brightness(.35)}
.ic.sel{outline:3px solid var(--cyan);outline-offset:1px}
.det{background:#141026;border:2px solid var(--line);padding:6px 8px;margin:6px 0;min-height:52px}
.det .h{display:flex;gap:8px;align-items:center}
.det .h > img{width:40px;height:40px;flex:0 0 auto}
.det .nm{font-family:"Pixelify Sans";font-size:18px;color:#fff}
.det.pin{position:sticky;top:-8px;z-index:3;box-shadow:0 3px 0 #000}

/* ---------- Nobel ---------- */
.card{background:#141026;border:2px solid var(--line);padding:8px;margin:6px 0;box-shadow:3px 3px 0 #000}
.card.gold{border-color:var(--amber)}
.card.violet{border-color:var(--violet)}
.card .big{font-family:"VT323";font-size:32px;color:var(--yellow)}
.trow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 0;border-bottom:1px dashed #2c2645}
.node{width:52px;height:52px;padding:0;border:0;background:none;position:relative}
.node img{width:52px;height:52px;display:block}
.node.lock{opacity:.25}
.node.avail img{filter:brightness(.75) saturate(.6)}
.node.avail.can img{filter:none}
.node.avail.can::after{content:"";position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;border:2px solid var(--yellow);animation:pulse 1.2s steps(2) infinite}
.node.own::before{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;background:var(--green);border:2px solid #000;z-index:1}
.node.sel{outline:3px solid var(--cyan);outline-offset:1px}
.chal{border:2px solid #3b2a5a;background:#191230;padding:6px 8px;margin:6px 0}
.chal.done{border-color:var(--green)}
.chal .cn{font-family:"Pixelify Sans";font-size:18px;color:var(--lav)}

/* ---------- Petri ---------- */
.pgrid{display:grid;gap:3px;margin:6px auto;width:max-content;background:#0e0b18;border:3px solid #2c2645;padding:4px}
.pcell{width:52px;height:52px;padding:0;border:0;position:relative;background:none}
.pcell img{position:absolute;image-rendering:pixelated}
.pcell .dish{top:0;right:0;bottom:0;left:0;width:52px;height:52px;opacity:.95}
.pcell .str{left:8px;top:8px;width:36px;height:36px}
.pcell.ripe::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border:2px solid var(--green);animation:pulse 1.4s steps(2) infinite}
.pcell.sel{outline:3px solid var(--cyan)}
.pcell .age{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#000}
.pcell .age i{display:block;height:100%;background:var(--green)}
.seeds{display:flex;flex-wrap:wrap;gap:4px}
.seed{display:flex;align-items:center;gap:4px;background:var(--panel2);border:2px solid var(--line);padding:2px 6px 2px 2px;font-size:16px;max-width:100%}
.seed > img{width:30px;height:30px}
.seed.on{border-color:var(--cyan);background:#1d4b5c}
.seed.unk{opacity:.5}

/* ---------- Journal ---------- */
.journal{max-height:260px;overflow-y:auto;background:#100c1e;border:2px solid #2c2645;padding:4px 6px;-webkit-overflow-scrolling:touch}
.jr{padding:4px 0;border-bottom:1px dotted #2c2645;font-size:17px;line-height:1.1}
.jr:last-child{border-bottom:0}
.jk{font-family:"Pixelify Sans";font-size:13px;color:var(--amber)}
.jk-inc{color:#ff7a80} .jk-gold{color:var(--yellow)} .jk-era{color:var(--lav)} .jk-petri{color:var(--green)} .jk-chal{color:var(--cyan)}
/* ---------- Stats / Options ---------- */
.stat{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dotted #2c2645;font-size:19px}
.stat span:first-child{color:var(--dim)}
.stat span:last-child{text-align:right}

/* ---------- Effets ---------- */
#fx{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:20;overflow:hidden}
.shimmer{position:absolute;pointer-events:auto;cursor:pointer;z-index:21;touch-action:none}
.shimmer.caught img{opacity:0;transition:opacity .1s}
.shimmer img{display:block;filter:drop-shadow(0 0 6px #fee761) drop-shadow(0 0 2px #fff);animation:bob 1.6s ease-in-out infinite}
.shimmer.ano img{filter:drop-shadow(0 0 8px #9b5de5) drop-shadow(0 0 2px #2ce8f5);animation:bob 0.9s ease-in-out infinite, glitch 2.4s steps(1) infinite}
.shimmer.mini{animation:fall linear forwards}
.shimmer.mini img{animation:spin 1s steps(8) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes glitch{0%{transform:translate(0,0)}92%{transform:translate(3px,-2px) skewX(10deg)}96%{transform:translate(-3px,2px)}}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(var(--fall))}}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{position:absolute;font-family:"VT323",monospace;font-size:27px;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;pointer-events:none;white-space:nowrap;animation:popup 1s ease-out forwards;z-index:22;transform:translate(-50%,-50%)}

@keyframes tin{from{transform:translateY(14px);opacity:0}}

/* ---------- Infobulle ---------- */
#tip{position:fixed;z-index:50;pointer-events:none;background:#0e0b18;border:2px solid var(--line2);box-shadow:3px 3px 0 #000;padding:6px 8px;max-width:min(330px,92vw);font-size:18px;display:none}

<script>
"use strict";
const BUILD_ID = "18 octobre 2026 à 20 h 50";
/* ==== 00_util.js ==== */
/* ===================== UTILITAIRES ===================== */
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  rand: (a, b) => a + Math.random() * (b - a),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  now: () => Date.now(),
  lerp: (a, b, t) => a + (b - a) * t,
  esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
  el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; },
  $(sel) { return document.querySelector(sel); },
  // Générateur pseudo-aléatoire déterministe (mulberry32)
  seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; },
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  // Couleurs
  hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; },
  rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); },
  mix(h1, h2, t) { const a = U.hex2rgb(h1), b = U.hex2rgb(h2); return U.rgb2hex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t); },
  hsl(h, s, l) { // h 0..360, s,l 0..1 -> hex
    h = ((h % 360) + 360) % 360; const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return U.rgb2hex((r + m) * 255, (g + m) * 255, (b + m) * 255);
  },
  plural(n, sing, plur) { return (Math.abs(n) >= 2 ? plur : sing); },
  // met en minuscule le premier mot seulement (« Becs Bunsen » -> « becs Bunsen »), retire l'article « Le/La »
  art(s) { return String(s).replace(/^L(?=['\u2019])/, 'l').replace(/^l'/, 'l\u2019').replace(/^(Le|La|Les) /, m => m.toLowerCase()); },
  lc(s) { s = String(s).replace(/^(?:(?:Les|Le|La)\s+|L[\u2019'])/, ''); return s.charAt(0).toLowerCase() + s.slice(1); },
};

/* ---------- Formatage des nombres (français) ---------- */
const NUM_LONG = ['', 'mille', 'million', 'milliard', 'billion', 'billiard', 'trillion', 'trilliard', 'quadrillion', 'quadrilliard',
  'quintillion', 'quintilliard', 'sextillion', 'sextilliard', 'septillion', 'septilliard', 'octillion', 'octilliard', 'nonillion', 'nonilliard',
  'décillion', 'décilliard', 'undécillion', 'undécilliard', 'duodécillion', 'duodécilliard', 'trédécillion', 'trédécilliard',
  'quattuordécillion', 'quattuordécilliard', 'quindécillion', 'quindécilliard', 'sexdécillion', 'sexdécilliard'];
const NUM_SHORT = ['', 'k', 'M', 'Md', 'Bn', 'Bd', 'Tn', 'Td', 'Qan', 'Qad', 'Qin', 'Qid', 'Sxn', 'Sxd', 'Spn', 'Spd', 'Ocn', 'Ocd',
  'Nn', 'Nd', 'Dn', 'Dd', 'UDn', 'UDd', 'DDn', 'DDd', 'TDn', 'TDd', 'QaDn', 'QaDd', 'QiDn', 'QiDd', 'SxDn', 'SxDd'];
let NUM_FORMAT = 'long'; // 'long' | 'short' | 'sci'

function grp(n) { // 12345 -> "12 345" (espace insécable fine)
  return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function dec(n, d) { // nombre décimal à la française, zéros inutiles retirés
  let s = n.toFixed(d);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s.replace('.', ',');
}
// fmt(n, d) : d = décimales pour les petits nombres ; mode court forcé si short=true
function fmt(n, d = 0, short = false) {
  if (n !== n) return '?';
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n, d, short);
  if (n < 1000) {
    if (d > 0 && n < 100 && n !== Math.floor(n)) return dec(n, n < 10 ? d : Math.min(d, 1));
    return String(Math.floor(n + 1e-9));
  }
  const mode = short && NUM_FORMAT === 'long' ? 'short' : NUM_FORMAT;
  if (n < 1e6 && mode !== 'sci') return grp(n);
  if (n < 1e6) return grp(n);
  let e = Math.floor(Math.log10(n) + 1e-12);
  if (mode === 'sci' || e >= 102) {
    let m = n / Math.pow(10, e);
    if (+m.toFixed(3) >= 10) { m /= 10; e++; }
    return dec(m, 3) + 'e' + e;
  }
  let i = Math.floor(e / 3);
  let m = n / Math.pow(10, i * 3);
  const digits = mode === 'short' ? (m < 10 ? 2 : m < 100 ? 1 : 0) : 3;
  if (+m.toFixed(digits) >= 1000) { i++; m /= 1000; }
  if (i >= NUM_LONG.length) return fmt(1e102, d, short);
  if (mode === 'short') return dec(m, m < 10 ? 2 : m < 100 ? 1 : 0) + ' ' + NUM_SHORT[i];
  const word = NUM_LONG[i];
  return dec(m, 3) + ' ' + (+m.toFixed(3) >= 2 ? word + 's' : word); // 1,9999 s'affiche « 2 » : donc « 2 millions »
}
const fmtS = (n, d = 0) => fmt(n, d, true);
function fmtPct(x) { // 0.15 -> "15 %"
  const v = x * 100;
  return (Math.abs(v) < 10 && v !== Math.floor(v) ? dec(v, 1) : v >= 1e6 ? fmt(v) : grp(Math.round(v))) + ' %';
}
// « 1 million de molécules », « 12 345 molécules », « 3 milliards d’atomes »
function deMot(s, nom) { return /[A-Za-zéû]$/.test(s) ? (/^[aeiouyàâäéèêëîïôöùûüœæh]/i.test(nom) ? ' d\u2019' : ' de ') : ' '; }
function fmtNom(v, sing, plur, d = 0, short = false) { const s = fmt(v, d, short); return s + deMot(s, plur) + (v >= 2 ? plur : sing); }
const fmtMol = (v, d = 0) => fmtNom(v, 'molécule', 'molécules', d);
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const j = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (j > 0) return j + ' j' + (h ? ' ' + h + ' h' : '');
  if (h > 0) return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') + ' min' : '');
  if (m > 0) return m + ' min' + (s ? ' ' + String(s).padStart(2, '0') + ' s' : '');
  return s + ' s';
}
function fmtDuree(sec) { // version longue pour les phrases
  sec = Math.max(0, Math.floor(sec));
  const j = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  const p = [];
  if (j) p.push(j + ' jour' + (j > 1 ? 's' : ''));
  if (h) p.push(h + ' heure' + (h > 1 ? 's' : ''));
  if (m && !j) p.push(m + ' minute' + (m > 1 ? 's' : ''));
  if (!p.length) p.push(sec + ' seconde' + (sec > 1 ? 's' : ''));
  return p.join(' et ');
}

/* ==== 01_palette.js ==== */
/* ===================== PALETTE & REGISTRE DE SPRITES ===================== */
// Palette commune (base Endesga 32 + extensions). Un caractère = une couleur.
// '.' = transparent. '~' = intérieur liquide (rendu par le moteur). '+' = couleur d'accent (teintée par le moteur).
const PAL = {
  '0': '#181425', // contour / quasi-noir

/* ===================== RENDU DES SPRITES ===================== */
const GFX = {
  _cv: {}, _url: {}, _rgba: null, _info: {},
  TIER_COLORS: [
    ['#b86f50', '#e4a672'], ['#8b9bb4', '#ffffff'], ['#feae34', '#fee761'], ['#3e8948', '#63c74d'], ['#a22633', '#e43b44'],
    ['#124e89', '#0099db'], ['#68386c', '#b55088'], ['#262b44', '#2ce8f5'], ['#0099db', '#2ce8f5'], ['#3e2731', '#9b5de5'],
    ['#f77622', '#fee761'], ['#b55088', '#d4b8ff'], ['#193c3e', '#63c74d'], ['#ff0044', '#feae34'], ['#d4b8ff', '#ffffff'],
  ],
  rgbaOf(ch) {
    if (!this._rgba) {
      this._rgba = {};
      for (const k in PAL) {
        const c = PAL[k];
        if (c[0] === '#') this._rgba[k] = [...U.hex2rgb(c), 255];
        else { const m = c.match(/rgba\((\d+),(\d+),(\d+),([\d.]+)\)/); this._rgba[k] = [+m[1], +m[2], +m[3], Math.round(+m[4] * 255)]; }
      }
    }
    return this._rgba[ch];
  },
  has(name) { return !!SPRITES[name]; },
  optKey(o) { return o ? (o.tint || '') + ',' + (o.liquid || '') + ',' + (o.sil || '') + ',' + (o.flip ? 1 : 0) + ',' + (o.noAcc ? 1 : 0) + ',' + (o.dim || '') : ''; },
  // table arc-en-ciel précalculée (aucune allocation par pixel)
  RBW: null,
  rbw(h, light) {
    if (!this.RBW) { this.RBW = { rgb: [[], []], hex: [] }; for (let k = 0; k < 360; k++) { this.RBW.rgb[0][k] = U.hex2rgb(U.hsl(k, 0.85, 0.6)); this.RBW.rgb[1][k] = U.hex2rgb(U.hsl(k, 0.85, 0.8)); this.RBW.hex[k] = U.hsl(k, 0.9, 0.65); } }
    const i = ((Math.floor(h) % 360) + 360) % 360;
    return light == null ? this.RBW.hex[i] : this.RBW.rgb[light ? 1 : 0][i];
  },
  get(name) {
    let s = SPRITES[name];
    if (!s) { // sprite manquant : remplaçant visible plutôt qu'un plantage
      const r = ['0000000000000000'];
      for (let i = 0; i < 14; i++) r.push('0' + (i > 3 && i < 10 ? 'MMMMM66666MMMMM' : 'MMMMMMMMMMMMMMM').slice(0, 14) + '0');
      r.push('0000000000000000');
      s = SPRITES[name] = { w: 16, h: 16, frames: [r], missing: true };
    }
    return s;
  },
  frames(name) { return this.get(name).frames.length; },
  // opt: { tint: '#hex' couleur des '+', liquid: '#hex' couleur des '~', sil: '#hex' silhouette, flip: bool }
  canvas(name, frame = 0, opt) {
    const key = name + '|' + frame + '|' + this.optKey(opt);
    const hit = this._cv[key]; if (hit) return hit;
    const s = this.get(name), fr = s.frames[frame % s.frames.length];
    const cv = document.createElement('canvas'); cv.width = s.w; cv.height = s.h;
    const cx = cv.getContext('2d'), img = cx.createImageData(s.w, s.h), d = img.data;
    const tint = opt && opt.tint ? [...U.hex2rgb(opt.tint), 255] : null;
    const liq = opt && opt.liquid ? [...U.hex2rgb(opt.liquid), 255] : null;
    const sil = opt && opt.sil ? [...U.hex2rgb(opt.sil), 255] : null;
    for (let y = 0; y < s.h; y++) {
      const row = fr[y] || '';
      for (let x = 0; x < s.w; x++) {
        const ch = row[x];
        let c = null;
        if (!ch || ch === '.') continue;
        if (ch === '~') c = liq; else if (ch === '+') c = tint || (opt && opt.noAcc ? null : [255, 255, 255, 255]); else c = this.rgbaOf(ch);
        if (!c) continue;
        if (sil) c = [sil[0], sil[1], sil[2], c[3] < 255 ? 0 : 255];
        if (opt && opt.dim) c = [c[0] * opt.dim, c[1] * opt.dim, c[2] * opt.dim, c[3]];
        const xx = opt && opt.flip ? s.w - 1 - x : x;
        const i = (y * s.w + xx) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = c[3];
      }
    }
    cx.putImageData(img, 0, 0);
    this._cv[key] = cv;
    return cv;
  },
  // URL d'image agrandie (pour le DOM) ; scale entier
  url(name, frame = 0, scale = 1, opt) {
    const key = name + '|' + frame + '|' + scale + '|' + this.optKey(opt);
    if (this._url[key]) return this._url[key];
    const src = this.canvas(name, frame, opt);
    let u;
    try {
      const cv = document.createElement('canvas'); cv.width = src.width * scale; cv.height = src.height * scale;
      const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(src, 0, 0, cv.width, cv.height);
      u = cv.toDataURL();
    } catch (e) { u = ''; }
    return (this._url[key] = u);
  },
  // Icône encadrée selon le palier (20×20 logique) – améliorations / succès
  framed(name, tier, opt) {
    const key = 'F|' + name + '|' + tier + '|' + this.optKey(opt);
    if (this._url[key]) return this._url[key];
    const src = this.canvas(name, 0, opt);
    const S = 22, sc = 3;
    const cv = document.createElement('canvas'); cv.width = S * sc; cv.height = S * sc;
    const cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false; cx.scale(sc, sc);
    const tc = tier == null ? ['#2a2f4a', '#5a6988'] : this.TIER_COLORS[tier % this.TIER_COLORS.length];
    cx.fillStyle = '#181425'; cx.fillRect(0, 0, S, S);
    cx.fillStyle = tc[0]; cx.fillRect(1, 1, S - 2, S - 2);
    cx.fillStyle = tc[1]; cx.fillRect(1, 1, S - 2, 1); cx.fillRect(1, 1, 1, S - 2);
    cx.fillStyle = '#1f1a33'; cx.fillRect(2, 2, S - 4, S - 4);
    cx.fillStyle = 'rgba(255,255,255,0.06)'; cx.fillRect(2, 2, S - 4, Math.floor((S - 4) / 2));
    const k = Math.min(16 / src.width, 16 / src.height), f = k >= 2 ? Math.floor(k) : Math.min(1, k);
    const w = src.width * f, h = src.height * f;
    cx.drawImage(src, (S - w) / 2, (S - h) / 2, w, h);
    let u = ''; try { u = cv.toDataURL(); } catch (e) { }
    return (this._url[key] = u);
  },
  // Analyse d'un récipient : cellules liquides et accents
  vessel(name) {
    if (this._info[name]) return this._info[name];
    const s = this.get(name), fr = s.frames[0];
    const liq = [], acc = [], colTop = {}, colBot = {};
    let top = s.h, bot = 0, l = s.w, r = 0, oTop = s.h, oBot = 0, oL = s.w, oR = 0;
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const ch = (fr[y] || '')[x];
      if (!ch || ch === '.') continue;
      oTop = Math.min(oTop, y); oBot = Math.max(oBot, y); oL = Math.min(oL, x); oR = Math.max(oR, x);
      if (ch === '~') {
        liq.push([x, y]); top = Math.min(top, y); bot = Math.max(bot, y); l = Math.min(l, x); r = Math.max(r, x);
        colTop[x] = Math.min(colTop[x] == null ? 99 : colTop[x], y); colBot[x] = Math.max(colBot[x] || 0, y);
      } else if (ch === '+') acc.push([x, y]);
    }
    if (!liq.length) { top = 0; bot = s.h - 1; l = 0; r = s.w - 1; }
    return (this._info[name] = { w: s.w, h: s.h, liq, acc, top, bot, l, r, colTop, colBot, box: [oL, oTop, oR, oBot] });
  },
};

  { e: 5, x: 7, t: "La gravité terrestre porte plainte pour concurrence déloyale. Le labo plaide la légitime apesanteur." },
  { e: 5, x: 7, t: "Les marées ne suivent plus la Lune, mais le labo. Les surfeurs s’abonnent à son planning de production." },
  { e: 5, x: 7, t: "Le Professeur Grinchard lance sa station orbitale. C’est une montgolfière avec un autocollant « station »." },
  { e: 5, x: 7, t: "Le labo publie la première photo de la Terre prise depuis sa station. On y voit surtout son reflet dans l’océan." },
  { e: 5, x: 7, t: "L’ONU crée un poste de médiateur orbital. Le titulaire démissionne après avoir lu l’emploi du temps de Kévin." },
  { e: 5, x: 7, t: "Selon un sondage, un Terrien sur cinq rêve d’emménager dans la station. Le labo, lui, envisage de déménager la Terre." },
  { e: 5, x: 8, t: "Les étoiles filantes de la nuit d’été sont annulées : le labo les a récupérées pour en faire des molécules." },

  /* ---------- Ère 6 : l’Ère dimensionnelle ---------- */
  { e: 6, x: 8, t: "Le premier portail s’ouvre. De l’autre côté : un labo identique, qui ouvrait justement un portail. Malaise." },
  { e: 6, x: 8, t: "Un Kévin venu d’une dimension parallèle affirme être « le vrai Kévin ». Les deux ont renversé le même flacon." },
  { e: 6, t: "Douane interdimensionnelle : merci de déclarer vos molécules, vos réalités alternatives et vos fromages au lait cru." },
  { e: 6, x: 8, t: "Mme Duchemin rencontre la Mme Duchemin de la dimension voisine. Elles se plaignent l’une de l’autre depuis trois jours." },
  { e: 6, x: 8, t: "PREMIER CONTACT — Des extraterrestres découvrent le labo. Leur premier message : « Vous pourriez baisser le son ? »" },
  { e: 6, x: 8, t: "Météo : brume dimensionnelle sur tout le pays. Visibilité réduite à deux univers. Prudence aux carrefours." },
  { e: 6, x: 8, t: "Le comité d’éthique se réunit avec ses homologues de 14 dimensions. Personne n’est d’accord, pas même avec soi-même." },
  { e: 6, x: 8, t: "La Bourse interdimensionnelle ouvre. La molécule y vaut plus cher dans les univers où elle n’existe pas." },
  { e: 6, t: "INSOLITE — Une chaussette perdue dans une machine à laver est retrouvée dans la dimension 812. Le mystère est enfin résolu." },
  { e: 6, x: 8, t: "Selon un sondage multidimensionnel, {labo} est le labo préféré de 98 % des réalités. Dans les 2 % restantes, c’est un club de pétanque." },
  { e: 6, x: 8, t: "Le Professeur Grinchard visite toutes les dimensions à la recherche de celle où il serait meilleur que nous. Il cherche encore." },
  { e: 6, x: 8, t: "Les extraterrestres proposent un échange culturel. Ils nous envoient leurs plus beaux poèmes ; nous leur envoyons Kévin." },
  { e: 6, x: 8, t: "Le ministère de l’Intérieur ne sait plus de quel intérieur il s’occupe. Il se déclare compétent « dans au moins trois »." },
  { e: 6, x: 8, t: "TRAFIC : 40 km de bouchon au portail principal. Passez par la dimension 7, plus fluide le dimanche." },
  { e: 6, x: 8, t: "Un double maléfique du labo se présente à l’accueil. Il a une barbiche et une blouse noire. Il est très poli." },
  { e: 6, x: 8, t: "L’ONU accueille son premier délégué interdimensionnel. Il demande où se trouvent les toilettes, dans six dimensions." },
  { e: 6, x: 8, t: "ERRATUM : notre brève d’hier provenait d’une dimension parallèle. Dans la nôtre, Mme Duchemin n’a pas de moustache." },
  { e: 6, x: 8, t: "Les cartographes jettent l’éponge : le pays compte quatre frontières de plus, dont une au milieu de la cuisine." },
  { e: 6, x: 8, t: "Pistache est revenu d’un portail avec deux queues et un accent. Mme Duchemin le trouve « plus attentif »." },
  { e: 6, x: 8, t: "Un voyageur dimensionnel atterrit à la cafétéria. Il vient d’un univers où le café se boit glacé. Il est en larmes." },
  { e: 6, x: 8, t: "Le labo importe des molécules d’un univers où tout est en solde. La Bourse de notre univers fait une dépression." },
  { e: 6, x: 8, t: "PHILOSOPHIE — Grand colloque : « Si une molécule tombe dans un portail et que personne ne l’entend, compte-t-elle ? »" },
  { e: 6, x: 8, t: "Les extraterrestres demandent si le labo est « une sorte de divinité ». Kévin a répondu oui. Il est mis à pied." },
  { e: 6, x: 8, t: "Kévin a franchi un portail par erreur. Il a été remplacé par un Kévin plus compétent. Personne n’a rien remarqué." },

  /* ---------- Ère 7 : l’Ère stellaire ---------- */
  { e: 7, t: "Le Soleil apprend que le labo forge ses propres étoiles. Il se dit « déçu, mais pas surpris »." },
  { e: 7, t: "Les astrologues sont au chômage : le labo a déplacé quatre constellations pour faire de la place." },
  { e: 7, t: "Météo : canicule stellaire toute la semaine. Les étoiles captives du labo ont oublié de baisser le thermostat." },
  { e: 7, x: 8, t: "Le Conseil galactique convoque {labo} pour « excès de luminosité ». Le labo s’y présente en lunettes de soleil." },
  { e: 7, t: "HOROSCOPE — Sagittaire : votre constellation a été vendue. Nous vous attribuons provisoirement la Grande Pipette." },
  { e: 7, t: "Les étoiles captives se syndiquent : elles réclament un jour de repos par cycle et le droit de devenir naines." },
  { e: 7, x: 8, t: "Kévin a laissé tomber une étoile à neutrons sur son pied. Son pied pèse désormais trois milliards de tonnes. Il boite." },
  { e: 7, x: 8, t: "Le comité d’éthique est désormais composé d’extraterrestres. Leur premier avis : « Waouh. » Ensuite, plus rien." },
  { e: 7, x: 8, t: "Mme Duchemin porte plainte au Conseil galactique : le labo lui cache le Soleil. Le labo lui en offre un de rechange." },
  { e: 7, t: "La Bourse galactique : l’hydrogène s’échange au prix du caviar. Les nébuleuses spéculent à la hausse." },
  { e: 7, x: 8, t: "Des extraterrestres de Véga visitent le labo en voyage organisé. Ils prennent surtout Kévin en photo." },
  { e: 7, x: 8, t: "Le Professeur Grinchard a capturé une étoile. C’est un lampadaire. Il refuse de l’admettre." },
  { e: 7, t: "Selon un sondage galactique, 6 espèces sur 7 trouvent le labo « un peu voyant ». La septième n’a pas d’yeux, mais elle est d’accord." },
  { e: 7, t: "INSOLITE — Une supernova est annulée à la dernière minute : le labo avait besoin de son fer pour une étagère." },
  { e: 7, t: "Les navigateurs de l’espace sont perdus : l’étoile Polaire a été délocalisée dans l’aile B du labo." },
  { e: 7, x: 8, t: "Le Soleil menace de se mettre en grève. Le labo lui propose une augmentation de luminosité. Il hésite." },
  { e: 7, t: "SPORT — Course de comètes : la favorite est disqualifiée pour avoir perdu sa queue en chemin." },
  { e: 7, x: 8, t: "L’ONU, dépassée, se rebaptise « Organisation des Nations un peu Unies ». Les extraterrestres réclament un siège." },
  { e: 7, t: "Les nuits terrestres sont abolies : il y a trop d’étoiles du labo dans le ciel. Les vampires déménagent." },
  { e: 7, t: "Les planètes du système solaire envoient une lettre commune au labo : « Arrêtez de nous prendre pour des billes. »" },
  { e: 7, t: "CARNET : naissance d’une étoile à la forge du labo. Poids de naissance : une masse solaire et demie. La nébuleuse est épuisée." },
  { e: 7, t: "Les astronomes rebaptisent la Voie lactée « Voie du labo ». Le lait est remplacé par du plasma, demi-écrémé." },
  { e: 7, x: 8, t: "Kévin est nommé ambassadeur auprès de la nébuleuse du Crabe. Le Crabe l’a pincé. Kévin aussi." },
  { e: 7, t: "Audit du Conseil galactique : {mol} en caisse chez {labo}. Il suggère désormais de compter en galaxies, par commodité." },
  { e: 7, t: "Les quasars du voisinage se plaignent : le labo leur vole la vedette. Et un peu de matière, aussi." },

  /* ---------- Ère 8 : l’Ère cosmique ---------- */
  { e: 8, t: "Les lois de la physique entament une grève illimitée. La gravité assure un service minimum le mardi." },
  { e: 8, t: "Un univers voisin porte plainte pour vol de molécules. Le labo plaide qu’il l’a simulé, et que c’est donc le sien." },
  { e: 8, t: "Le Conseil des galaxies vote une motion : « Le labo est trop grand. » Le labo s’abstient, faute de place pour voter." },
  { e: 8, t: "La constante de Planck est modifiée par erreur. Tout est désormais un peu flou. Les opticiens sont débordés." },
  { e: 8, t: "Météo cosmique : l’expansion de l’univers s’accélère ce week-end. Prévoyez une petite laine." },
  { e: 8, t: "Le comité d’éthique, dépassé, se dissout dans le vide intergalactique. Son dernier avis tient en une lettre : « Ô »." },
  { e: 8, t: "Kévin a trouvé la réponse à la grande question de l’univers. Il l’a notée sur un pense-bête. Le pense-bête est perdu." },
  { e: 8, t: "Mme Duchemin écrit à l’univers pour se plaindre. Il répond, gêné, qu’il n’y peut rien : le labo est plus grand que lui." },
  { e: 8, t: "La vitesse de la lumière est jugée trop lente. Une note de service lui demande de « se bouger un peu »." },
  { e: 8, t: "Selon un sondage multiversel, 99,9 % des univers connaissent {labo}. Les autres ont été fabriqués ce matin." },
  { e: 8, t: "Le Professeur Grinchard a simulé un univers. L’univers a planté au bout de trois secondes. Grinchard est très fier." },
  { e: 8, t: "La Bourse cosmique : l’action « Univers » plonge après l’arrivée sur le marché de 400 univers d’occasion." },
  { e: 8, t: "Des extraterrestres demandent l’asile chez nous : leur univers est devenu « un peu étroit » depuis que le labo s’y est installé." },
  { e: 8, t: "TRAFIC : les trous de ver sont saturés. Empruntez les trous de chenille, plus lents mais plus sûrs." },
  { e: 8, t: "L’entropie annonce son départ à la retraite. Le désordre de l’univers sera désormais assuré par le bureau de Kévin." },
  { e: 8, t: "Les physiciens découvrent une cinquième force fondamentale : la force de l’habitude. C’est elle qui fait tourner le labo." },
  { e: 8, t: "INSOLITE — Une galaxie se réveille en forme de pipette. Les savants parlent de coïncidence ; la galaxie, d’hommage." },
  { e: 8, t: "Le Grand Attracteur se dit très attiré par le labo. Le labo lui répond que ce n’est pas réciproque." },
  { e: 8, t: "Le Temps exige d’être payé à l’heure. Le labo propose de le payer en temps. Le Temps trouve ça circulaire." },
  { e: 8, t: "La matière noire accepte enfin de se montrer. Elle était simplement timide, rangée dans un placard du labo." },
  { e: 8, t: "Le Conseil multiversel interdit de créer des univers le dimanche. Le labo avait prévu le coup : il les a faits le samedi." },
  { e: 8, t: "Kévin est désormais visible depuis tous les univers à la fois. Il a encore oublié d’éteindre la lumière." },
  { e: 8, t: "Les mathématiques s’inquiètent : le labo compte trop vite. Le nombre 7 a demandé une protection rapprochée." },
  { e: 8, t: "L’ONU, le Conseil galactique et les extraterrestres signent une pétition : « Le labo, ça suffit. » Le labo l’a fait encadrer." },

  /* ---------- Ère 9 : l’Infini ---------- */
  { e: 9, t: "La Réalité porte plainte contre {labo} pour « occupation abusive ». L’audience est fixée à la fin des temps." },
  { e: 9, t: "Le concept de « taille » démissionne : il ne sait plus à quoi s’appliquer depuis que le labo contient tout." },
  { e: 9, t: "Le labo contient un labo qui contient un labo. Kévin s’est perdu au troisième niveau de récursion. On l’entend appeler." },
  { e: 9, t: "Mme Duchemin se plaint du bruit. C’est le dernier son de l’univers. Elle se plaint quand même, et elle a raison." },
  { e: 9, t: "Le comité d’éthique renaît sous la forme d’un concept abstrait. Son unique avis : « Hmm. » On le trouve très profond." },
  { e: 9, t: "Le Néant demande un rendez-vous. Il veut savoir où il pourra exister, maintenant que le labo occupe tout." },
  { e: 9, t: "Selon un sondage infini, une infinité de personnes pense que le labo va trop loin. Une autre infinité aussi." },
  { e: 9, t: "Le fil d’actualités a pris conscience de lui-même. Il remercie ses lecteurs et réclame une augmentation." },
  { e: 9, t: "La Bourse de l’Infini : la molécule vaut désormais exactement tout. Les spéculateurs n’ont plus rien à faire." },
  { e: 9, t: "Météo : il fait temps. Partout. Tout le temps. Prévisions pour demain : également." },
  { e: 9, t: "La Logique dépose une main courante : le labo est à la fois plus grand que lui-même et contenu en lui-même." },
  { e: 9, t: "L’infini se plaint d’être trop sollicité. « L’infini plus un » propose de le remplacer le week-end." },
  { e: 9, t: "Kévin atteint l’omniscience. Première révélation : il aurait vraiment dû reboucher ce flacon, au tout début." },
  { e: 9, t: "Le Professeur Grinchard s’avoue vaincu. Il découvre qu’il était, depuis le début, rangé dans un placard du labo." },
  { e: 9, t: "INSOLITE — Quelqu’un clique sur une fiole depuis l’extérieur de l’univers. Les physiciens parlent prudemment d’« un doigt »." },
  { e: 9, t: "Les entités cosmiques de toutes les dimensions postulent pour un stage au labo. Kévin fait passer les entretiens." },
  { e: 9, t: "L’Existence menace de quitter le labo. On lui rappelle qu’elle n’aurait nulle part où aller." },
  { e: 9, t: "Le Temps, l’Espace et la Causalité tiennent une réunion de crise. Elle a eu lieu avant d’avoir été prévue." },
  { e: 9, t: "Trésorerie de l’Infini : {mol}, rien que chez {labo}. Le mot « beaucoup » est retiré du dictionnaire, jugé trop faible." },
  { e: 9, t: "Pistache est enfin sorti de sa boîte. Il a découvert que la boîte, c’était l’univers. Il veut y retourner." },
  { e: 9, t: "Le point final de cette brève a été recyclé en molécule, faute de place dans l’univers" },
  { e: 9, t: "Le concept de « fin » est placé en chômage technique. L’univers continue, le labo aussi, et cette brève également, et…" },
  { e: 9, t: "Une nouvelle réalité ouvre ses portes à côté du labo. Le labo l’a aussitôt annexée pour en faire un débarras." },
  { e: 9, t: "Courrier de l’Infini pour {labo} : pensez à boire un verre d’eau. Même les omnipotents se déshydratent." },
  { e: 9, t: "Le Big Bang originel réclame des droits d’auteur à tous ses imitateurs. Le labo arrive en tête de la liste." },

  /* ---------- Brèves liées aux bâtiments ---------- */
  // Pipette automatique
  { e: 1, b: "pipette", t: "Chez {labo}, les pipettes automatiques cliquent si vite que Mme Duchemin croit à une averse de grêle permanente." },
  { e: 1, b: "pipette", t: "Effectif des pipettes automatiques : {nb:pipette}. Leur syndicat exige une pause-goutte toutes les dix minutes." },
  { e: 1, b: "pipette", t: "INSOLITE — Une pipette automatique a cliqué sur elle-même. Elle est en arrêt maladie pour « vertige existentiel »." },
  { e: 1, b: "pipette", t: "Les pipettes carburent au café, affirme un ingénieur. Il ignore comment, mais elles tremblent moins après." },
  // Stagiaire
  { e: 1, b: "stagiaire", t: "Nombre de stagiaires recensés au labo : {nb:stagiaire}. Nombre de chaises : trois. On joue aux chaises musicales à midi." },
  { e: 1, b: "stagiaire", t: "Les stagiaires réclament un salaire. Le labo leur offre une expérience inoubliable, au sens strict du terme." },
  { e: 1, b: "stagiaire", t: "Un stagiaire affirme assembler ses molécules à mains nues. Le responsable sécurité s’est évanoui, ganté jusqu’aux coudes." },
  { e: 1, b: "stagiaire", t: "Kévin forme les nouveaux stagiaires. Leçon n° 1 : « Ne faites pas comme moi. » Il n’y a pas de leçon n° 2." },
  // Bec Bunsen
  { e: 1, b: "bunsen", t: "Becs Bunsen allumés ce matin : {nb:bunsen}. Le quartier a gagné deux degrés et perdu un hiver." },
  { e: 1, b: "bunsen", x: 4, t: "Mme Duchemin fait griller ses saucisses sur un bec Bunsen du labo. Elle se plaint toujours, mais le ventre plein." },
  { e: 1, b: "bunsen", t: "Un bec Bunsen refuse de s’éteindre. Le labo l’a rebaptisé « flamme éternelle » et organise des visites guidées." },
  { e: 1, b: "bunsen", t: "Les becs Bunsen menacent de faire grève : ils en ont assez qu’on leur souffle dessus pour un oui ou pour un non." },
  // Microscope
  { e: 2, b: "microscope", t: "Un microscope du labo découvre une molécule cachée sous une autre molécule. Elle prétend « juste passer »." },
  { e: 2, b: "microscope", t: "Microscopes en service : {nb:microscope}. Les molécules ne peuvent plus se gratter le nez sans être vues." },
  { e: 2, b: "microscope", t: "INSOLITE — Dans son microscope, un chercheur aperçoit un minuscule chercheur qui l’observe dans un microscope." },
  { e: 2, b: "microscope", t: "Kévin a regardé dans le microscope par le mauvais bout. Il affirme que le labo est « tout petit, vu d’ici »." },
  // Centrifugeuse
  { e: 2, b: "centrifugeuse", t: "La centrifugeuse tourne si vite qu’elle a fait trois fois le tour du campus. Elle est revenue plus calme." },
  { e: 2, b: "centrifugeuse", t: "Centrifugeuses en marche : {nb:centrifugeuse}. Les sismographes de la région ont demandé à être déplacés." },
  { e: 2, b: "centrifugeuse", t: "Un stagiaire a passé sa salade à la centrifugeuse. Résultat : une vinaigrette, une laitue et un sentiment d’échec." },
  { e: 2, b: "centrifugeuse", t: "Les molécules qui sortent de la centrifugeuse ont le tournis. Elles rejoignent le bécher en zigzag." },
  // Bras robotique
  { e: 3, b: "robot", t: "Un bras robotique a serré la main du ministre. Très fort. Le protocole est revu ; la main, plâtrée." },
  { e: 3, b: "robot", t: "Bras robotiques en service : {nb:robot}. Ils ont fondé un club de bras de fer. Personne ne gagne jamais." },
  { e: 3, b: "robot", t: "Les bras robotiques réclament des bras robotiques pour les aider. La direction trouve ça « récursif, mais efficace »." },
  { e: 3, b: "robot", t: "Kévin a appris la danse du robot. Les bras robotiques l’ont très mal pris." },
  // Cuve de clonage
  { e: 3, b: "clonage", t: "Les cuves de clonage ont produit quatorze Kévin par erreur. Aucun n’a rebouché le moindre flacon : ce sont bien eux." },
  { e: 3, b: "clonage", t: "Cuves de clonage en activité : {nb:clonage}. La cantine commande désormais trois fois plus de purée." },
  { e: 3, b: "clonage", t: "Un chercheur cloné réclame la moitié du salaire de l’original. Le juge a cloné le dossier pour gagner du temps." },
  { e: 3, b: "clonage", t: "Le comité d’éthique découvre qu’un tiers de ses membres sont des clones. Les clones votent pour leur propre existence." },
  // Réacteur à fusion
  { e: 4, b: "fusion", t: "Le réacteur à fusion est plus chaud que le cœur du Soleil. Mme Duchemin y fait sécher son linge en quatre secondes." },
  { e: 4, b: "fusion", t: "Réacteurs à fusion opérationnels : {nb:fusion}. Le labo chauffe toute la ville, et la ville d’à côté par politesse." },
  { e: 4, x: 6, b: "fusion", t: "Kévin s’est assis sur le bouton « fusion ». Le labo a fusionné avec la boulangerie d’en face. Croissants au tritium." },
  { e: 4, b: "fusion", t: "Le réacteur à fusion a fusionné deux réunions en une. La productivité décolle ; le service des plannings fait un malaise." },
  // Accélérateur de particules
  { e: 4, b: "accelerateur", t: "Accélérateurs de particules : {nb:accelerateur}. Les particules vont si vite qu’elles arrivent avant d’être parties." },
  { e: 4, b: "accelerateur", t: "Une particule a été flashée à 299 000 km/s en zone 30. Elle conteste : elle se croyait en zone 300 000." },
  { e: 4, b: "accelerateur", t: "Kévin trie les débris de l’accélérateur. Il a trouvé une molécule, deux boutons et un quark charmé. Charmant." },
  { e: 4, b: "accelerateur", t: "L’anneau de l’accélérateur fait tant de kilomètres que Kévin en inspecte les fuites à trottinette, jusqu’au mardi suivant." },
  // Ordinateur quantique
  { e: 4, b: "quantique", t: "L’ordinateur quantique a répondu « oui et non » à toutes les questions. Il a été nommé porte-parole du labo." },
  { e: 4, b: "quantique", t: "Ordinateurs quantiques allumés : {nb:quantique}. Ou éteints. On ne le saura qu’en ouvrant le capot." },
  { e: 4, b: "quantique", t: "L’ordinateur quantique a planté et n’a pas planté. Le service informatique pleure dans deux états superposés." },
  { e: 4, b: "quantique", t: "Kévin a observé l’ordinateur quantique. Tout s’est effondré. Il lui est désormais interdit de regarder quoi que ce soit." },
  // Station orbitale
  { e: 5, b: "orbitale", t: "La station orbitale croise un satellite météo. Échange cordial : ils parlent de la pluie et du beau temps." },
  { e: 5, b: "orbitale", t: "Stations orbitales du labo : {nb:orbitale}. Le ciel commence à ressembler à un parking de supermarché un samedi." },
  { e: 5, b: "orbitale", t: "Dans la station orbitale, les molécules flottent. Les chercheurs aussi. Kévin flotte un peu plus que les autres." },
  { e: 5, x: 7, b: "orbitale", t: "La station orbitale fait le tour de la Terre en 90 minutes. Mme Duchemin la voit passer seize fois par jour, et peste seize fois." },
  // Essaim de nanobots
  { e: 5, b: "nanobots", t: "Les nanobots se sont répliqués pendant le week-end et ont rangé le bureau de Kévin. Kévin ne retrouve plus rien." },
  { e: 5, b: "nanobots", t: "Essaims de nanobots en activité : {nb:nanobots}. Nombre de nanobots : beaucoup. Après recomptage : encore plus." },
  { e: 5, b: "nanobots", t: "Un nanobot prend son indépendance et ouvre une minuscule boulangerie. Ses baguettes mesurent trois nanomètres." },
  { e: 5, b: "nanobots", t: "Les nanobots réclament un représentant au gouvernement. On leur accorde un tout petit ministre." },
  // Portail dimensionnel
  { e: 6, b: "portail", t: "Portails dimensionnels ouverts : {nb:portail}. Les courants d’air entre les univers obligent tout le monde à porter un pull." },
  { e: 6, b: "portail", t: "Un portail s’est ouvert dans le placard à balais. Le balai est parti. Il a envoyé une carte postale." },
  { e: 6, b: "portail", t: "Un livreur emprunte le portail du labo et livre la pizza dans la mauvaise réalité. Le client le prend très mal." },

/* ===================== TEXTES : INCIDENTS DE LABO ===================== */
// Événements absurdes affichés en grand bandeau « ALERTE » toutes les quelques minutes.
// e = ère minimale (1..9), k = type d’effet (appliqué et affiché par le moteur) :
//   "gain"  : le labo gagne d’un coup un paquet de molécules
//   "buff"  : production boostée quelques instants
//   "click" : clics surpuissants quelques instants
//   "free"  : des bâtiments gratuits apparaissent
//   "gold"  : une fiole dorée surgit
//   "storm" : pluie de mini-fioles à attraper
//   "chaos" : effet aléatoire (réservé aux incidents les plus fous)
// n = titre court, t = texte de l’alerte (sans chiffres d’effet). Placeholder : {labo} (nom du labo).
// Personnages récurrents : Kévin (le stagiaire), Mme Duchemin (la voisine) et Pistache (son chat),
// le comité d’éthique (toujours dépassé), le Professeur Grinchard (l’éternel rival).
const TXT_INCIDENTS = [
  /* ---------- Ère 1 : le Garage ---------- */
  { e: 1, k: "gain", n: "Kévin a bu un truc", t: "Kévin a avalé un flacon sans étiquette « pour goûter ». Il éternue désormais des molécules. On récupère tout à la passoire." },
  { e: 1, k: "gain", n: "Trésor sous l’établi", t: "En cherchant un tournevis, Kévin découvre sous l’établi un bocal de molécules oublié depuis 1987. Elles sont encore bonnes." },
  { e: 1, k: "buff", n: "Le cake de la voisine", t: "Mme Duchemin apporte un cake « pour que vous arrêtiez le bruit ». La surdose de sucre galvanise toute l’équipe. Le bruit redouble." },
  { e: 1, k: "buff", n: "Le chien bat la mesure", t: "Le chien des Martin aboie pile au tempo des réactions. Les molécules adorent et se synthétisent en cadence. Surtout, ne le faites pas taire." },
  { e: 1, k: "click", n: "Café trop serré", t: "Quelqu’un a remplacé le sucre du café par un réactif énergisant. Vos doigts tapent tout seuls. Profitez-en avant la descente." },
  { e: 1, k: "click", n: "L’éprouvette chatouilleuse", t: "L’éprouvette est devenue chatouilleuse. À chaque clic, elle glousse et recrache des molécules en rafale. Chatouillez sans pitié !" },
  { e: 1, k: "free", n: "Vide-grenier par-dessus la haie", t: "Mme Duchemin vide son grenier et jette par-dessus la haie tout ce qui « ressemble à de la science ». Le labo s’équipe gratuitement." },
  { e: 1, k: "free", n: "Les cousins de Kévin", t: "Kévin a invité ses cousins pour « un stage d’une journée ». Ils sont restés. Ils ne sont pas payés. Ils sont partout." },
  { e: 1, k: "gold", n: "Pistache a rapporté un truc", t: "Pistache, le chat de la voisine, dépose une fiole dorée sur le paillasson. Où l’a-t-il trouvée ? Personne n’ose lui demander." },
  { e: 1, k: "gold", n: "Erreur du facteur", t: "Le facteur livre par erreur un colis du Professeur Grinchard. Dedans : une fiole dorée et une lettre d’amour qu’il s’adresse à lui-même." },
  { e: 1, k: "storm", n: "Le congélateur a lâché", t: "Le vieux congélateur du garage rend l’âme : des dizaines de mini-fioles gelées roulent partout. Ramassez-les avant qu’elles fondent !" },
  { e: 1, k: "storm", n: "Gouttière fluo", t: "La gouttière du garage déborde d’un liquide fluo. Chaque goutte se solidifie en mini-fiole avant de toucher le sol. Tendez les mains !" },

  /* ---------- Ère 2 : l’Université ---------- */
  { e: 2, k: "gain", n: "Trois zéros de trop", t: "La comptabilité de l’université a ajouté trois zéros à la subvention du labo. Personne ne s’en plaint. Surtout pas {labo}." },
  { e: 2, k: "gain", n: "Kévin vend ses notes", t: "Kévin a vendu ses notes de cours aux étudiants de première année. Elles sont toutes fausses, mais très demandées. Le labo encaisse." },
  { e: 2, k: "buff", n: "Semaine des partiels", t: "C’est la semaine des partiels : terrifiés, les étudiants travaillent enfin. Le labo n’a jamais été aussi productif." },
  { e: 2, k: "buff", n: "Le comité part en séminaire", t: "Le comité d’éthique part en séminaire « Éthique et farniente » aux Baléares. Le labo en profite pour tout pousser à fond." },
  { e: 2, k: "click", n: "Thésard en panique", t: "Un thésard doit rendre sa thèse ce soir. Sa panique est contagieuse : vous cliquez sur la fiole comme si votre diplôme en dépendait." },
  { e: 2, k: "click", n: "Cours d’EPS détourné", t: "Le professeur d’EPS remplace les pompes par des séries de clics. Vos index sont désormais des athlètes de haut niveau." },
  { e: 2, k: "free", n: "Le doyen s’est endormi", t: "Le doyen s’est endormi en signant les bons de commande. Il en a signé une pile entière. Les livraisons arrivent déjà." },
  { e: 2, k: "free", n: "Une promo entière en stage", t: "Le service des stages a envoyé au labo une promo entière au lieu d’un seul étudiant. Ils sont déjà en blouse. Pas de retour possible." },
  { e: 2, k: "gold", n: "Distributeur détraqué", t: "Le distributeur de la cafétéria avale une pièce et recrache une fiole dorée. Une file d’attente se forme jusqu’au parking." },
  { e: 2, k: "gold", n: "Le trophée de Grinchard", t: "Le Professeur Grinchard égare sa fiole dorée « Meilleur chercheur de l’année », qu’il s’était décernée lui-même. Elle a roulé jusqu’ici." },
  { e: 2, k: "storm", n: "Bataille de fioles en amphi", t: "Chimistes et physiciens se livrent une bataille de fioles en plein amphi. Il en pleut de partout. Récupérez les munitions !" },
  { e: 2, k: "storm", n: "Lâcher de fin d’année", t: "Le bureau des élèves fête la fin des examens par un lâcher de mini-fioles depuis le toit. C’est festif, interdit et un peu toxique." },

  /* ---------- Ère 3 : la MégaCorp ---------- */
  { e: 3, k: "gain", n: "Entrée en Bourse", t: "{labo} entre en Bourse. L’action grimpe si haut qu’il faut affréter une fusée pour aller encaisser les molécules." },
  { e: 3, k: "gain", n: "Brevet sur l’eau mouillée", t: "Le service juridique a breveté le fait que l’eau mouille. Les redevances arrivent par camions entiers de molécules." },
  { e: 3, k: "buff", n: "Séminaire de motivation", t: "Le consultant en motivation crie « SYNERGIE ! » si fort que les machines y croient. Productivité en hausse, tympans en baisse." },
  { e: 3, k: "buff", n: "Feng shui moléculaire", t: "Un consultant réoriente tout l’open space selon les principes du feng shui moléculaire. Les ondes circulent, la production aussi." },
  { e: 3, k: "click", n: "Bouton « Cliquer plus fort »", t: "Le service informatique installe sur la fiole un bouton « Cliquer plus fort ». Il fonctionne. Personne ne sait pourquoi." },
  { e: 3, k: "click", n: "Concours du stagiaire du mois", t: "Concours interne : le stagiaire du mois sera celui qui clique le plus. Kévin s’échauffe les phalanges. Vous aussi, apparemment." },
  { b: "clonage", e: 3, k: "free", n: "Les clones se clonent", t: "Les clones de Kévin se sont clonés eux-mêmes pendant la pause déjeuner. Les RH renoncent à les compter et les déclarent « offerts »." },
  { e: 3, k: "free", n: "Grinchard en liquidation", t: "L’entreprise du Professeur Grinchard fait faillite. Ses machines sont bradées sur le trottoir. Le labo passe avant les éboueurs." },
  { e: 3, k: "gold", n: "Le porte-bonheur du PDG", t: "Le PDG laisse tomber sa fiole dorée porte-bonheur dans la cage d’ascenseur. Elle dévale les quatre-vingts étages. Attrapez-la !" },
  { e: 3, k: "storm", n: "Drone de livraison égaré", t: "Un drone de livraison confond le labo avec un entrepôt et largue des milliers de mini-fioles sur le parking. Servez-vous !" },
  { e: 3, k: "storm", n: "Accueil en surchauffe", t: "Le distributeur de cadeaux de l’accueil s’emballe et crache des fioles-souvenirs à la chaîne. Les actionnaires se jettent dessus." },
  { e: 3, k: "chaos", n: "Fusion des services", t: "Les RH, le marketing et la chimie fusionnent en un seul service. Personne ne sait ce qu’il fait. Ça pourrait être génial. Ou pas." },

  { e: 4, k: "gain", n: "Fuite au réacteur !", t: "Fuite au réacteur ! Rassurez-vous : il ne fuit que des molécules. On a mis des seaux. Les seaux débordent." },
  { e: 4, k: "gain", n: "Hortensias à l’eau lourde", t: "Arrosés par Kévin à l’eau lourde, les hortensias de Mme Duchemin donnent des molécules au lieu de fleurs. Elle accepte de partager." },
  { e: 4, k: "buff", n: "Le gros bouton rouge", t: "Kévin a appuyé sur le gros bouton rouge « pour voir ». Le réacteur passe en mode turbo. Personne ne trouve le bouton vert." },
  { e: 4, k: "buff", n: "Le réacteur a le hoquet", t: "Le réacteur à fusion a le hoquet. Chaque « hic » libère une bouffée d’énergie. Personne n’ose lui faire peur pour l’arrêter." },
  { e: 4, k: "click", n: "Doigts phosphorescents", t: "Après une visite un peu longue près du réacteur, vos doigts brillent dans le noir. Ils cliquent aussi beaucoup plus fort." },
  { e: 4, k: "click", n: "La souris a muté", t: "Une souris de labo irradiée a développé des biceps énormes. Elle s’entraîne sur la fiole avec vous. Ne la contrariez pas." },
  { e: 4, k: "free", n: "Fission immobilière", t: "Une réaction en chaîne s’emballe : les bâtiments du labo se divisent par fission. Chaque moitié est un bâtiment entier. Merci, la physique !" },
  { e: 4, k: "free", n: "Le comité capitule", t: "Le comité d’éthique, assommé par un exposé de quatorze heures, restitue toutes les machines saisies l’an dernier. Il demande une sieste." },
  { e: 4, k: "gold", n: "L’isotope prétentieux", t: "Le réacteur produit un isotope inconnu, doré et légèrement prétentieux. Il exige d’être mis en fiole et admiré. Admirez-le vite." },
  { e: 4, k: "storm", n: "Retombées en fioles", t: "Le panache du réacteur retombe en pluie de mini-fioles sur toute la région. Les parapluies ne servent à rien. Les seaux, si." },
  { e: 4, k: "storm", n: "Le compteur Geiger s’affole", t: "Le compteur Geiger crépite si fort qu’il fait trembler les étagères. Des dizaines de fioles dégringolent. Rattrapez-les au vol !" },
  { e: 4, k: "chaos", n: "Pistache dans le réacteur", t: "Pistache s’est enfermé dans le cœur du réacteur. Il est à la fois en pleine forme et pas du tout. Ouvrir la trappe aura des conséquences." },

  { e: 5, k: "gain", n: "La Lune demande l’asile", t: "Lassée de tourner en rond, la Lune demande l’asile au labo. En gage de bonne foi, elle verse un plein cratère de molécules." },
  { e: 5, k: "gain", n: "Loyer orbital", t: "Les satellites garés sur l’orbite du labo reçoivent enfin leur avis de loyer. Ils paient en molécules, avec un léger décalage du signal." },
  { e: 5, k: "buff", n: "Apesanteur euphorique", t: "La station passe en apesanteur totale. Libérées de la gravité, les molécules se synthétisent en dansant. La production décolle." },
  { e: 5, k: "buff", n: "Seize levers de Soleil", t: "En orbite, le Soleil se lève toutes les quatre-vingt-dix minutes. L’équipe enchaîne les cafés du matin. Les machines aussi." },
  { e: 5, k: "click", n: "Gants de scaphandre motorisés", t: "Kévin oublie ses gants de scaphandre motorisés sur votre bureau. Vous les enfilez. Grosse erreur. Excellente erreur." },
  { e: 5, k: "click", n: "Pistache en apesanteur", t: "Pistache s’est glissé dans la fusée de ravitaillement. En apesanteur, il tape la fiole de la patte. Vous l’imitez : c’est redoutable." },

  { e: 5, k: "storm", n: "Pluie de micrométéorites", t: "La station traverse une pluie de micrométéorites. Au contact du blindage, chacune se change en mini-fiole. Le hublot est ouvert, allez-y !" },
  { e: 5, k: "storm", n: "Grand nettoyage orbital", t: "Les débris spatiaux recyclés par le labo retombent en mini-fioles. Attrapez-les avant leur rentrée dans l’atmosphère !" },
  { e: 5, k: "chaos", n: "Kévin a ouvert le sas", t: "Kévin a ouvert le sas « pour aérer ». Tout le labo s’envole dans l’espace puis revient, mais pas forcément dans le bon ordre." },
  { e: 5, k: "chaos", n: "Grinchard percute la station", t: "La montgolfière orbitale du Professeur Grinchard percute la station. Tous les boutons du tableau de bord s’enfoncent en même temps." },

  { e: 6, k: "gain", n: "Le cadeau de Pistache", t: "Pistache revient d’un portail en traînant une souris géante faite de molécules pures. Mme Duchemin refuse qu’on la lui rende." },
  { e: 6, k: "buff", n: "Les Kévin synchronisés", t: "Les Kévin de quatorze dimensions renversent le même flacon au même instant. L’onde de choc dope toute la production." },

  { e: 6, k: "chaos", n: "Vous-même emprunte du sel", t: "Un vous-même d’une autre dimension vient emprunter du sel. En partant, il appuie sur un bouton au hasard « pour rendre service »." },
  { e: 6, k: "chaos", n: "Douze Mme Duchemin", t: "Douze Mme Duchemin venues de douze dimensions se plaignent en même temps. La réalité vibre. Les machines font n’importe quoi." },
  { e: 6, k: "chaos", n: "Portail branché à l’envers", t: "Le portail est branché à l’envers : la gauche est à droite, le haut est dedans et Kévin est compétent. Tout peut arriver." },
  { b: "chrono", e: 6, k: "chaos", n: "Le temps bégaie", t: "Le Chronolabo a avalé une seconde de travers. Le temps bé… bé… bégaie. Personne ne sait ce qui va se passer. Ni quand. Ni combien de fois." },

  { e: 7, k: "gain", n: "Kévin vendu aux touristes", t: "Des touristes de Véga achètent toute la boutique de souvenirs, y compris Kévin. On rachète Kévin. Il reste un joli bénéfice." },
  { e: 7, k: "buff", n: "Une étoile amoureuse", t: "Une étoile captive tombe amoureuse du labo et brille de toutes ses forces pour l’impressionner. La forge en profite. Ne lui dites rien." },

  { e: 7, k: "click", n: "La Grande Pipette s’en mêle", t: "Les astronomes baptisent une constellation « la Grande Pipette ». Flattée, elle vient cliquer sur la fiole avec vous, depuis le ciel." },
  { e: 7, k: "free", n: "Soldes de la Voie lactée", t: "La Voie lactée fait ses soldes de fin de cycle. Le labo repart avec des forges entières, offertes pour l’achat d’une nébuleuse." },
  { e: 7, k: "free", n: "Le Crabe se reconvertit", t: "La nébuleuse du Crabe, lassée d’être un crabe, se reconvertit en zone industrielle et rejoint le labo avec tout son matériel." },
  { e: 7, k: "gold", n: "Dent en or stellaire", t: "Une naine blanche perd une dent en or en heurtant la forge. La dent a la forme d’une fiole. Elle ne la réclamera pas : elle a honte." },

function NQ(get, fbName) { const o = TX(get, null); return { n: (o && o.n) || fbName, q: (o && o.q) || '' }; }

// Typographie française homogène : espaces fines insécables avant ; ! ? » % et après «, insécable avant :, apostrophes courbes
const NNB = '\u202f', NB = '\u00a0';
function TYPO(s, apos = true) {
  if (typeof s !== 'string') return s;
  if (apos) s = s.replace(/([A-Za-z\u00c0-\u00ff\u0152\u0153])'(?=[A-Za-z\u00c0-\u00ff\u0152\u0153])/g, '$1\u2019');
  return s.replace(/«[ \u00a0\u202f]*/g, '«' + NNB).replace(/[ \u00a0\u202f]*([;!?»%])/g, (m, c) => (c === '!' || c === '?' ? (/\S/.test(m[0]) && m.length === 1 ? m : NNB + c) : NNB + c)).replace(/ :/g, NB + ':');
}
function typoAll(o) { for (const k in o) { const v = o[k]; if (typeof v === 'string') o[k] = TYPO(v); else if (v && typeof v === 'object') typoAll(v); } }

// Fusion récursive avec les valeurs par défaut (compatibilité des sauvegardes)
function mergeDefaults(def, obj) {
  if (obj == null || typeof obj !== 'object' || Array.isArray(def)) return obj == null ? def : obj;
  const out = {};
  for (const k in def) {
    const dv = def[k], ov = obj[k];
    if (ov === undefined) out[k] = dv;
    else if (dv && typeof dv === 'object' && !Array.isArray(dv) && Object.keys(dv).length) out[k] = mergeDefaults(dv, ov);
    else out[k] = ov;
  }
  for (const k in obj) if (!(k in out)) out[k] = obj[k];
  return out;
}
function sanitize(st) {
  const D = defaultState();
  ['b', 'up', 'prestige', 'chalDone', 'ach', 'flags'].forEach(k => { if (!st[k] || typeof st[k] !== 'object' || Array.isArray(st[k])) st[k] = {}; });
  if (!st.petri || typeof st.petri !== 'object') st.petri = D.petri;
  if (!st.set || typeof st.set !== 'object') st.set = D.set;
  if (!st.petri.disc || typeof st.petri.disc !== 'object') st.petri.disc = { levure: true, moisi: true };
  const int = (v, a, b, d) => Number.isFinite(v) ? Math.min(b, Math.max(a, Math.floor(v))) : d;
  st.era = int(st.era, 0, 8, 0); st.eraMax = Math.max(st.era, int(st.eraMax, 0, 8, 0));
  ['anoClicks', 'offlineTotal', 'bestRun', 'chalTime', 'incidents', 'lastTick', 'lastSave', 'created'].forEach(k => { if (!Number.isFinite(st[k]) || st[k] < 0) st[k] = k === 'lastTick' || k === 'lastSave' || k === 'created' ? U.now() : 0; });
  ['harvests', 'plants', 'omega'].forEach(k => { st.petri[k] = int(st.petri[k], 0, 1e15, 0); });
  if (!Number.isFinite(st.petri.timer) || st.petri.timer <= 0 || st.petri.timer > 120) st.petri.timer = 60;
  if (!SMAP[st.petri.sel]) st.petri.sel = 'levure';
  st.set.speed = [1, 10, 100].includes(st.set.speed) ? st.set.speed : 1;
  st.set.vol = Number.isFinite(st.set.vol) ? U.clamp(st.set.vol, 0, 1) : 0.6;
  if (!['long', 'short', 'sci'].includes(st.set.format)) st.set.format = 'long';

function serialize() { S.lastSave = U.now(); return JSON.stringify(S, (k, v) => typeof v === 'number' && !isFinite(v) ? (v > 0 ? Number.MAX_VALUE : 0) : v); }
let LAST_BACKUP = 0;

    if (prev && readable(prev) && (manual || Date.now() - LAST_BACKUP > 600000)) { store.set(BACKUP_KEY, prev); LAST_BACKUP = Date.now(); }
    const ok = store.set(SAVE_KEY, data);

    if (manual) toast(ok ? 'Partie sauvegardée !' : 'Sauvegarde en mémoire seulement (stockage indisponible) — pensez à exporter.', ok ? 'save' : 'warn');
    return ok;

}
function loadFrom(json) {
  const obj = typeof json === 'string' ? JSON.parse(json) : json;

  return sanitize(mergeDefaults(defaultState(), obj));
}

// Export / import : chaîne texte portable
function b64enc(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)); return btoa(bin); }

// Import tolérant : ignore espaces, retours à la ligne, caractères invisibles ajoutés par iOS, texte autour…
function importSave(str) {
  str = String(str || '');
  if (!str.trim()) throw new Error('rien à importer.');
  const INCOMPLET = 'le texte semble incomplet ou abîmé. Copiez bien TOUT le texte, du début « LABO1: » jusqu\u2019à la toute fin (ou utilisez « Télécharger » / « Charger un fichier »).';
  const m = str.match(/LABO1\s*[:：]/i);
  let json;
  const raw = (m ? str.slice(m.index + m[0].length) : str).trim();
  if (!m && raw[0] === '{') json = raw;
  else {
    const run = raw.match(/^[A-Za-z0-9+/=_\-\s\u200b-\u200d\u2060\ufeff]+/);
    // le texte collé peut être suivi d'autres mots : on essaie en retirant les mots de fin un par un
    const tokens = (run ? run[0] : raw).split(/[\s\u200b-\u200d\u2060\ufeff]+/).filter(Boolean);
    for (let k = tokens.length; k >= 1 && json == null; k--) {
      let body = tokens.slice(0, k).join('').replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/=]/g, '');
      body = body.replace(/=+$/, '').replace(/=/g, '');
      if (!body.length || body.length % 4 === 1) continue;
      while (body.length % 4) body += '=';
      try { const j = b64dec(body); JSON.parse(j); json = j; } catch (e) { }
    }
    if (json == null) throw new Error(INCOMPLET);
  }
  let st;
  try { st = loadFrom(json); } catch (e) { throw new Error(INCOMPLET); }
  const prev = store.get(SAVE_KEY); if (prev && readable(prev)) store.set(BACKUP_KEY, prev);
  S = st;
  return true;
}
function hardReset() {
  const keepSet = Object.assign({}, S.set, { dev: false, god: false, speed: 1 });
  store.del(SAVE_KEY);
  S = defaultState();
  S.set = Object.assign(S.set, keepSet);
}

/* ===================== MOTEUR ===================== */
// G = valeurs calculées (non sauvegardées)
const G = {
  cps: 0, cpsNoBuff: 0, click: 1, unit: {}, bcps: {}, totalB: 0, upCount: 0, types: 0, rep: 0, achN: 0,
  bCostMult: 1, uCostMult: 1, growth: 1.15, goldFreq: 1, goldStay: 13, goldDur: 1, eurekaSpeed: 1, eurekaDur: 10,
  petri: { cps: 0, gold: 0, click: 0, bcost: 0, gdur: 0, ucost: 0, eureka: 0, schro: 0 },
  mults: [], dirty: true, unlockedUps: [], upsKey: '', era: 0,

const n = id => S.b[id] || 0;

}
function secret(key) { if (!S.flags['s_' + key]) { S.flags['s_' + key] = true; checkAch(); } }

function recalc() {
  let totalB = 0, types = 0;
  B_IDS.forEach(id => { totalB += n(id); if (n(id) > 0) types++; });
  const nonPip = totalB - n('pipette');
  const dbl = {}; B_IDS.forEach(id => dbl[id] = 0);
  let cafeAdd = 0, cafeMult = 1, pipD = 0, upCount = 0, prov = 1, clickPct = 0.01; // chaque clic rapporte d'office 1 % de la production
  const specs = [], syns = [], repFs = [], gold = [];
  for (const id in S.up) {
    const u = UPMAP[id]; if (!u) continue; upCount++;
    switch (u.type) {
      case 'tier':
        if (u.b === 'pipette') { if (u.k < 3) pipD++; else if (u.cafe === 'add') cafeAdd = 0.1; else cafeMult *= u.cafe; }
        else dbl[u.b]++;
        break;
      case 'spec': specs.push(u); break;
      case 'syn': syns.push(u); break;
      case 'prov': prov *= 1 + u.pct; break;
      case 'clickpct': clickPct += 0.02; break;
      case 'goldup': gold[u.k] = true; break;
      case 'rep': repFs.push(u.f); break;
    }
  }
  // Effets de la boîte de Petri (cultures mûres)
  const pe = G.petri = { cps: 0, gold: 0, click: 0, bcost: 0, gdur: 0, ucost: 0, eureka: 0, schro: 0 };
  if (petriOpen()) {
    const sz = petriSize();
    for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) {
      const c = S.petri.grid[y * 7 + x];
      if (!c || c.s === 'dead') continue;
      const st = SMAP[c.s]; if (!st || c.a < st.grow) continue;
      for (const k in st.eff) {
        if (k === 'schro') { if (S.petri.schro) pe.cps += st.eff.schro; pe.schro++; }
        else pe[k] += st.eff[k];
      }
    }
  }
  const cafe = cafeAdd * cafeMult * nonPip;
  const mult = {}; B_IDS.forEach(id => mult[id] = Math.pow(2, dbl[id]));
  const specX = pn('spec') ? 2 : 1, synX = pn('syn') ? 2 : 1;
  specs.forEach(u => { mult.stagiaire *= 2; mult[u.b] *= 1 + 0.01 * specX * n('stagiaire') / u.per; });
  syns.forEach(u => { mult[u.a] *= 1 + 0.05 * synX * n(u.c); mult[u.c] *= 1 + 0.001 * synX * n(u.a); });
  let base = 0;
  BUILDINGS.forEach(b => {
    const unit = b.id === 'pipette' ? b.cps * Math.pow(2, pipD) + cafe : b.cps * mult[b.id];
    G.unit[b.id] = unit; G.bcps[b.id] = unit * n(b.id); base += G.bcps[b.id];
  });
  // Multiplicateurs globaux
  const M = [];
  let gm = prov; if (prov > 1) M.push(['Provisions', prov]);
  const achN = achCount();
  const rep = achN * 0.04 * (1 + (pn('rep1') ? 0.1 : 0) + (pn('rep2') ? 0.2 : 0));
  let rm = 1; repFs.forEach(f => rm *= 1 + rep * f); gm *= rm; if (rm > 1) M.push(['Hiérarchie académique', rm]);
  const nm = 1 + nobelBonusN() * nobelEff(); gm *= nm; if (nm > 1) M.push(['Prix Nobel', nm]);
  let fm = 1;
  [['fond', 1.1], ['boost2', 1.15], ['boost3', 1.2], ['boost4', 1.25], ['boost5', 1.5], ['boost6', 2], ['boost7', 3], ['boost8', 5], ['fin', 10]].forEach(([id, m]) => { if (pn(id)) fm *= m; });
  gm *= fm; if (fm > 1) M.push(['Fondation Nobel', fm]);
  let cm = 1;
  if (chalDone('noclick')) cm *= 1.1;
  if (chalDone('minimal')) cm *= 1 + 0.01 * types;
  if (chalDone('cap10')) cm *= 1.25;
  if (chalDone('grand')) cm *= 2;
  if (chalDone('speedrun') && S.runTime < 600) cm *= 3;
  gm *= cm; if (cm !== 1) M.push(['Protocoles réussis', cm]);
  if (pe.cps) { gm *= 1 + pe.cps; M.push(['Boîte de Petri', 1 + pe.cps]); }
  if (S.era > 0) { const em = Math.pow(1.25, S.era); gm *= em; M.push(['Changements de paradigme (ères)', em]); }
  if (inChal('entropy')) { gm *= 0.1; M.push(['Entropie', 0.1]); }
  G.cpsNoBuff = base * gm;
  let bm = 1, km = 1;
  S.buffs.forEach(bf => { if (bf.cps) bm *= bf.cps; if (bf.click) km *= bf.click; });
  if (bm !== 1) M.push(['Effets temporaires', bm]);
  G.cps = G.cpsNoBuff * bm;
  G.gmAll = gm * bm;
  G.mults = M; G.rep = rep; G.achN = achN; G.totalB = totalB; G.types = types; G.upCount = upCount; G.clickPct = clickPct;
  // Clic
  let click = Math.pow(2, pipD) + cafe;
  click *= (pn('click1') ? 2 : 1) * (pn('click2') ? 3 : 1) * (1 + pe.click);
  click += G.cps * clickPct;
  click *= km;
  if (inChal('noclick')) click = 0;
  G.click = click;
  // Coûts
  let bcm = (pn('cheap1') ? 0.98 : 1) * (pn('cheap2') ? 0.97 : 1) * (pn('cheap3') ? 0.95 : 1) * (chalDone('budget') ? 0.97 : 1) * Math.max(0.5, 1 - pe.bcost);
  if (inChal('budget')) bcm *= 10;
  G.bCostMult = bcm;
  G.uCostMult = (pn('upcheap1') ? 0.95 : 1) * (pn('upcheap2') ? 0.9 : 1) * (chalDone('noupgrade') ? 0.9 : 1) * Math.max(0.5, 1 - pe.ucost);
  G.growth = inChal('inflation') ? 1.25 : chalDone('inflation') ? 1.145 : 1.15;
  // Fioles dorées
  G.goldFreq = (gold[0] ? 2 : 1) * (gold[1] ? 2 : 1) * (1 + (pn('gold1') ? 0.05 : 0) + (chalDone('nogold') ? 0.15 : 0) + pe.gold);
  G.goldStay = 13 * (gold[0] ? 2 : 1) * (gold[1] ? 2 : 1) * (pn('gold3') ? 2 : 1) * (gold[4] ? 1.5 : 1);
  G.goldDur = (gold[2] ? 2 : 1) * (1 + (pn('gold2') ? 0.1 : 0) + (chalDone('entropy') ? 0.2 : 0) + pe.gdur);
  G.stormMult = gold[3] ? 2 : 1; G.chainMult = (gold[5] ? 2 : 1) * (pn('lucky') ? 2 : 1);
  G.eurekaSpeed = (pn('eureka1') ? 1.5 : 1) * (1 + pe.eureka);
  G.eurekaDur = 10 * (pn('eureka1') ? 1.5 : 1);
  G.ghost = inChal('noclick') ? 0 : pn('ghost2') ? 5 : pn('ghost1') ? 1 : 0;

}

/* ---------- Gains ---------- */
const NMAX = Number.MAX_VALUE;
function earn(amount, handmade) {
  if (!(amount > 0)) return;
  if (amount > NMAX) amount = NMAX;
  S.bank = Math.min(NMAX, S.bank + amount); S.runEarned = Math.min(NMAX, S.runEarned + amount); S.allEarned = Math.min(NMAX, S.allEarned + amount);
  if (handmade) { S.handmade = Math.min(NMAX, S.handmade + amount); S.handmadeAll = Math.min(NMAX, S.handmadeAll + amount); }
}
function canAfford(cost) { return godMode() || S.bank >= cost; }
function spend(cost) { if (!godMode()) S.bank = Math.max(0, S.bank - cost); }

/* ---------- Bâtiments ---------- */
function bCost(id, owned) { return Math.ceil(BMAP[id].cost * Math.pow(G.growth, owned == null ? n(id) : owned) * G.bCostMult); }
function bCostBulk(id, amt) {
  const g = G.growth, c0 = BMAP[id].cost * Math.pow(g, n(id)) * G.bCostMult;
  return Math.ceil(c0 * (Math.pow(g, amt) - 1) / (g - 1));
}
function bLimit(id) { // nombre max achetable selon les protocoles (Infinity sinon)
  let lim = Infinity;
  if (inChal('cap10')) lim = Math.min(lim, Math.max(0, 10 - n(id)));
  if (inChal('minimal') && n(id) === 0 && G.types >= 3) lim = 0;
  return lim;
}
function bMaxBuy(id) {
  if (godMode()) return Math.min(bLimit(id), 100);
  const g = G.growth, c0 = BMAP[id].cost * Math.pow(g, n(id)) * G.bCostMult;
  let k = Math.floor(Math.log(S.bank * (g - 1) / c0 + 1) / Math.log(g));
  if (!isFinite(k) || k < 0) k = 0;
  while (k > 0 && bCostBulk(id, k) > S.bank) k--;
  return Math.min(k, bLimit(id));
}
function buyAmount(id) {
  const a = S.set.buyAmt, lim = bLimit(id);
  if (lim <= 0) return 0;
  if (a === -1) return Math.max(1, bMaxBuy(id));
  return Math.min(a, lim);
}
function buyBuilding(id) {
  const amt = buyAmount(id);
  if (amt <= 0) { SFX.play('error'); return false; }
  const cost = bCostBulk(id, amt);
  if (!canAfford(cost)) { SFX.play('error'); return false; }
  const before = S.bank;
  spend(cost);
  if (!n(id)) S.lastNewT = S.runTime; // nouveau type de bâtiment dans cette partie : le labo avance
  S.b[id] = n(id) + amt;
  if (amt >= 100) secret('bulk');
  if (cost >= 1e6 && S.bank < cost * 0.01 && before >= cost && !godMode()) secret('broke');
  recalc(); updateEra(); checkUnlocks(); checkAch();
  SFX.play('buy');
  return true;
}
function sellBuilding(id) {
  const a = S.set.buyAmt === -1 ? n(id) : Math.min(S.set.buyAmt, n(id));
  if (a <= 0) return false;
  let refund = 0;
  for (let i = 0; i < a; i++) refund += bCost(id, n(id) - 1 - i) * 0.25;
  S.b[id] = n(id) - a; S.bank = Math.min(NMAX, S.bank + (isFinite(refund) ? refund : NMAX)); S.sold += a;
  secret('sell1'); if (S.sold >= 100) secret('sell100');
  recalc(); checkUnlocks(); checkAch();
  SFX.play('sell');
  return true;
}

/* ---------- Améliorations ---------- */
function upCost(u) { return Math.ceil(u.cost * G.uCostMult); }
function upUnlocked(u) {
  switch (u.type) {
    case 'tier': return n(u.b) >= u.reqN;
    case 'spec': return n(u.b) >= 15 && n('stagiaire') >= 1;
    case 'syn': return n(u.a) >= 15 && n(u.c) >= 15;
    case 'prov': return S.runEarned >= u.cost * 0.3;
    case 'clickpct': return S.clicksAll >= u.req && S.runEarned >= u.cost * 0.05;
    case 'goldup': return S.goldClicks >= u.req;
    case 'rep': return G.achN >= u.req;
  }
  return false;
}
function checkUnlocks() {
  const list = [];
  for (const u of UPGRADES) if (!S.up[u.id] && upUnlocked(u)) list.push(u);
  list.sort((a, b) => a.cost - b.cost || a.order - b.order);
  const key = list.map(u => u.id).join(',');
  if (key !== G.upsKey) { G.upsKey = key; G.unlockedUps = list; UI.dirtyUps = true; }
}
function buyUp(u, silent) {
  if (S.up[u.id] || !upUnlocked(u)) return false;
  if (inChal('noupgrade')) { if (!silent) { toast('Protocole en cours : améliorations interdites !', 'warn'); SFX.play('error'); } return false; }
  const c = upCost(u);

  spend(c); S.up[u.id] = 1;

}
