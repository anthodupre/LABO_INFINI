  let k = 0;
  const list = G.unlockedUps.slice().sort((a, b) => upCost(a) - upCost(b));
  for (const u of list) { if (canAfford(upCost(u)) && buyUp(u, true)) k++; else if (!godMode()) break; }

/* ---------- Clic & Eurêka ---------- */

function eraFromBuildings() { let e = 0; for (let i = 0; i < ERA_REQ.length; i++) if (n(B_IDS[ERA_REQ[i]]) > 0) e = i; return e; }

/* ---------- Prestige : publication & Nobel ---------- */
function nobelsFor(all) { return Math.floor(Math.cbrt(all / NOBEL_BASE) + 1e-9); }
// au-delà de 1000 Nobels, le bonus de production croît en racine carrée (évite l'emballement)
// Bonus des prix Nobel (en « points de % » avant le multiplicateur nobelEff) : les 10 premiers valent +10 % chacun
// (la 1re publication doit se sentir), puis +1 % chacun jusqu'à 100, puis racine carrée (évite l'emballement).
function nobelBonusN() { const N = S.nobels; return (N <= 100 ? N : 100 * Math.sqrt(N / 100)) + 9 * Math.min(N, 10); }
function nobelEff() { return 0.01 * (pn('nobel1') ? 1.25 : 1) * (pn('nobel2') ? 1.5 : 1) * (pn('nobel3') ? 2 : 1); }
// Multiplicateur de production qu'apporterait une publication maintenant (effet des prix Nobel seulement)
function publishGainRatio() {
  const p = pendingNobels(); if (p <= 0) return 1;
  const N0 = S.nobels, cur = 1 + nobelBonusN() * nobelEff();
  S.nobels = N0 + p; const nxt = 1 + nobelBonusN() * nobelEff(); S.nobels = N0;
  return nxt / cur;
}
function pendingNobels() { return Math.max(0, nobelsFor(S.allEarned) - S.nobels); }
function nextNobelAt() { const t = nobelsFor(S.allEarned) + 1; return Math.pow(t, 3) * NOBEL_BASE; }
function resetRun() {
  const keep = { goldT: U.rand(150, 300), anoT: U.rand(1200, 2400) };
  Object.assign(S, defaultRun(), keep);
  S.petri.grid = Array(49).fill(null);
  // Kits de départ
  const kit = {};
  if (pn('kit1')) { kit.pipette = 10; kit.stagiaire = 5; }
  if (pn('kit2')) { kit.pipette = 50; kit.stagiaire = 25; kit.bunsen = 10; }
  if (pn('kit3')) B_IDS.slice(0, 6).forEach(id => kit[id] = 100);
  for (const id in kit) S.b[id] = kit[id];
  if (inChal('cap10')) for (const id in S.b) S.b[id] = Math.min(10, S.b[id]);
  if (inChal('minimal')) { const ids = Object.keys(S.b).filter(id => S.b[id] > 0); ids.slice(3).forEach(id => delete S.b[id]); }
  G.upsKey = ''; recalc(); S.era = 0; updateEra(); checkUnlocks();
  SCENE.dirtyBg = true; UI.dirtyAll = true;
}
function publish() {
  const gain = pendingNobels();
  if (gain <= 0) secret('emptypub');
  S.nobels += gain; S.nobelPts += gain; S.publishes++;
  if (S.runEarned > S.bestRun) S.bestRun = S.runEarned;
  if (S.challenge) { S.challenge = null; }
  resetRun();
  checkAch(); saveGame();
  SFX.play('publish');
  return gain;
}
function buyNode(id) {
  const p = PMAP[id];
  if (!p || S.prestige[id]) return false;
  if (p.req && !S.prestige[p.req]) return false;
  if (S.nobelPts < p.cost && !godMode()) { SFX.play('error'); return false; }
  if (!godMode()) S.nobelPts -= p.cost;
  S.prestige[id] = 1;
  if (PRESTIGE.every(q => S.prestige[q.id])) secret('alltree');
  recalc(); checkUnlocks(); checkAch(); SFX.play('upgrade');
  return true;
}

/* ---------- Protocoles ---------- */
function startChallenge(id) {
  publish();
  S.challenge = id; S.chalStart = U.now(); S.chalTime = 0;
  resetRun();
  saveGame();
}
function abandonChallenge() { S.challenge = null; recalc(); checkUnlocks(); UI.dirtyAll = true; }
function checkChallenge(dt) {
  const c = S.challenge; if (!c) return;
  S.chalTime += dt;
  if (c === 'speedrun' && S.chalTime > 20 * 60 && !godMode()) {
    S.challenge = null; secret('tooslow'); recalc(); UI.dirtyAll = true;
    modal('Protocole échoué', '<p>Le chronomètre a sonné : 20 minutes écoulées. Le comité d’éthique vous regarde avec pitié.</p><p>Les restrictions sont levées, la partie continue normalement.</p>', null, true);
    return;
  }
  if (S.runEarned >= CMAP[c].goal) {
    S.chalDone[c] = true; S.challenge = null;
    recalc(); checkUnlocks(); checkAch(); UI.dirtyAll = true;
    SFX.play('ach');
    journal('chal', 'Protocole réussi : <b>' + U.esc(CMAP[c].name) + '</b>');
    modal('Protocole réussi !', '<p class="big">' + U.esc(CMAP[c].name) + '</p><p>Récompense permanente : ' + CMAP[c].reward + '</p><p>Les restrictions sont levées, la partie continue normalement.</p>', null, true);
  }
}

/* ---------- Boucle logique ---------- */
let achTimer = 0, unlockTimer = 0, stallTimer = 0;
function tick(dt) {
  // dt en secondes (déjà multiplié par la vitesse DEV)
  S.runTime += dt; S.playTime += dt; G.idleT = (G.idleT || 0) + dt;
  // Production
  if (G.dirty) recalc();
  earn(G.cps * dt, false);
  // Pipette fantôme
  if (G.ghost > 0) {
    G.ghostAcc = (G.ghostAcc || 0) + dt * G.ghost;
    while (G.ghostAcc >= 1) { G.ghostAcc -= 1; const g = clickVessel(false); if (G.ready) SCENE.ghostClick(g); }
  }
  // Buffs
  let changed = false;
  for (const b of S.buffs) { b.t -= dt; if (b.t <= 0) changed = true; }
  if (changed) { S.buffs = S.buffs.filter(b => b.t > 0); recalc(); UI.dirtyBuffs = true; }
  // Eurêka : décroissance
  G.eurekaIdle = (G.eurekaIdle || 0) + dt;
  if (G.eurekaIdle > 1.5 && S.eureka > 0) S.eureka = Math.max(0, S.eureka - 6 * dt);
  // Bonus du protocole « course » (expire à 10 min)
  if (chalDone('speedrun') && S.runTime - dt < 600 && S.runTime >= 600) recalc();
  // Fioles dorées
  GOLD.update(dt);
  // Petri & incidents
  petriUpdate(dt);
  INC.update(dt);
  // Protocoles
  checkChallenge(dt);
  // Contrôles périodiques
  achTimer += dt; unlockTimer += dt; stallTimer += dt;
  if (stallTimer > 5) { stallTimer = 0; checkStall(); }
  if (unlockTimer > 0.5) { unlockTimer = 0; checkUnlocks(); }
  if (achTimer > 1) {
    achTimer = 0; checkAch();
    if (G.cps > S.bestCps) S.bestCps = G.cps;
    if (G.idleT > 1800) secret('idle');
    if (S.playTime > 86400) secret('insomnia');
    if (B_IDS.every(id => n(id) > 0)) secret('collector');
  }
}

/* ---------- Progression constante : conseiller de publier quand le labo stagne ---------- */
// Stagnation = aucun nouveau type de bâtiment depuis 20 min dans cette partie, et le prochain n'est pas à moins de
// 10 min. On conseille de publier seulement si ça multiplierait la production d'au moins ×1,5 (×1,3 pour la toute
// 1re publication). Rappel au plus toutes les 45 min ET si les Nobels disponibles ont doublé (gardé dans la sauvegarde :
// une relance de l'app ne répète pas le conseil).
function checkStall() {
  if (!G.ready || S.challenge || S.runTime - (S.lastNewT || 0) < 1200) return;
  const p = pendingNobels();
  if (S.nudgeAt != null && (S.runTime - S.nudgeAt < 2700 || p < 2 * (S.nudgeN || 1))) return;
  const next = B_IDS.find(id => !n(id) && bLimit(id) > 0);
  if (next && (bCost(next) - S.bank) / Math.max(G.cps, 1e-9) < 600) return;
  const r = publishGainRatio(); if (r < (S.nobels ? 1.5 : 1.3)) return;
  S.nudgeAt = S.runTime; S.nudgeN = p;
  const msg = 'Le labo plafonne. <b>Publiez vos travaux</b> (onglet Nobel) : <b>+' + fmtNom(p, 'prix Nobel', 'prix Nobel') +
    '</b>, production <b>×' + dec(r, r < 10 ? 1 : 0) + '</b> pour toujours. Vous repartirez de zéro, mais bien plus vite.';
  toast(msg, 'ach', 'i_nobel', 'Conseil du comité Nobel', 10000);
  journal('nobel', msg); markTab('nobel');
}

/* ---------- Hors-ligne ---------- */
function offlineParams() {
  if (pn('auto4')) return [1, 7 * 86400];
  if (pn('auto3')) return [1, 48 * 3600];
  if (pn('auto2')) return [0.6, 16 * 3600];
  if (pn('auto1')) return [0.3, 8 * 3600];
  return [0.25, 4 * 3600];
}
function applyOffline(sec) {
  if (sec < 5) return null;
  if (sec > 7 * 86400) secret('holiday');
  const [pct0, cap] = offlineParams();
  const pct = sec < 60 ? 1 : pct0; // courte suspension (changement d'app) : comptée en entier
  const eff = Math.min(sec, cap);
  S.runTime += sec; S.offlineTotal += sec;
  if (S.challenge) S.chalTime += sec;
  // les effets temporaires s'écoulent pendant l'absence (au lieu d'être effacés)
  S.buffs.forEach(b => b.t -= sec); S.buffs = S.buffs.filter(b => b.t > 0);
  recalc(); UI.dirtyBuffs = true;
  const gain = G.cpsNoBuff * eff * pct;
  earn(gain, false);
  // Petri : cycles écoulés (limités)
  petriOffline(sec);
  GOLD.offline(sec);
  recalc();
  return { sec, eff, pct, gain };
}

/* ===================== BOÎTE DE PETRI (mini-jeu) ===================== */
function petriOpen() { return n('microscope') > 0; }
function petriSize() {
  const m = n('microscope');
  let s = m >= 300 ? 6 : m >= 150 ? 5 : m >= 50 ? 4 : 3;
  if (pn('petri3')) s++;
  return Math.min(7, s);
}
function petriInterval() { return pn('petri1') ? 30 : 60; }
function strainCost(st) { return Math.max(st.cost * G.cpsNoBuff, 50 * (STRAINS.indexOf(st) + 1)); }
function petriStage(c) { // 0,1,2 = stades ; -1 morte
  if (!c || c.s === 'dead') return -1;
  const st = SMAP[c.s]; if (c.a >= st.grow) return 2; if (c.a >= st.grow / 2) return 1; return 0;
}
function petriUpdate(dt) {
  if (!petriOpen()) return;
  S.petri.timer -= dt;
  let guard = 0;
  while (S.petri.timer <= 0 && guard++ < 50) { S.petri.timer += petriInterval(); petriTick(); }
}
function petriNeighbors(i, sz) {
  const x = i % 7, y = Math.floor(i / 7), out = [];
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    if (!dx && !dy) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < sz && ny < sz) out.push(ny * 7 + nx);
  }
  return out;
}
function petriTick(silent) {
  const P = S.petri, sz = petriSize(), grid = P.grid;
  // Vieillissement
  for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) {
    const i = y * 7 + x, c = grid[i];
    if (!c) continue;
    if (c.s === 'dead') { grid[i] = null; continue; }
    c.a++;
    const st = SMAP[c.s];
    if (st.life && c.a >= st.grow + st.life) grid[i] = { s: 'dead', a: 0 };
  }
  // Mutations
  const mc = pn('petri2') ? 1.5 : 1;
  const births = [];
  for (let y = 0; y < sz; y++) for (let x = 0; x < sz; x++) {
    const i = y * 7 + x;
    if (grid[i]) continue;
    const cnt = {};
    petriNeighbors(i, sz).forEach(j => { const c = grid[j]; if (petriStage(c) === 2) cnt[c.s] = (cnt[c.s] || 0) + 1; });
    const ok = [];
    for (const st of STRAINS) {
      if (!st.rec) continue;
      const [a, b] = st.rec;
      const present = a === b ? (cnt[a] || 0) >= 2 : (cnt[a] || 0) >= 1 && (cnt[b] || 0) >= 1;
      if (present && Math.random() < st.ch * mc) ok.push(st);
    }
    if (ok.length) births.push([i, U.pick(ok)]);
  }
  births.forEach(([i, st]) => {
    grid[i] = { s: st.id, a: 0 };
    if (!P.disc[st.id]) {
      P.disc[st.id] = true;
      if (G.ready) journal('petri', 'Nouvelle souche découverte : <b>' + U.esc(st.name) + '</b>');
      if (!silent && G.ready) { toast('Nouvelle souche découverte : <b>' + U.esc(st.name) + '</b> !', 'petri', st.sprite); SFX.play('ach'); }
    }
  });
  P.schro = Math.random() < 0.5;
  // Boîte pleine ?
  let full = true;
  for (let y = 0; y < sz && full; y++) for (let x = 0; x < sz; x++) { const c = grid[y * 7 + x]; if (!c || c.s === 'dead') { full = false; break; } }
  if (full) secret('fullpetri');
  recalc();
  UI.dirtyPetri = true;
}
function petriOffline(sec) {
  if (!petriOpen()) return;
  const iv = petriInterval();
  let ticks = Math.floor((sec + (iv - S.petri.timer)) / iv);
  S.petri.timer = iv - ((sec + (iv - S.petri.timer)) % iv);
  ticks = Math.min(ticks, 200);
  for (let k = 0; k < ticks; k++) petriTick(true);
}
function petriPlant(i, id) {
  const st = SMAP[id], P = S.petri;
  if (!st || !P.disc[id] || P.grid[i]) return false;
  const c = strainCost(st);
  if (!canAfford(c)) { SFX.play('error'); toast('Pas assez de molécules pour cette culture.', 'warn'); return false; }
  spend(c);
  P.grid[i] = { s: id, a: 0 }; P.plants++;
  SFX.play('petri'); checkAch(); UI.dirtyPetri = true;
  return true;
}
function petriHarvest(i) {
  const P = S.petri, c = P.grid[i];
  if (!c) return 0;
  if (c.s === 'dead') { P.grid[i] = null; UI.dirtyPetri = true; return 0; }
  const st = SMAP[c.s];
  let gain = 0;
  if (c.a >= st.grow) {
    gain = st.harvest * G.cpsNoBuff + 10;
    earn(gain, false);
    P.harvests++;
    if (c.s === 'omega') P.omega++;
    SFX.play('gold');
  } else SFX.play('sell');
  P.grid[i] = null;
  recalc(); checkAch(); UI.dirtyPetri = true;
  return gain;
}
function petriAch(k) {
  const P = S.petri, d = Object.keys(P.disc).filter(id => SMAP[id] && P.disc[id]).length;
  return [P.plants >= 1, P.harvests >= 10, P.harvests >= 100, d >= 6, d >= STRAINS.length, P.omega >= 1][k];
}

/* ===================== SONS (synthèse 8-bit, aucun fichier) ===================== */
const SFX = {
  ctx: null, master: null, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  unlock() {
    this.init();
    const c = this.ctx; if (!c) return;
    if (c.state === 'closed') { this.ctx = null; this.init(); return; }
    if (c.state !== 'running') { try { const p = c.resume(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
  },
  tone(f, dur, type = 'square', vol = 0.15, when = 0, slide = 0) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();

const INC = {
  timer: 100, hideT: 0,
  FALLBACK: [
    { e: 1, k: 'gain', n: 'Kévin a encore bu un truc', t: 'Il voit maintenant les molécules à l’œil nu et les ramasse à la main.' },
    { e: 1, k: 'buff', n: 'Le chat de la voisine', t: 'Pistache s’est assis sur le clavier. Les machines tournent deux fois plus vite. Personne ne sait pourquoi.' },
    { e: 1, k: 'gold', n: 'Reflet suspect', t: 'Quelque chose de doré brille dans un coin du labo.' },
  ],
  update(dt) {
    if (!G.ready) return;
    this.timer -= dt;
    if (this.timer <= 0) { this.timer = U.rand(150, 330); this.fire(); }
    if (this.hideT > 0) { this.hideT -= dt; if (this.hideT <= 0) U.$('#incident').classList.remove('on'); }
  },
  pick() {
    const all = (TX(() => TXT_INCIDENTS, null) || this.FALLBACK).filter(x => x && x.t);
    const era = S.era + 1;
    const pool = all.filter(x => (x.e || 1) <= era && (!x.b || n(x.b) > 0));
    if (!pool.length) return this.FALLBACK[0];
    // les incidents de l'ère actuelle (et des précédentes proches) sont plus probables
    const w = pool.map(x => Math.pow(2.2, -(era - (x.e || 1))));
    let r = Math.random() * w.reduce((a, b) => a + b, 0);

    return pool[pool.length - 1];
  },
  apply(k, mag) {
    const e = S.era;
    switch (k) {
      case 'gain': { const g = (G.cpsNoBuff * U.rand(60, 180) + 150 * (e + 1)) * mag; earn(g, false); return '+' + fmtMol(g); }
      case 'buff': { const m = Math.round(3 * mag); addBuff({ key: 'incident', name: this.curName || 'Incident', cps: m, t: 30, icon: 'i_eureka' }); return 'Production ×' + m + ' pendant 30 s'; }
      case 'click': { const m = Math.round(15 * mag); addBuff({ key: 'incclick', name: this.curName || 'Doigts survoltés', click: m, t: 20, icon: 'i_click' }); return 'Clics ×' + m + ' pendant 20 s'; }
      case 'free': {
        const budget = G.cpsNoBuff * 900 * mag; // au plus ~15 min de production offerts
        const owned = B_IDS.filter(id => n(id) > 0 && bLimit(id) > 0 && bCost(id) <= budget);
        if (!owned.length) return this.apply('gain', mag);
        const id = owned[Math.max(0, owned.length - 1 - Math.floor(Math.random() * Math.min(3, owned.length)))];
        let k2 = Math.min(bLimit(id), Math.max(1, Math.min(50, Math.floor(n(id) * 0.08 * mag))));
        while (k2 > 1 && bCostBulk(id, k2) > budget) k2--;
        S.b[id] = n(id) + k2; recalc(); updateEra(); checkUnlocks(); checkAch();
        return '+' + k2 + ' ' + (k2 > 1 ? BMAP[id].lcPlural : BMAP[id].lcName) + ' gratuit' + (BMAP[id].fem ? 'e' : '') + (k2 > 1 ? 's' : '');
      }

      case 'storm': if (inChal('nogold')) return this.apply('gain', mag); S.storm = 6 * mag; return 'Pluie de fioles : attrapez-les !';
      case 'chaos': {
        const a = U.pick(['gain', 'buff', 'click', 'free']), b = U.pick(['gain', 'storm', 'free'].filter(x => x !== a));
        if (S.set.flash) { const app = U.$('#app'); app.classList.remove('bigshake'); void app.offsetWidth; app.classList.add('bigshake'); }
        return this.apply(a, 1.5) + ' · ' + this.apply(b, 1.5);
      }
    }
    return '';
  },
  fire() {
    const x = this.pick();
    this.curName = x.n;
    const eff = this.apply(x.k || 'gain', 1);
    S.incidents = (S.incidents || 0) + 1;

    const next = tiers.length ? '<div class="sub">Prochaine amélioration à ' + tiers[0].reqN + ' exemplaire' + (tiers[0].reqN > 1 ? 's' : '') + '.</div>' : '';
    return '<div class="nm">' + U.esc(b.name) + ' <span class="sub">(en stock : ' + own + ')</span></div>' +
      '<div>' + U.esc(b.desc) + '</div><hr>' +
      '<div>' + U.esc(b.lcName) + ' produit <b>' + fmtMol(unit, 1) + '</b> par seconde.</div>' +
      (own ? '<div>Total : <b>' + fmt(tot, 1) + '</b>/s (' + fmtPct(sb > 0 ? G.bcps[b.id] / sb : 0) + ' de la production)</div>' : '') +
      next + (b.q ? '<div class="qq">' + U.esc(b.q) + '</div>' : '');

function sumBase() { let s = 0; for (const id in G.bcps) s += G.bcps[id]; return s; }
function renderBuildings() {
  const list = U.$('#bList'); list.innerHTML = ''; UI.bEls = {};
  BUILDINGS.forEach(b => {
    const it = U.el('div', 'bItem');

        const k = S.set.buyAmt === -1 ? n(b.id) : Math.min(S.set.buyAmt, n(b.id));
        modal('Vendre ' + k + ' ' + U.esc(U.lc(k > 1 ? b.plural : b.name)) + ' ?', '<p>Vous récupérez seulement 25 % de leur prix.</p>', [{ t: 'Annuler' }, { t: 'Vendre', cls: 'warn', fn: () => { sellBuilding(b.id); updateShop(true); } }]);
        return;
      }
      const ok = S.set.sell ? sellBuilding(b.id) : buyBuilding(b.id);
      if (ok) { const r = it.getBoundingClientRect(); sparkleAt(r.left + 28, r.top + r.height / 2, 5); updateShop(true); }
    }, () => it.classList.contains('myst') ? '<div class="nm">???</div><div class="sub">Un bâtiment encore inconnu…</div>' : buildingTip(b)());
    list.appendChild(it);
    UI.bEls[b.id] = { it, img: it.querySelector('.bIcon'), nm: it.querySelector('.bName'), cost: it.querySelector('.bCost'), own: it.querySelector('.bOwned'), state: '' };
  });
  updateShop(true);
}
function bKnown(b) { return n(b.id) > 0 || S.runEarned >= b.cost * 0.5 || b.i === 0 || godMode(); }
function updateShop(force) {
  let mystShown = false;
  BUILDINGS.forEach(b => {
    const e = UI.bEls[b.id]; if (!e) return;
    const known = bKnown(b);
    let state = known ? 'k' : (!mystShown ? 'm' : 'h');
    if (!known && !mystShown) mystShown = true;
    if (state !== e.state || force) {
      e.state = state;
      e.it.style.display = state === 'h' ? 'none' : '';
      e.it.classList.toggle('myst', state === 'm');
      e.img.src = state === 'm' ? GFX.url(b.sprite, 0, 3, { sil: '#262b44' }) : GFX.url(b.sprite, 0, 3);
      e.nm.textContent = state === 'm' ? '???' : b.name;
    }
    if (state === 'h') return;
    let amt, cost, can;
    if (S.set.sell) {
      amt = S.set.buyAmt === -1 ? n(b.id) : Math.min(S.set.buyAmt, n(b.id));
      cost = 0; for (let i = 0; i < amt; i++) cost += bCost(b.id, n(b.id) - 1 - i) * 0.25;
      can = amt > 0;
      const t = (amt > 0 ? '+' + fmtS(cost) : '—') + (amt > 1 ? ' <span class="bAmt">×' + amt + '</span>' : '');
      if (e.cost.innerHTML !== t) e.cost.innerHTML = t;
      e.lastCost = null;
    } else {
      amt = buyAmount(b.id);
      const lim = bLimit(b.id);
      cost = amt > 0 ? bCostBulk(b.id, amt) : bCost(b.id);
      can = amt > 0 && canAfford(cost);
      const t = (lim <= 0 ? '<span class="cost no">Limite du protocole</span>' : '<span class="cost ' + (can ? 'yes' : 'no') + '">' + molIco() + fmtS(cost) + '</span>' + (amt > 1 ? '<span class="bAmt">×' + amt + '</span>' : ''));
      if (e.lastCost !== t) { e.cost.innerHTML = t; e.lastCost = t; }
    }
    e.it.classList.toggle('can', can && state === 'k');
    e.it.classList.toggle('no', !can && state === 'k');
    const o = String(n(b.id) || '');
    if (e.own.textContent !== o) e.own.textContent = o;
  });
}
function upTip(u) {

function copyText(ta, s) {
  let ok = false;
  try { ta.readOnly = false; ta.focus(); ta.select(); ta.setSelectionRange(0, s.length + 10); ok = document.execCommand('copy'); } catch (e) { }
  try { ta.readOnly = true; ta.blur(); } catch (e) { }
  const done = good => toast(good ? 'Copié ! Collez-le dans vos notes pour le garder.' : 'Copie automatique impossible : appuyez longuement dans le texte, « Tout sélectionner » puis « Copier ».', good ? 'save' : 'warn');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(s).then(() => done(true)).catch(() => done(ok));
  else done(ok);
}

    const url = URL.createObjectURL(new Blob([s], { type: 'text/plain' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
    secret('export');
    toast('Fichier de sauvegarde créé (dossier Téléchargements / Fichiers).', 'save');
  } catch (e) { toast('Téléchargement impossible ici : utilisez « Copier ».', 'warn'); }

const NEWS = { x: 0, w: 0, el: null, recent: [] };
function nextNews() {
  const el = U.$('#tickerInner');

  let pool = all.filter(x => x && x.t && (x.e || 1) <= era && (x.x == null || era <= x.x) && (!x.b || n(x.b) > 0) && !NEWS.recent.includes(x));
  if (!pool.length) pool = all.filter(x => x && x.t && (x.e || 1) <= era);
  let txt = pool.length ? U.pick(pool) : { t: 'Le labo ouvre ses portes. Les voisins s’inquiètent déjà.' };
  NEWS.recent.push(txt); if (NEWS.recent.length > 40) NEWS.recent.shift();

const LABV = {
  cv: null, cx: null, P: 3, W: 0, RH: 30, rows: [], t: 0, acc: 0, key: '', bgs: {},
  init() { this.cv = U.$('#labview'); this.cx = this.cv.getContext('2d'); },

  },
  rebuild() {
    this.rows = BUILDINGS.filter(b => n(b.id) > 0);
    const h = Math.max(1, this.rows.length * this.RH);
    this.cv.width = this.W; this.cv.height = h;
    this.cv.style.width = this.W * this.P + 'px'; this.cv.style.height = h * this.P + 'px';
    this.cx.imageSmoothingEnabled = false;

      const d = U.el('div', 'lablbl'); d.style.top = (r * this.RH * this.P + 3) + 'px';
      lbl.appendChild(d); this.lbls[b.id] = d;
    });

    const c = cv.getContext('2d'), [wall, floor, acc] = b.theme, rnd = U.seeded(U.hash(b.id));

    else if (pat === 1) for (let y = 1; y < H - 8; y += 4) for (let x = (y % 8 ? 0 : 3); x < W; x += 7) R(x, y, 6, 3, light);

          c.fillRect(Math.round(cx + Math.cos(a) * rr), Math.round(cy + 4 + Math.sin(a) * rr * 0.35), 1, 1);
        }
      }
      c.fillStyle = '#000'; c.beginPath(); c.ellipse(cx, cy + 4, R * 0.42, R * 0.2, 0, 0, Math.PI * 2); c.fill();
    }
    // Portails dimensionnels sur les murs
    const np = this.qty('portail', 3);
    for (let k = 0; k < np; k++) {
      const px = k % 2 ? W - 14 - (k >> 1) * 18 : 14 + (k >> 1) * 18, py = top - 26 - (k % 2) * 8, rw = 7, rh = 11;
      for (let pass = 0; pass < 2; pass++) {
        c.fillStyle = pass ? '#9b5de5' : '#2ce8f5';
        for (let i = 0; i < 40; i++) {
          if ((i % 3 !== 0) !== !!pass) continue;
          const a = i / 40 * Math.PI * 2 + t * 3 * (k % 2 ? -1 : 1), r2 = 0.4 + (i % 5) / 8;
          c.fillRect(Math.round(px + Math.cos(a) * rw * r2), Math.round(py + Math.sin(a) * rh * r2), 1, 1);
        }
      }
      c.fillStyle = 'rgba(212,184,255,0.25)'; c.beginPath(); c.ellipse(px, py, rw, rh, 0, 0, Math.PI * 2); c.fill();
    }
    // Fabrique de Big Bang : explosions cosmiques au loin
    if (n('bigbang') > 0) {
      this.bangT -= this.dt;
      if (this.bangT <= 0) { this.bangT = U.rand(1.5, 4) / Math.min(3, 1 + Math.log10(n('bigbang') + 1)); const hue = U.rand(0, 360); this.bangs.push({ x: U.rand(6, W - 6), y: U.rand(6, top - 20), r: 0, cols: Array.from({ length: 18 }, (_, i) => GFX.rbw(hue + i * 12)) }); }
      this.bangs = this.bangs.filter(b => {
        b.r += this.dt * 36;
        const k = 18;
        c.globalAlpha = Math.max(0, 1 - b.r / 22);
        for (let i = 0; i < k; i++) { const a = i / k * Math.PI * 2; c.fillStyle = b.cols[i]; c.fillRect(Math.round(b.x + Math.cos(a) * b.r), Math.round(b.y + Math.sin(a) * b.r), 1, 1); }
        if (b.r < 4) { c.fillStyle = '#fff'; c.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 3, 3); }
        c.globalAlpha = 1;
        return b.r < 22;
      });
    }
    // Simulateurs : écrans d'univers accrochés au mur
    const ns = this.qty('simulateur', 3);
    for (let k = 0; k < ns && GFX.has('b_simulateur'); k++) c.drawImage(GFX.canvas('b_simulateur', Math.floor(t * 2 + k) % GFX.frames('b_simulateur')), k % 2 ? W - 20 - (k >> 1) * 18 : 4 + (k >> 1) * 18, top - 46);
    // Accélérateur de particules : anneau derrière (moitié arrière)
    this.ring(c, sc, t, cx, cy, true);
    this.orbit(c, sc, t, cx, cy, true);
  },
  // Couche avant : devant le récipient
  front(c, sc, t, cx, cy, vTop) {
    const W = sc.W, top = sc.benchTop;
    this.ring(c, sc, t, cx, cy, false);
    this.orbit(c, sc, t, cx, cy, false);
    // Matériel posé sur la paillasse (de part et d'autre de la fiole)
    const bench = ['bunsen', 'microscope', 'centrifugeuse', 'clonage', 'fusion', 'robot'];
    const items = [];
    bench.forEach(id => { for (let k = 0; k < this.qty(id, 3); k++) items.push(id); });
    if (items.length && sc.info) {
      const bx = sc.info.box, vl = sc.vx + bx[0] - 2, vr = sc.vx + bx[2] + 2;
      const left = items.filter((_, i) => i % 2 === 0), right = items.filter((_, i) => i % 2 === 1);
      const place = (arr, x0, x1, dir) => {
        if (!arr.length || x1 - x0 < 10) return;
        const step = Math.min(14, (x1 - x0 - 16) / Math.max(1, arr.length - 1));
        arr.forEach((id, i) => {
          const s = 'b_' + id; if (!GFX.has(s)) return;
          const x = dir > 0 ? x0 + i * step : x1 - 16 - i * step;
          c.drawImage(GFX.canvas(s, Math.floor(t * 2.2 + i) % GFX.frames(s), dir > 0 ? { flip: true } : undefined), Math.round(x), top - 15);
        });
      };
      place(left, 1, vl, 1); place(right, vr, W - 1, -1);
    }
    // Pipettes automatiques au-dessus de la fiole : elles « cliquent » en rythme
    const np = this.qty('pipette', 5);
    if (np && GFX.has('b_pipette')) {
      for (let k = 0; k < np; k++) {
        const off = (k - (np - 1) / 2) * 11, ph = t * (3 + G.ghost) + k * 1.3, dip = Math.max(0, Math.sin(ph)) * 3;
        c.drawImage(GFX.canvas('b_pipette', Math.sin(ph) > 0.9 ? 1 : 0), Math.round(cx + off - 8), Math.round(vTop - 18 + dip - Math.abs(off) * 0.25));
      }
    }
    // Stagiaires : chacun a sa place sur la paillasse et se balade un peu autour (jamais les uns sur les autres)
    const want = this.qty('stagiaire', 6), sfr = GFX.frames('b_stagiaire');
    if (want && GFX.has('b_stagiaire') && sc.info) {
      const bx = sc.info.box, vl = sc.vx + bx[0] - 1, vr = sc.vx + bx[2] + 1;
      const homes = [];
      const fill = (x0, x1) => { for (let x = x0; x + 16 <= x1; x += 22) homes.push(x); };
      fill(2, vl); fill(vr + 1, W - 2);
      homes.sort((a, b) => Math.abs(a + 8 - W / 2) - Math.abs(b + 8 - W / 2));
      const ns = Math.min(want, homes.length);
      for (let k = 0; k < ns; k++) {
        const ph = t * (0.35 + (k % 3) * 0.08) + k * 1.7, s = Math.sin(ph);
        const x = homes[k] + Math.round(s * 3);
        const step = Math.abs(Math.cos(ph)) > 0.3 && Math.floor(t * 3 + k * 0.5) % 2 ? 1 : 0;
        c.drawImage(GFX.canvas('b_stagiaire', Math.floor(t * 0.8 + k) % sfr), x, top - 16 - step);
      }
    }
    // Kévin traverse parfois l'écran en courant avec un truc absurde
    this.kevinT -= this.dt;
    if (this.kevinT <= 0 && !this.kevin && n('stagiaire') > 0) { this.kevinT = U.rand(25, 60); this.kevin = { x: -16, item: U.pick(['p_mol', 'g_mini', 'p_star', 'b_bunsen', 'b_trounoir', 'f_15', 'f_04', 'b_portail', 'i_dev']) }; }
    if (this.kevin && GFX.has('b_stagiaire')) {
      const kv = this.kevin; kv.x += this.dt * 80;
      const y = top - 17 + (Math.floor(t * 5) % 2);
      c.drawImage(GFX.canvas('b_stagiaire', 0), Math.round(kv.x), y);
      if (GFX.has(kv.item)) { const it = GFX.canvas(kv.item, 0); c.drawImage(it, Math.round(kv.x + 8 - it.width / 2), y - it.height + 2); }
      if (kv.x > W + 16) this.kevin = null;
    }
    // Essaim de nanobots
    const nn = n('nanobots');
    if (nn > 0) {
      const k = Math.min(60, 6 + Math.floor(Math.log2(nn + 1) * 6));
      for (let pass = 0; pass < 2; pass++) {
        c.fillStyle = pass ? '#2ce8f5' : '#c0cbdc';
        for (let i = 0; i < k; i++) {
          if ((i % 6 === 0) !== !!pass) continue;
          const a = t * (1.2 + (i % 5) * 0.15) + i * 0.7, r = 14 + (i % 7) * 3 + Math.sin(t * 2 + i) * 3;
          c.fillRect(Math.round(cx + Math.cos(a) * r * 1.3), Math.round(cy + Math.sin(a * 1.7) * r * 0.6), 1, 1);
        }
      }
    }
    // Glitch de réalité (ère infinie)
    if (S.era >= 8) {
      this.glitchT -= this.dt;
      if (this.glitchT <= 0) { this.glitchT = U.rand(3, 9); this.glitch = 0.18; }
      if (this.glitch > 0) {
        this.glitch -= this.dt;
        const y = Math.floor(U.rand(0, sc.H - 8)), h = Math.floor(U.rand(2, 8)), off = Math.floor(U.rand(-6, 6));
        c.drawImage(sc.cv, 0, y, W, h, off, y, W, h);
        c.fillStyle = 'rgba(44,232,245,0.15)'; c.fillRect(0, y, W, 1);
      }
    }
  },
  // Anneau d'accélérateur autour de la fiole
  ring(c, sc, t, cx, cy, backHalf) {
    const k = this.qty('accelerateur', 2); if (!k) return;
    for (let r = 0; r < k; r++) {
      const rx = Math.min(sc.W / 2 - 3, 30 + r * 7), ry = 7 + r * 2, yy = cy + 8 - r * 6;
      const N = 90;
      c.fillStyle = backHalf ? '#3a4466' : '#8b9bb4';
      for (let i = 0; i < N; i++) {
        const a = i / N * Math.PI * 2, s = Math.sin(a);
        if ((s < 0) !== backHalf) continue;
        c.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(yy + s * ry), 1, 1);
      }
      for (let p = 0; p < 3; p++) {
        const a = t * (5 + r * 2) + p * 2.1, s = Math.sin(a);
        if ((s < 0) !== backHalf) continue;
        const x = Math.round(cx + Math.cos(a) * rx), y = Math.round(yy + s * ry);
        c.fillStyle = '#2ce8f5'; c.fillRect(x - 1, y, 3, 1); c.fillRect(x, y - 1, 1, 3); c.fillStyle = '#fff'; c.fillRect(x, y, 1, 1);
      }
    }
  },
  // Objets cosmiques en orbite autour de la fiole
  orbiters() {
    const out = [];
    [['quantique', 2], ['orbitale', 2], ['chrono', 2], ['forge', 3], ['portail', 0], ['simulateur', 0], ['trounoir', 1], ['bigbang', 2], ['infini', 2]].forEach(([id, max]) => {
      for (let k = 0; k < this.qty(id, max); k++) out.push(id);
    });
    return out;
  },
  orbit(c, sc, t, cx, cy, backHalf) {
    const list = this.orbiters(); if (!list.length) return;
    const rx = Math.min(sc.W / 2 - 9, 44), ry = Math.min(30, (sc.benchTop - 10) / 2);
    list.forEach((id, i) => {
      const s = 'b_' + id; if (!GFX.has(s)) return;
      const sp = 0.35 + (i % 3) * 0.1, a = t * sp + i * (Math.PI * 2 / list.length), z = Math.sin(a);
      if ((z < 0) !== backHalf) return;
      const x = cx + Math.cos(a) * rx * (0.75 + (i % 2) * 0.25), y = cy - 4 + z * ry * 0.5 - Math.cos(a * 2) * 3;
      if (backHalf) c.globalAlpha = 0.7;
      c.drawImage(GFX.canvas(s, Math.floor(t * 2 + i) % GFX.frames(s)), Math.round(x - 8), Math.round(y - 8));
      c.globalAlpha = 1;
    });
  },
};

/* ==== 99_main.js ==== */
/* ===================== DÉMARRAGE & BOUCLE PRINCIPALE ===================== */
let ERR_SHOWN = false;
function showError(msg) {
  if (ERR_SHOWN) return; ERR_SHOWN = true;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;background:#3a1418;border:2px solid #e43b44;color:#ffd0d0;padding:8px;font:16px monospace;white-space:pre-wrap;max-height:40%;overflow:auto';
  d.textContent = 'Erreur : ' + msg + '\n(touchez pour fermer — votre partie est sauvegardée automatiquement)' + (typeof BUILD_ID !== 'undefined' ? '\nVersion du ' + BUILD_ID : '');
  d.onclick = () => d.remove();
  document.body.appendChild(d);
}
window.addEventListener('error', e => {
  // Erreurs venant d'extensions / scripts externes (Safari les masque en « Script error. ») : pas les nôtres, on les ignore
  const msg = e.message || '';
  if (!e.lineno || /^script error\.?$/i.test(msg.trim())) return;
  if (e.filename && e.filename.split('#')[0] !== location.href.split('#')[0] && !/labo-infini|index\.html/i.test(e.filename)) return;
  showError(msg + ' (ligne ' + e.lineno + ')');
});

function afterLoad() {
  NUM_FORMAT = S.set.format;
  S.set.sell = false;
  G.upsKey = ''; UI.selUp = null; UI.selCell = -1;
  recalc();
  S.era = Math.max(S.era, eraFromBuildings());
  if (S.era > S.eraMax) S.eraMax = S.era;
  checkUnlocks();
  GOLD.clearAll();
  SCENE.dirtyBg = true; NEWS.w = 0;
  if (LABV.cv) LABV.resize();
  UI.dirtyAll = true;
}
function welcome() {
  modal('Bienvenue au labo « ' + U.esc(S.labName) + ' » !', '<div class="era-art"><img src="' + GFX.url('v1', 0, 3, { liquid: ERA_STYLE[0].liq, tint: ERA_STYLE[0].acc }) + '" alt=""></div>' +
    '<p>Votre carrière scientifique commence dans un garage, avec une simple éprouvette.</p>' +
    '<p>• <b>Touchez le récipient</b> pour fabriquer des molécules (et remplir la jauge <b>Eurêka</b>).</p>' +
    '<p>• Achetez des <b>bâtiments</b> dans la boutique : ils produisent tout seuls, même quand vous êtes absent.</p>' +
    '<p>• Attrapez les <b>fioles dorées</b> qui apparaissent de temps en temps !</p>' +
    '<p>• Votre partie se sauvegarde toute seule. Le bouton disquette en haut force une sauvegarde.</p>' +
    '<p class="sub">Appui long (ou survol) sur un élément pour voir ses détails.</p>', [{ t: 'Au labo !', cls: 'gold' }]);
}
let lastWall = Date.now(), lastPerf = 0;
function loop(now) {
  try {
    const wall = Date.now();
    let wdt = (wall - lastWall) / 1000; lastWall = wall;
    let dt = lastPerf ? (now - lastPerf) / 1000 : 0.016; lastPerf = now;
    if (wdt > 5) { // retour après une suspension (application en arrière-plan…)
      const r = applyOffline(wdt);
      if (r && wdt > 60) offlineModal(r);
      dt = 0.016;
    }
    dt = U.clamp(dt, 0, 5);
    let rem = dt * (S.set.dev ? S.set.speed : 1);
    while (rem > 0) { const step = Math.min(rem, 0.5); tick(step); rem -= step; }
    S.lastTick = wall;
    SCENE.frame(Math.min(dt, 0.1));
    LABV.frame(dt);
    uiUpdate(dt);
  } catch (e) { showError(e.message + '\n' + (e.stack || '').split('\n').slice(0, 3).join('\n')); }
  requestAnimationFrame(loop);
}
function boot() {
  const loaded = loadGame();
  if (!S.labName) S.labName = U.pick(TX(() => TXT_LABNAMES, null) || ['Labo Infini']);
  NUM_FORMAT = S.set.format;
  U.$('#btnSave img').src = GFX.url('i_save', 0, 2);
  U.$('#btnOpts img').src = GFX.url('i_gear', 0, 2);
  U.$('#btnSave').onclick = () => { SFX.unlock(); if (saveGame(true)) SFX.play('save'); };
  U.$('#btnOpts').onclick = () => { SFX.unlock(); showTab('opts'); };
  U.$('#labName').onclick = () => { SFX.unlock(); askRename(); };
  U.$('#buyAll').onclick = () => { const k = buyAllUps(); if (k) toast(k + ' amélioration' + (k > 1 ? 's achetées' : ' achetée'), 'save'); };
  SCENE.init(); LABV.init();
  U.$('#page-lab').addEventListener('scroll', () => { LABV.acc = 1; }, { passive: true });
  UI.tab = S.set.tab || 'shop';
  if (UI.tab !== 'shop') UI.midTab = UI.tab;
  computeLayout();
  renderBuildings();
  afterLoad();
  checkAch(); // silencieux au démarrage
  G.ready = true;
  const away = loaded ? (Date.now() - S.lastTick) / 1000 : 0;
  if (loaded && away > 5) { const r = applyOffline(away); if (r && away > 60) offlineModal(r); }
  if (!loaded) {
    S.ach.aa0 = U.now();
    if (G.loadError) {
      modal('Sauvegarde illisible', '<p>Votre sauvegarde n\u2019a pas pu être lue. Une copie de secours a été conservée : copiez ce texte (Options › Importer pourra le relire plus tard).</p><textarea class="save" readonly id="corruptTxt"></textarea>', [{ t: 'Nouvelle partie', cls: 'gold' }]);
      const ta = U.$('#corruptTxt'); if (ta) ta.value = store.get('laboInfini.corrupt.v1') || '';
    } else welcome();
    saveGame();
  }
  if (!store.probe()) setTimeout(() => modal('Stockage indisponible', '<p>Ce navigateur ne permet pas d\u2019enregistrer la partie automatiquement. Pensez à <b>exporter</b> régulièrement votre partie (Options › Exporter › Télécharger).</p>', null, true), 800);
  lastWall = Date.now();
  window.addEventListener('resize', () => { clearTimeout(boot.rt); boot.rt = setTimeout(computeLayout, 120); });
  window.addEventListener('orientationchange', () => setTimeout(computeLayout, 300));
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); else lastWall = Math.min(lastWall, Date.now()); });
  window.addEventListener('pagehide', () => saveGame());
  window.addEventListener('beforeunload', () => saveGame());
  document.addEventListener('pointerdown', e => { SFX.unlock(); if (UI.tipEl && !UI.tipEl.contains(e.target) && e.target.id !== 'scene') hideTip(); }, true);
  document.addEventListener('gesturestart', e => e.preventDefault());
  // iOS : après la fermeture du clavier, la page peut rester décalée -> on la remet en place UNE fois
  // (ne JAMAIS mettre body en position fixe, boucler sur scrollTo ni bloquer touchmove : bande vide en bas ou
  // boutons morts sur iPhone — voir le skill jeux-web-github, references/ios-webapp.md)
  document.addEventListener('focusout', () => setTimeout(() => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); }, 120));
  ['touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, () => SFX.unlock(), { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) SFX.unlock(); });
  setInterval(() => saveGame(false), 30000);
  [300, 1200, 3000].forEach(ms => setTimeout(() => { fixStandaloneHeight(); SCENE.resize(); LABV.resize(); }, ms));
  requestAnimationFrame(loop);
  const b = U.$('#boot'); b.classList.add('out'); setTimeout(() => b.remove(), 500);
}
function startWhenReady() {
  const go = () => { try { boot(); } catch (e) { showError(e.message + '\n' + (e.stack || '').split('\n').slice(0, 4).join('\n')); } };
  if (document.fonts && document.fonts.ready) { let done = false; const f = () => { if (!done) { done = true; go(); } }; document.fonts.ready.then(f); setTimeout(f, 1500); }
  else go();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startWhenReady); else startWhenReady();

</script>
