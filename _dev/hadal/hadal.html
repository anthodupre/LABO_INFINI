  ell(cx,cy,3+Math.round(Math.sin(T*1.2)),4,P.p1);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.hypot(x-60,(y-40)*1.4);if(d>58)dpx(x,y,P.k,Math.min(16,Math.floor((d-58)/2)));}
},
mist(t,T){
  R(0,0,W,H,P.k);
  for(let i=0;i<220;i++){const a=hash(i)*Math.PI*2,sp=10+hash(i+7)*30,d=Math.min(70,t*sp)+Math.sin(T+i)*2;const x=60+Math.cos(a)*d,y=36+Math.sin(a)*d*.7+t*1.5;px(x,y,hash(i+2)>.5?P.p1:(hash(i+3)>.5?P.r3:P.p2));}
  if(t<.5)tint('#fff',1-t*2);
}
};

/* the corridor (dry ring or flooded) */
function corridor(t,T,wet){
  const VX=60,VY=30,zMax=6;
  const wallC=wet?[P.a3,P.a2,P.a1]:[P.m3,P.m2,P.m1];
  R(0,0,W,H,P.k);
  for(let x=0;x<W;x++){
    const dx=Math.abs(x-VX);if(dx<10)continue;
    const z=60/dx;if(z>zMax)continue;
    const top=VY-30/z,bot=VY+42/z,panel=Math.floor(z*2)%2,lv=Math.floor((z-1)/(zMax-1)*16);
    R(x,top,1,bot-top,wallC[panel?1:0]);
    g.fillStyle=P.k;for(let y=Math.round(top);y<bot;y++)if(BY[(y&3)*4+(x&3)]<lv)g.fillRect(x,y,1,1);
    if(Math.abs((z*2)%1)<.12)R(x,top,1,bot-top,wallC[2]);
    if(!wet){px(x,bot-1,(Math.sin(T*6+x)>-.9)?P.r3:P.r1);px(x,top+2,P.m1);}
  }
  for(let y=Math.ceil(VY+42/zMax);y<H;y++){const z=42/(y-VY),hw=60/z,lv=Math.floor((z-1)/(zMax-1)*16);
    for(let x=Math.round(VX-hw);x<=VX+hw;x++){const c=(Math.abs((z*2)%1)<.14)?P.m0:(wet?P.a2:P.m1);if(BY[(y&3)*4+(x&3)]<lv)px(x,y,P.k);else px(x,y,c);}}
  for(let y=0;y<Math.floor(VY-30/zMax);y++){const z=30/(VY-y),hw=60/z,lv=Math.floor((z-1)/(zMax-1)*16);
    for(let x=Math.round(VX-hw);x<=VX+hw;x++){if(BY[(y&3)*4+(x&3)]<lv)px(x,y,P.k);else px(x,y,wet?P.a1:P.m0);}
    if(Math.abs((z*1)%1)<.1&&!wet)R(VX-hw*.3,y,hw*.6,1,(Math.sin(T*17+z)>.3)?P.m4:P.m2);}
  // doors
  const door=(z1,z2,left)=>{for(let z=z1;z<z2;z+=.02){const x=left?VX-60/z:VX+60/z;const top=VY-30/z+ (14/z),bot=VY+42/z;R(x,top,1,bot-top,wet?P.a0:P.k);
    if(z<z1+.05||z>z2-.05)R(x,top,1,bot-top,P.m3);}};
  door(1.4,1.9,true);door(2.4,2.9,false);door(3.3,3.7,true);door(1.6,2.0,false);
  if(!wet){txt('LAB',8,22,P.a6);txt('MED',101,20,P.a6);
    for(let i=0;i<9;i++){const z=1.2+hash(i)*3.5,left=hash(i+1)>.5,x=left?VX-60/z:VX+60/z,y=VY+(hash(i+2)*60-25)/z,pu=.5+.5*Math.sin(T*1.3+i*2),r=Math.max(1,Math.round(5/z));
      ell(x,y,r,r,P.r2);ell(x,y,Math.max(0,r-1),Math.max(0,r-1),pu>.5?P.p1:P.r3);if(pu>.7)glow(x,y,r*4,'#ff70a0',.25,true);}
    ell(60,64,14,4,P.m3);ell(60,64,12,3,P.m2);line(48,64,72,64,P.m1);line(60,61,60,67,P.m1);
    const cyc=T%11;if(cyc>8&&cyc<8.5){R(58,27,4,10,P.k);px(59,28,P.p3);px(61,28,P.p3);}
    glow(60,70,40,'#ff1030',.15,true);
    if(Math.sin(T*.5)>.985)tint('#000',.85);
  }else{
    g.save();g.globalAlpha=.12;g.globalCompositeOperation='lighter';g.fillStyle='#8ff';g.beginPath();g.moveTo(52,H);g.lineTo(68,H);g.lineTo(64,30);g.lineTo(56,30);g.fill();g.restore();
    glow(60,34,20,'#60e0e0',.2,true);
    const dr=(i,c,w,h)=>{const x=(hash(i)*W+T*(2+i))%W,y=20+hash(i+3)*36+Math.sin(T+i)*3;R(x,y,w,h,c);};
    dr(1,P.m4,2,2);dr(2,P.m2,3,2);dr(3,P.s1,2,3);
    let rx=30+Math.sin(T*.3)*10,ry=24;for(let j=0;j<18;j++){px(rx+j,ry+Math.sin(j*.5+T*2)*2,P.p1);}
    if(!(S&&S.mut>=40))bubbles(T,60,70,10,5,P.a7);
    snow(T,40,-2,P.a5,6);tint('#003040',.3,'lighter');
  }
}

/* the cathedral */
function choirScene(t,T,end){
  R(0,0,W,H,P.k);glow(60,34,60,'#ff4078',.22,true);
  const VX=60,VY=32;
  for(let i=7;i>=1;i--){const z=i*.9,rx=56/z,ry=50/z,base=VY+38/z,shade=i>4?P.bn0:(i>2?P.bn1:P.bn2);
    for(let a=0;a<=Math.PI;a+=.03){const x=VX+Math.cos(a)*rx,y=base-Math.sin(a)*ry;dpx(x,y-1,P.p2,3);}
    if(i<6){for(let yy=Math.round(base-ry);yy<base;yy+=1){const f=1-(base-yy)/ry;const hw=rx*Math.sqrt(Math.max(0,1-(1-f)*(1-f)));
      for(let xx=Math.round(VX-hw);xx<=VX+hw;xx++){if(Math.abs(xx-VX)>hw-2-(7-i))dpx(xx,yy,i%2?P.r1:P.r0,4);}}}
    for(let a=0;a<=Math.PI;a+=.015){const x=VX+Math.cos(a)*rx,y=base-Math.sin(a)*ry;px(x,y,shade);if(i<3)px(x+1,y,shade);}
    const n=Math.max(2,Math.round(10/z));
    for(let k=0;k<n;k++){[-1,1].forEach(sd=>{const a=Math.PI/2+sd*(.3+k/n*1.1);const x=VX+Math.cos(a)*rx*.92,y=base-Math.sin(a)*ry*.92;
      const op=Math.max(0,Math.sin(T*3-i*.7-k*.5));const mr=Math.max(1,Math.round(3/z*1.6));ell(x,y,mr,Math.round(op*mr*.8),P.r1);px(x-mr,y,P.p1);px(x+mr,y,P.p1);});}}
  for(let y=VY+6;y<H;y++){const hw=(y-VY)*.35;for(let x=Math.round(VX-hw);x<=VX+hw;x++)dpx(x,y,(Math.sin(x*.7+y+T)>.85)?P.p1:P.a1,10);}
  R(58,22,4,12,P.bn1);for(let y=22;y<34;y+=2)R(57,y,6,1,P.bn2);ell(60,20,2,2,P.s2);R(59,23,2,5,P.a2);
  if(!(S&&has('reactorkey'))&&!end&&Math.sin(T*3)>.3)px(60,26,P.y3);
  for(let i=0;i<30;i++){const x=(hash(i)*W+Math.sin(T*.3+i)*6),y=(hash(i+9)*H-T*(1+hash(i)*2))%H;px(x,y<0?y+H:y,i%3?P.p1:P.a6);}
  if(end){const hy=60-t*4;if(hy>-10){ell(40,hy,5,5,P.m3);ell(40,hy+1,3,3,P.a1);bubbles(T,40,hy-4,5,4,P.a7);}
    const pu=.5+.5*Math.sin(T*2);ell(60,52,4,Math.round(1+pu*2),P.r1);ring(60,52,5,3,P.w,.15);glow(60,52,10,'#fff',.2*pu,true);}
}

/* ---------- loop ---------- */
function frame(now){
  requestAnimationFrame(frame);
  if(now-last<66)return;last=now;
  const T=now/1000;
  if(titleOn){
    g.setTransform(1,0,0,1,0,0);SC.title(0,T);
    tctx.imageSmoothingEnabled=false;tctx.drawImage(lo,0,0,tcv.width,tcv.height);return;
  }
  if(settings.scene==='off')return;
  const t=(now-sT0)/1000;
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  (SC[scene]||SC.dark)(t,T);
  const node=S&&NODES[S.node];
  if(node&&!node.end)helmet(T);
  // sanity / mutation glitch
  const gl=now<glitchT||(S&&S.san<35&&Math.random()<(35-S.san)/250);
  if(gl&&settings.fx){for(let i=0;i<3;i++){const y=Math.floor(Math.random()*H),h=1+Math.floor(Math.random()*6),dx=Math.floor(Math.random()*9)-4;g.drawImage(lo,0,y,W,h,dx,y,W,h);}
    if(S&&S.san<20&&Math.random()<.3){px(40+Math.random()*40,20+Math.random()*30,P.p3);}}
  let ox=0,oy=0;if(now<shakeT&&settings.fx){ox=Math.round(Math.random()*4-2);oy=Math.round(Math.random()*4-2);}
  vctx.imageSmoothingEnabled=false;vctx.fillStyle='#000';vctx.fillRect(0,0,view.width,view.height);
  const sc=view.width/W;vctx.drawImage(lo,ox*sc,oy*sc,view.width,view.height);
}
function resize(){
  const dpr=Math.min(3,window.devicePixelRatio||1);
  let sc=Math.max(1,Math.min(4,Math.floor((window.innerWidth-8)/W)));
  if(settings.scene==='S')sc=Math.max(1,sc-1);
  const wrap=$('#scenewrap');wrap.classList.toggle('off',settings.scene==='off');
  view.style.width=W*sc+'px';view.style.height=H*sc+'px';view.width=W*sc*dpr;view.height=H*sc*dpr;
  const ts=Math.max(1,Math.min(4,Math.floor((window.innerWidth-8)/W)));
  tcv.style.width=W*ts+'px';tcv.style.height=H*ts+'px';tcv.width=W*ts*dpr;tcv.height=H*ts*dpr;
}
window.addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
return{
  set(name){if(name!==scene){scene=name;sT0=performance.now();}},
  restart(){sT0=performance.now();},
  shake(){shakeT=performance.now()+350;},
  glitch(){glitchT=performance.now()+450;},
  title(on){titleOn=on;},
  resize
};
})();
/* =====================================================================
   BOOT
   ===================================================================== */
showTitle();
</script>
