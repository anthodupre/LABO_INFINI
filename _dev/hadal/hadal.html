<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020406">
<title>HADAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020406; --ink:#b9cfd2; --dim:#5f7a80; --red:#e0405a; --pink:#ec8aa0; --cyan:#62d0d4;
  --amber:#e0b040; --line:#12262e; --panel:#050d12;
  --fs:21px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"VT323",ui-monospace,Menlo,monospace;font-size:var(--fs);line-height:1.18;
  -webkit-text-size-adjust:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb)}
#app.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;padding:6px 10px 6px;background:var(--panel);border-bottom:2px solid var(--line)}
.hrow{display:flex;align-items:center;gap:6px}
#depth{color:var(--cyan);font-size:22px;min-width:78px}
#chap{flex:1;font-size:16px;color:var(--dim);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#08151c;border:2px solid #1d3a44;color:var(--ink);font-size:17px;padding:2px 7px;line-height:1.1;border-radius:0;box-shadow:2px 2px 0 #000}
.hbtn:active{transform:translate(2px,2px);box-shadow:none;border-color:var(--cyan)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:5px}
.bar{display:flex;align-items:center;gap:5px;font-size:16px;color:var(--dim)}
.bar b{width:30px;font-weight:normal}
.track{flex:1;height:8px;background:#0a1418;border:1px solid #1a2c33;position:relative;overflow:hidden}
.fill{height:100%;width:100%;transition:width .5s steps(8)}
.bar i{font-style:normal;width:24px;text-align:right;color:var(--ink)}
#f-hp{background:var(--red)} #f-o2{background:var(--cyan)} #f-san{background:var(--amber)} #f-mut{background:var(--pink)}
.bar.low i{color:var(--red);animation:blink 1s steps(2) infinite}
#badges{display:flex;gap:6px;font-size:15px}
.badge{padding:0 5px;border:1px solid}
#b-god{color:#ffe08a;border-color:#ffe08a;display:none}
#b-core{color:var(--red);border-color:var(--red);display:none;animation:blink .8s steps(2) infinite}
#b-inf{color:var(--pink);border-color:var(--pink);display:none}
@keyframes blink{50%{opacity:.25}}

/* ---------- SCENE ---------- */
#scenewrap{flex:0 0 auto;background:#000;display:flex;justify-content:center;border-bottom:2px solid var(--line);position:relative}
#scene{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#scenewrap.off{display:none}

/* ---------- STORY ---------- */
#story{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 18px;position:relative;min-height:80px}
#story p{margin:0 0 .75em;white-space:pre-line}
.echo{color:var(--dim);font-size:.82em;margin-bottom:.8em;border-left:3px solid #1d3a44;padding-left:8px}
.endtitle{font-size:1.5em;color:var(--red);letter-spacing:2px;margin:.2em 0 .6em;text-shadow:2px 2px 0 #300}
.t-r{color:var(--red)}
.t-d{color:var(--dim)}
.t-b{color:#f2fbfb}
.t-v{color:var(--pink)}
.t-g{color:var(--pink);display:inline-block;animation:jit .12s steps(2) infinite}
p.bodyline{border-left:3px solid #6e1222;padding-left:8px}
@keyframes jit{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px);text-shadow:-2px 0 #0ff,2px 0 #f06}}
#story.warp p{animation:warp 6s ease-in-out infinite}
@keyframes warp{0%,100%{transform:skewX(0)}50%{transform:skewX(-1.5deg) scaleY(1.02)}}
#story.insane{text-shadow:-1px 0 rgba(0,255,255,.35),1px 0 rgba(255,0,90,.35)}
.tap{color:var(--dim);font-size:.75em;text-align:center;animation:blink 1.4s steps(2) infinite}

/* ---------- CHOICES ---------- */
#choices{flex:0 0 auto;max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 10px;
  border-top:2px solid var(--line);display:flex;flex-direction:column;gap:7px;background:var(--panel)}
#choices:empty{display:none}
.ch{appearance:none;text-align:left;background:#08161d;border:2px solid #1f3d47;color:var(--ink);font-size:20px;
  padding:9px 12px;min-height:46px;line-height:1.12;border-radius:0;box-shadow:3px 3px 0 #000;
  opacity:0;transform:translateY(6px);animation:cin .3s steps(4) forwards}
.ch:active{transform:translate(3px,3px)!important;box-shadow:none;border-color:var(--cyan);background:#0c222b}
.ch::before{content:"> ";color:var(--cyan)}
.ch.lock{opacity:.45!important;border-style:dashed}
.ch.lock::before{content:"# ";color:var(--dim)}
.ch.danger{border-color:#5a1624;color:#f3b5c0}
.ch.danger::before{color:var(--red)}
.ch.mut{border-color:#6a2c4a;color:var(--pink)}
.ch.mut::before{content:"~ ";color:var(--pink)}
.ch small{display:block;color:var(--dim);font-size:.78em;margin-top:2px}
@keyframes cin{to{opacity:1;transform:none}}
.timer{height:10px;background:#2a0b12;border:2px solid #5a1624;flex:0 0 auto}
.timer div{height:100%;background:var(--red);width:100%}
.kp{display:flex;flex-direction:column;align-items:center;gap:8px}
.kpd{font-size:40px;letter-spacing:12px;color:var(--red);background:#000;border:2px solid #3a1018;padding:0 14px;text-shadow:0 0 6px #f00}
.kpg{display:grid;grid-template-columns:repeat(3,72px);gap:7px}
.kpk{height:50px;background:#0b1a20;border:2px solid #2a4650;color:var(--ink);font-size:26px;box-shadow:3px 3px 0 #000}
.kpk:active{transform:translate(3px,3px);box-shadow:none;border-color:var(--red)}

/* ---------- OVERLAYS ---------- */
.ov{position:fixed;inset:0;background:rgba(1,4,6,.97);display:none;flex-direction:column;
  padding:calc(var(--st) + 10px) 14px calc(var(--sb) + 12px);z-index:50}
.ov.on{display:flex}
.ovh{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.ovh h2{margin:0;font-size:30px;font-weight:normal;color:var(--cyan);letter-spacing:2px}
.ovb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.row{border:2px solid var(--line);padding:9px 11px;margin-bottom:8px;background:#061015}
.row h3{margin:0 0 3px;font-size:22px;font-weight:normal;color:#e8f4f4}
.row p{margin:0;color:var(--dim);font-size:18px;white-space:pre-line}
.row .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{background:#0b1a20;border:2px solid #2a4650;color:var(--ink);font-size:19px;padding:6px 12px;box-shadow:3px 3px 0 #000;border-radius:0}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
.btn.warn{border-color:#5a1624;color:#f3b5c0}
.btn.gold{border-color:#ffe08a;color:#ffe08a}
.opt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lbl{color:var(--ink);font-size:20px}
input.dev{background:#000;border:2px solid #ffe08a;color:#ffe08a;font-family:inherit;font-size:24px;padding:4px 8px;width:150px;text-transform:uppercase;border-radius:0}
select.dev{background:#000;border:2px solid #2a4650;color:var(--ink);font-family:inherit;font-size:19px;padding:4px;max-width:100%}

/* ---------- TITLE ---------- */
#title{z-index:60;justify-content:flex-start;align-items:center;background:#000;padding-left:0;padding-right:0}
#tcv{image-rendering:pixelated;display:block;margin-top:4px}
#title h1{font-size:84px;margin:-6px 0 0;font-weight:normal;color:#dfeeee;letter-spacing:10px;
  text-shadow:4px 4px 0 #6e1222, -2px 0 #0aa;animation:tflick 5s steps(1) infinite}
@keyframes tflick{0%,92%,100%{opacity:1}93%{opacity:.3}95%{opacity:1}96%{opacity:.5}}
#title .sub{color:var(--dim);font-size:19px;letter-spacing:2px;margin-top:-6px;text-align:center}
#tmenu{display:flex;flex-direction:column;gap:9px;width:min(320px,86vw);margin-top:14px}
#tmenu .btn{font-size:24px;padding:9px;text-align:center}
#title .cw{margin-top:auto;color:#5a3a44;font-size:16px;text-align:center;padding:0 22px}
#tend{color:var(--dim);font-size:17px;text-align:center;margin-top:6px}

#toast{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translateX(-50%);z-index:80;background:#000;border:2px solid var(--cyan);
  color:var(--cyan);padding:4px 12px;font-size:19px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center;box-shadow:3px 3px 0 #000}
#toast.on{opacity:1}
#flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;transition:opacity .5s}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hrow">
      <span id="depth">6,100m</span><span id="chap">I. DESCENT</span>
      <button class="hbtn" id="btn-save">SAVE</button>
      <button class="hbtn" id="btn-inv">BAG</button>
      <button class="hbtn" id="btn-log">LOG</button>
      <button class="hbtn" id="btn-set">&#9881;</button>
    </div>
    <div class="bars">
      <div class="bar" id="bar-hp"><b>HP</b><div class="track"><div class="fill" id="f-hp"></div></div><i id="v-hp">100</i></div>
      <div class="bar" id="bar-o2"><b>O2</b><div class="track"><div class="fill" id="f-o2"></div></div><i id="v-o2">100</i></div>
      <div class="bar" id="bar-san"><b>SAN</b><div class="track"><div class="fill" id="f-san"></div></div><i id="v-san">100</i></div>
      <div class="bar" id="bar-mut"><b>MUT</b><div class="track"><div class="fill" id="f-mut"></div></div><i id="v-mut">0</i></div>
    </div>
    <div class="hrow" id="badges" style="margin-top:3px"><span class="badge" id="b-god">GOD MODE</span><span class="badge" id="b-core">CORE --</span><span class="badge" id="b-inf">INFECTED</span></div>
  </header>
  <div id="scenewrap"><canvas id="scene"></canvas></div>
  <main id="story"></main>
  <footer id="choices"></footer>
</div>

<div id="flash"></div>

<div class="ov" id="title">
  <canvas id="tcv"></canvas>
  <h1>HADAL</h1>
  <div class="sub">PRESSURE MAKES US HONEST</div>
  <div id="tmenu"></div>
  <div id="tend"></div>
  <div class="cw">Contains extreme body horror, gore, and isolation. Headphones recommended. Turn off silent mode for sound.</div>
</div>

<div class="ov" id="modal">
  <div class="ovh"><h2 id="mtitle">BAG</h2><button class="btn" id="mclose">CLOSE</button></div>
  <div class="ovb" id="mbody"></div>
</div>

<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   HADAL - engine
   ===================================================================== */
const $=s=>document.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function inl(s){return esc(s).replace(/\[(r|d|b|v|g)\]([\s\S]*?)\[\/\1\]/g,'<span class="t-$1">$2</span>');}

/* ---------- storage (safe) ---------- */
const MEM={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return MEM[k]||null;}},
  set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},
  del(k){delete MEM[k];try{localStorage.removeItem(k);}catch(e){}}
};
const K={manual:'hadal_manual_v1',auto:'hadal_auto_v1',set:'hadal_settings_v1'};
const settings=Object.assign({speed:'normal',sound:true,fx:true,timers:'normal',scene:'L',dev:false,god:false,endings:[]},store.get(K.set)||{});
function saveSettings(){store.set(K.set,settings);}

/* ---------- state ---------- */
let S=null;
function newState(){
  return {node:'d_start',hp:100,o2:100,san:100,mut:0,
    inv:{knife:1,flare:2,o2can:1},flags:{},logs:[],seen:{},once:{},
    moves:0,depth:6100,chapter:'I. DESCENT',zone:'bell',infected:false,overload:0,returnTo:null,bodySeen:[]};
}
function has(i){return (S.inv[i]||0)>0;}
function give(i,n){S.inv[i]=(S.inv[i]||0)+(n||1);toast('+ '+ITEMS[i].n+((n||1)>1?' x'+n:''));}
function take(i,n){S.inv[i]=(S.inv[i]||0)-(n||1);if(S.inv[i]<=0)delete S.inv[i];}
function setf(k,v){S.flags[k]=(v===undefined)?true:v;}
function once(k,f){if(S.once[k])return;S.once[k]=1;f();}
function log(id){if(S.logs.includes(id))return;S.logs.push(id);toast('LOG: '+LOGS[id].t);}
function infect(){if(!S.infected){S.infected=true;toast('INFECTED');}}
function mod(d){
  for(const k in d){
    const v=d[k];
    if(settings.god&&(k==='hp'||k==='o2'||k==='san')&&v<0)continue;
    S[k]=clamp(S[k]+v,0,100);
    if(settings.god&&k==='mut')S.mut=Math.min(S.mut,95);
    if(k==='hp'&&v<0)fx('hurt');
    if(k==='mut'&&v>0)fx('mut');
  }
  hud();
}
function deathCheck(){
  if(settings.god)return null;
  if(S.mut>=100)return 'end_choir';
  if(S.hp<=0)return 'end_opened';
  if(S.o2<=0)return 'end_drowned';
  if(S.san<=0)return 'end_unsealed';
  return null;
}

/* ---------- effects ---------- */
const flashEl=$('#flash'),appEl=$('#app');
function fx(kind){
  if(kind==='hurt'){AU.thud();if(!settings.fx)return;flash('rgba(200,10,30,.45)');appEl.classList.remove('shake');void appEl.offsetWidth;appEl.classList.add('shake');ART.shake();}
  if(kind==='mut'){AU.glitch();if(!settings.fx)return;flash('rgba(230,90,140,.3)');ART.glitch();}
}
function flash(c){flashEl.style.transition='none';flashEl.style.background=c;flashEl.style.opacity=1;void flashEl.offsetWidth;flashEl.style.transition='opacity .6s';flashEl.style.opacity=0;}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- HUD ---------- */
function setBar(k,v){$('#f-'+k).style.width=v+'%';$('#v-'+k).textContent=Math.round(v);
  const low=(k==='mut')?v>=75:v<=25;$('#bar-'+k).classList.toggle('low',low);}
function hud(){
  if(!S)return;
  setBar('hp',S.hp);setBar('o2',S.o2);setBar('san',S.san);setBar('mut',S.mut);
  $('#depth').textContent=S.depth.toLocaleString('en-US')+'m';
  $('#chap').textContent=S.chapter;
  $('#b-god').style.display=settings.god?'':'none';
  const core=$('#b-core');core.style.display=S.flags.overload?'':'none';core.textContent='CORE '+S.overload;
  $('#b-inf').style.display=S.infected?'':'none';
  const st=$('#story');
  st.classList.toggle('warp',settings.fx&&S.mut>=60);
  st.classList.toggle('insane',S.san<30);
}

/* ---------- text ---------- */
function parse(str){
  str=str.replace(/\n[ \t]+/g,'\n').trim();
  return str.split(/\n\s*\n/).map(p=>{
    const segs=[];const re=/\[(r|d|b|v|g)\]([\s\S]*?)\[\/\1\]/g;let last=0,m;
    while((m=re.exec(p))){if(m.index>last)segs.push({c:'',x:p.slice(last,m.index)});segs.push({c:m[1],x:m[2]});last=re.lastIndex;}
    if(last<p.length)segs.push({c:'',x:p.slice(last)});
    return segs;
  });
}
const SPEED={slow:34,normal:17,fast:6,instant:0};
let typing=null;
function typeOut(box,paras,done){
  const spd=SPEED[settings.speed];
  const q=[];
  paras.forEach(segs=>{
    const p=el('p');
    if(segs.length===1&&segs[0].c==='v'&&segs[0].x.startsWith('​'))p.className='bodyline';
    box.appendChild(p);
    segs.forEach(sg=>{const sp=el('span',sg.c?'t-'+sg.c:'');p.appendChild(sp);q.push({sp,x:sg.x.replace('​','')});});
  });
  const story=$('#story');
  if(!spd){q.forEach(o=>o.sp.textContent=o.x);done();return;}
  let qi=0,ci=0,dead=false,tm=null;
  const tap=el('div','tap','tap to skip');story.appendChild(tap);
  function finish(){if(dead)return;dead=true;clearTimeout(tm);for(;qi<q.length;qi++)q[qi].sp.textContent=q[qi].x;typing=null;tap.remove();done();}
  typing={finish};
  function step(){
    if(dead)return;
    const o=q[qi];if(!o){finish();return;}
    ci++;o.sp.textContent=o.x.slice(0,ci);
    const ch=o.x[ci-1];
    if(ci>=o.x.length){qi++;ci=0;}
    if(story.scrollHeight-story.scrollTop-story.clientHeight<140)story.scrollTop=story.scrollHeight;
    let d=spd;if(ch==='.'||ch==='!'||ch==='?')d=spd*9;else if(ch===','||ch===':')d=spd*4;else if(ch==='\n')d=spd*6;
    if(ch&&ch!==' '&&Math.random()<.18)AU.tick();
    tm=setTimeout(step,d);
  }
  step();
}

/* ---------- navigation ---------- */
const storyEl=$('#story'),choicesEl=$('#choices');
let tmr=null,modalOpen=false,busy=false;
function clearTimer(){if(tmr)cancelAnimationFrame(tmr);tmr=null;}

function go(id,echo,free){
  clearTimer();
  const n=NODES[id];
  if(!n){toast('Missing node: '+id);console.error('missing',id);return;}
  S.node=id;
  S.seen[id]=(S.seen[id]||0)+1;
  if(n.zone)S.zone=n.zone;
  if(n.depth!=null)S.depth=n.depth;
  if(n.ch)S.chapter=n.ch;
  if(!n.end&&!free){
    S.moves++;
    let dr=(n.drain!=null)?n.drain:2;
    if(S.mut>=40)dr=Math.ceil(dr/2);
    if(dr)mod({o2:-dr});
    if(S.infected&&S.moves%2===0)mod({mut:1});
    if(S.inv.sample)mod({san:-1});
    if(S.flags.overload&&!settings.god){S.overload--;if(S.overload<=0)return go('end_scuttle',echo,true);}
    else if(S.flags.overload&&settings.god){S.overload=Math.max(1,S.overload-1);}
  }
  if(n.onEnter){const r=n.onEnter(S);if(r)return go(r,echo,true);}
  if(!n.end){const d=deathCheck();if(d)return go(d,echo,true);}
  if(n.checkpoint){store.set(K.auto,{S:S,t:Date.now()});setTimeout(()=>toast('PRESSURE LOCK - progress recorded'),400);}
  render(id,echo);
}

function bodyLine(){
  let pool=null;
  for(const [lv,arr] of BODY){if(S.mut>=lv)pool={lv,arr};}
  if(!pool)return null;
  if(Math.random()>.45)return null;
  const fresh=pool.arr.filter(x=>!S.bodySeen.includes(x));
  const line=fresh.length?pick(fresh):pick(pool.arr);
  if(!S.bodySeen.includes(line))S.bodySeen.push(line);
  return line;
}

function render(id,echo){
  const n=NODES[id];
  busy=false;
  storyEl.innerHTML='';choicesEl.innerHTML='';
  storyEl.scrollTop=0;
  if(echo)storyEl.appendChild(el('div','echo','&gt; '+inl(echo)));
  if(n.end)storyEl.appendChild(el('div','endtitle','ENDING: '+esc(n.endName)));
  let txt=typeof n.text==='function'?n.text(S):n.text;
  if(!n.end&&!n.timed){
    const b=bodyLine();if(b)txt+='\n\n[v]​'+b.replace(/\[r\]|\[\/r\]/g,'')+'[/v]';
    if(S.san<30&&Math.random()<.5)txt+='\n\n[g]'+pick(HALLU)+'[/g]';
  }
  const box=el('div');storyEl.appendChild(box);
  hud();
  ART.set(typeof n.scene==='function'?n.scene(S):(n.scene||'dark'));
  audioCue(n);
  typeOut(box,parse(txt),()=>showChoices(id));
}

function audioCue(n){
  const sfx=typeof n.sfx==='function'?n.sfx(S):n.sfx;
  if(sfx==='sting')AU.sting();else if(sfx==='ping')AU.ping();else if(sfx==='thud')AU.thud();
  let c=typeof n.choir==='function'?n.choir(S):n.choir;
  if(c==null)c=(n.zone==='bell')?0:.15;
  AU.setChoir(c);
  AU.setAlarm(!!(S.flags.overload&&!n.end));
  if(!n.end&&(S.hp<35||S.o2<25))AU.heartbeat();

function showChoices(id){
  const n=NODES[id];
  choicesEl.innerHTML='';
  if(n.end){endButtons(n);return;}
  if(n.keypad&&(!n.keypadIf||n.keypadIf(S))){keypad(n);return;}
  let list=(n.choices||[]).filter(c=>!c.if||c.if(S));
  if(!n.timed&&S.san<35&&id!=='hallu_helmet'&&Math.random()<.35){
    list=list.slice();
    list.splice(Math.floor(Math.random()*(list.length+1)),0,{t:'Take off your helmet. Just for a second.',to:()=>{S.returnTo=id;return 'hallu_helmet';}});
  }
  list.forEach((c,i)=>{
    const lock=c.lock?c.lock(S):null;
    const label=typeof c.t==='function'?c.t(S):c.t;
    const hint=typeof c.hint==='function'?c.hint(S):c.hint;
    const b=el('button','ch'+(lock?' lock':'')+(c.cls?' '+c.cls:''));
    b.innerHTML=inl(label)+(lock?'<small>LOCKED: '+esc(lock)+'</small>':(hint?'<small>'+esc(hint)+'</small>':''));
    b.style.animationDelay=(i*60)+'ms';
    b.onclick=()=>{if(busy)return;if(lock){AU.blip();toast(lock);return;}choose(c,label);};
    choicesEl.appendChild(b);
  });
  if(n.timed)startTimer(n);
  choicesEl.scrollTop=0;
}
function choose(c,label){
  busy=true;AU.blip();
  if(c.fx)c.fx(S);
  const to=typeof c.to==='function'?c.to(S):c.to;
  go(to,label);
}
function startTimer(n){
  const total=n.timed.sec*1000*(settings.timers==='relaxed'?2:1);
  const bar=el('div','timer'),inner=el('div');bar.appendChild(inner);choicesEl.prepend(bar);
  let left=total,last=performance.now(),beat=0;
  const tick=now=>{
    if(!tmr)return;
    const dt=Math.min(100,now-last);last=now;
    if(!modalOpen)left-=dt;
    inner.style.width=Math.max(0,left/total*100)+'%';
    beat+=dt;if(beat>650){beat=0;AU.heartbeat(.5);}
    if(left<=0){tmr=null;if(!busy){busy=true;go(n.timed.fail,'(you hesitated)');}return;}
    tmr=requestAnimationFrame(tick);
  };
  tmr=requestAnimationFrame(tick);
}
function keypad(n){
  const wrap=el('div','kp'),disp=el('div','kpd','____'),grid=el('div','kpg');let code='';
  const upd=()=>{disp.textContent=(code+'____').slice(0,4);};
  ['1','2','3','4','5','6','7','8','9','CLR','0','OK'].forEach(k=>{
    const b=el('button','kpk',k);
    b.onclick=()=>{
      if(busy)return;AU.blip();
      if(k==='CLR')code='';
      else if(k==='OK'){if(code.length<4){toast('Four digits');return;}busy=true;go(code===n.keypad.answer?n.keypad.ok:n.keypad.fail,'You key in '+code);return;}
      else if(code.length<4)code+=k;
      upd();
    };
    grid.appendChild(b);
  });
  wrap.appendChild(disp);wrap.appendChild(grid);choicesEl.appendChild(wrap);
  const back=el('button','ch','Step away from the hatch');back.style.animationDelay='0ms';
  back.onclick=()=>{if(busy)return;busy=true;go(n.keypad.back,'Step away');};

}
function endButtons(n){
  if(!settings.endings.includes(n.ending)){settings.endings.push(n.ending);saveSettings();}
  const p=el('p','t-d','Endings discovered: '+settings.endings.length+' / '+ENDINGS.length);

 choices:[{t:'Continue',to:'d_bell'}]},

d_trans:{zone:'bell',scene:'bell',sfx:'sting',
 onEnter:s=>{setf('trans');once('t_san',()=>mod({san:-6}));log('lena0');},
 text:`You thumb the playback. A woman's voice, too close to the microphone.

"CALYX to Meridian. Lena Voss, comms. We're fine. Disregard the earlier. Disregard Okafor. We are all fine, we are all [g]so much roomier[/g] now-"

A wet click.

Under her voice, something that is not static. A chord. Hundreds of voices holding one note, and the note is moving up and down your spine like a fingertip.

"-don't send anyone. Or do. Send everyone. [r]There's space.[/r]"`,
 choices:[{t:'Continue',to:'d_bell'}]},

d_view:{zone:'bell',scene:'shoal',sfx:'sting',
 onEnter:s=>{setf('view');once('v_san',()=>mod({san:-4}));},
 text:`Your lamp catches them at the edge of its reach: a shoal of fish, maybe a hundred, turning as one.

As they turn, you see they are not separate. A single sheet of grey skin stretches between them. A hundred bodies stitched into one wide, rippling flag of flesh.

Every eye on the sheet rolls toward the bell at the same moment.

Then the sheet folds itself, gently, like a hand closing, and sinks below your light.`,
 choices:[{t:'Continue',to:'d_bell'}]},

d_dock:{ch:'I. DESCENT',depth:8140,zone:'bell',scene:'dock',sfx:'thud',checkpoint:true,
 text:`At 8,140 metres the bell kisses CALYX's docking collar with a sound like a dropped plate. Magnetic clamps bite.

The radio dissolves into a long, slow hiss, and under the hiss, very faintly: [v]humming[/v].

[b]COLE:[/b] "Three- losing yo- ...something on the line, is that y-"

Then nothing.

The hatch beneath your boots is stencilled MOON POOL. Something has been smeared across the letters, and has dried brown.`,
 choices:[{t:'Open the hatch',to:'mp_enter'}]},

/* ------------------------------------------------ II. CALYX */
mp_enter:{ch:'II. CALYX',depth:8140,zone:'station',scene:'moonpool',sfx:'sting',choir:.12,
 text:`The moon pool is a round room around a round hole of black water. Emergency lights pulse red, slowly, like something breathing.

Someone is on the ceiling.

Dr. Halvard Okafor (you know him from the briefing photo, or from what's left of his face) is fused to the ceiling above the pool, spread like a starfish. His chest has opened. Not torn: [r]opened[/r]. The ribs have folded outward like the petals of a flower, and each rib ends in a small, perfect human tooth.

Inside the bloom of his chest, his lungs inflate. Deflate. Inflate.

He's still breathing.`,
 choices:[
  {t:'Look closer at Okafor',to:'mp_okafor'},
  {t:'Fire a flare into the pool',to:'mp_flare',if:s=>has('flare')&&!s.flags.poolflare,fx:()=>take('flare')},
  {t:'Leave him. Go into the station',to:'ring'}]},

mp_okafor:{zone:'station',scene:'moonpool',choir:.12,
 onEnter:s=>{once('ok_san',()=>mod({san:-8}));log('okafor1');},
 text:`You step under him. Water drips from his fingers. No. Not water. His fingers are dripping [r]themselves[/r], lengthening into pink threads that reach down for the pool like roots looking for soil.

His eyes open. Milky. Gentle.

"Oh," he says, delighted. "A new one."

His voice comes from the bloom in his chest. The teeth on his ribs click together when he speaks.

"It doesn't hurt. That's what I want you to know. I'm a scientist; I would tell you if it hurt. It is [b]so kind[/b]. It is only trying to help us fit. We found it on the fourteenth, you know. March the fourteenth. Yuki made a cake."

A lanyard hangs from his collar. A keycard turns slowly on it: [b]LAB ACCESS - B[/b].`,
 choices:[
  {t:'Take the keycard',to:'mp_card',if:s=>!has('keycard')},
  {t:'End it. Knife through the throat',to:'mp_mercy',cls:'danger',if:s=>!s.flags.okmercy},
  {t:'Step back',to:'mp_room'}]},

mp_card:{zone:'station',scene:'moonpool',
 onEnter:s=>{once('card',()=>give('keycard'));},
 text:`The lanyard doesn't come free. The nylon has grown into his neck, woven through with pink. You saw through it with the knife while he watches you fondly.

"Ask Yuki about the date," he murmurs. "Bram always writes it backwards. Bram does everything backwards now. We all do. We're all [g]facing down[/g]."

[d]Lab keycard B acquired.[/d]`,
 choices:[
  {t:'End it. Knife through the throat',to:'mp_mercy',cls:'danger',if:s=>!s.flags.okmercy},
  {t:'Leave him breathing',to:'ring'}]},

mp_mercy:{zone:'station',scene:'moonpool',sfx:'sting',
 onEnter:s=>{setf('okmercy');once('okm',()=>{mod({san:-6});if(!s.flags.diag){mod({mut:8});infect();}});},
 text:s=>`It takes longer than it should. The flesh is soft as wet bread and then suddenly hard as horn, and he hums the whole time, encouraging you.

When it's done, the bloom of ribs closes slowly, like a flower at dusk. The teeth click once, all together. [d]Thank you[/d], or only a reflex. You don't let yourself decide which.

`+(s.flags.diag?`Something warm runs down your glove. You check the scratch on your knuckle: the tape you put on in the bell is holding. Good. [b]Good.[/b]`
 :`Something warm runs down your glove and finds the scratch across your knuckle. You feel it go in: cold, then warm, then nothing at all, which is worse.

[r]You are infected.[/r]`),
 choices:[{t:'Go into the station',to:'ring'},{t:'Stay a moment',to:'mp_room'}]},

mp_flare:{zone:'station',scene:'poolface',sfx:'sting',choir:.35,
 onEnter:s=>{setf('poolflare');once('pf',()=>mod({san:-10}));},
 text:`The flare hits the water and keeps burning as it sinks, a red thread unspooling downward.

Ten metres. Twenty. The pool has no bottom; the station's floor is open to the trench.

At thirty metres the light finds a face looking up.

It is the size of the bell. It is made of faces. Fish faces, human faces, faces of things you have no names for, packed together like scales. Every mouth is open in the same perfect O, singing a note too low to hear. You feel it in your fillings.

Then the flare goes out, and the faces are still there. You just can't see them.`,
 choices:[{t:'Back away from the edge',to:'mp_room'}]},

mp_room:{ch:'II. CALYX',zone:'station',scene:'moonpool',choir:.12,
 text:s=>`The moon pool. Red light breathing in and out. `+(s.flags.okmercy?`Okafor hangs still on the ceiling, his bloom of ribs folded shut.`:`Above the black water, Okafor breathes and hums, pleased to see you again.`)+`

Your bell waits at the docking collar. It is the only way up.`+(s.flags.overload?`

[r]Klaxons. The whole station is shaking. CORE OVERLOAD IN ${s.overload}.[/r]`:''),
 choices:[
  {t:'Look closer at Okafor',to:'mp_okafor',if:s=>!s.flags.okmercy},
  {t:'Fire a flare into the pool',to:'mp_flare',if:s=>has('flare')&&!s.flags.poolflare,fx:()=>take('flare')},
  {t:'Board the bell and ascend',to:'bell_confirm',cls:'danger'},
  {t:'Go into the station',to:'ring'}]},

bell_confirm:{zone:'bell',scene:'bell',
 text:s=>{let w=[];
  if(s.inv.sample) w.push(`The flask on your hip is humming. [r]Specimen Zero is coming with you.[/r]`);
  if(s.mut>=50) w.push(`Your body has changed more than half way. [r]Ines said not to go up past halfway.[/r]`);
  else if(s.mut>=35) w.push(`The slits under your jaw flutter. You are close to halfway.`);
  if(!s.flags.overload) w.push(`CALYX is still intact. The song is still playing.`);
  else w.push(`[b]The core is counting down. CALYX will not be here much longer.[/b]`);
  return `You seal yourself into the bell. One lever drops the ballast, and then there is no coming back down.

`+w.join('\n\n');},
 choices:[
  {t:'Drop the ballast. Go up.',to:s=>bellEnding(s),cls:'danger'},
  {t:'Not yet',to:'mp_room'}]},

ring:{ch:'II. CALYX',depth:8140,zone:'station',scene:'ring',choir:.15,checkpoint:true,
 text:s=>{
  let t;
  if(s.seen.ring===1) t=`The Ring Corridor loops around the station's core, a circle of white panels gone the colour of old teeth. Emergency strips glow red along the floor.

The walls are [r]growing[/r]. A pink lichen has crept across the panels, glossy and finely veined. When your lamp touches it, it brightens and pulses, slowly, like a gum around a new tooth.

Doors lead off the ring: MED BAY. CREW. LAB. COMMS. ENGINEERING.

In the floor at the centre: a heavy circular hatch. [b]LOWER ACCESS - TRENCH ANCHOR[/b].

Behind you, the moon pool, and your bell.`;
  else t=`The Ring Corridor. Red light, pink walls.

`+pick(AMB);
  if(s.flags.overload) t+=`

[r]Klaxons scream. CORE OVERLOAD IN ${s.overload}. Get to the bell.[/r]`;
  return t;},
 choices:[
  {t:'Med Bay',to:'med',hint:s=>s.flags.ines==='dead'?'Ines is at rest':(s.seen.med?'Ines':'')},
  {t:'Crew Quarters',to:'crew',hint:s=>s.seen.crew?'visited':''},
  {t:'Lab',to:'lab',lock:s=>has('keycard')?null:'Keycard B required'},
  {t:'Comms',to:'comms',hint:s=>s.seen.comms?'Lena':''},
  {t:'Engineering',to:'eng',hint:s=>'flooded'},
  {t:'Lower Access hatch',to:'hatch',hint:s=>s.flags.hatchopen?'open - lift to the trench':'4-digit code'},
  {t:'Moon pool & the bell',to:'mp_room'}]},

/* ---- MED BAY */
med:{zone:'station',scene:'med',choir:.15,
 text:s=>{
  if(s.flags.ines==='dead') return `The med bay. White light, merciless.

Ines lies still on the table. Her face is younger now. The tail lies in a loose coil on the floor where it finished writing. You still don't read it.`;
  if(s.seen.med===1) return `The med bay. The lights here still work, white and merciless.

Ines Moreau, the station medic, is strapped to the surgical table. She did the straps herself; the buckles have her teeth marks on them.

From the waist up she is a tired woman in her forties with a shaved head and very steady eyes. From the waist down she is something else. Her legs have fused into a single long segmented tail that hangs off the end of the table and coils on the floor, three metres of it, and every segment is lined with [r]fingernails[/r]. Hundreds. Human. Painted in a chipped coral polish she must have worn on her toes.

The tail moves when she isn't looking at it.

"Don't touch anything wet," she says. "Hello. You're from Meridian. I'm so sorry they sent you."`;
  let t=`Ines watches you come back in. The tail lifts, curious, then settles. "Still you?" she asks.`;
  if(s.mut>=35) t+=`

She looks at your neck. At your hands. Her face doesn't change, but her voice goes very gentle. "Ah," she says. "Not all the way, though. Not yet."`;
  return t;},
 choices:[
  {t:'"What happened here?"',to:'med_what',if:s=>s.flags.ines!=='dead'&&!s.flags.m_what},
  {t:'"If it\'s in me, how do I stop it?"',to:'med_cure',if:s=>s.flags.ines!=='dead'&&!s.flags.m_cure},
  {t:'"Can I get you out of here?"',to:'med_out',if:s=>s.flags.ines!=='dead'&&!s.flags.m_out},
  {t:'"Do you want me to end it?"',to:'med_mercy',cls:'danger',if:s=>s.flags.ines!=='dead'},
  {t:'Search the medical cabinets',to:'med_search',if:s=>!s.flags.m_search},
  {t:'Back to the ring',to:'ring'}]},

med_what:{zone:'station',scene:'med',
 onEnter:s=>{setf('m_what');log('ines1');},
 text:`"Halvard brought a film up from the vent in March. It wasn't killing the tubeworms down there. It was [b]improving[/b] them. Then it got into Tee through a cut on his hand."

She looks at the ceiling as if she can see eight kilometres of water pressing on it.

"Down here, the pressure crushes everything that isn't built for it. Lamina rebuilds you so you fit. Bones go soft so they can't snap. Lungs open to the water. Skin learns to [r]share[/r]. It isn't malicious, love. It's a tailor."

The fingernails on her tail rattle softly, like applause in another room.

"And everything it changes, it connects. Down below the anchor there's... Bram called it the Choir. Bram went down to it. He took the reactor key with him, the idiot, so nobody could scuttle the station. It talks in your head like it's you. He thought it was his idea."`,
 choices:[{t:'Continue',to:'med'}]},

med_cure:{zone:'station',scene:'med',
 onEnter:s=>{setf('m_cure');once('icure',()=>{give('cauterizer',3);give('sedative');});},
 text:`She nods at a steel tray. "Cauterizer. Burns out the filaments early, before they root. It hurts more than anything you've ever felt. Use it when you feel the itch."

"And Yuki, Dr. Sato, was building a suppressor in the lab. If there's a dose left in the cold store, it'll strip it back. Not all the way. Nothing goes all the way."

She pushes a little case toward you with her elbow. "Sedative. For you, not me. I've been saving it for the day I stopped being able to tell the difference."

[d]Cauterizer (3 charges) and Sedative acquired.[/d]`,
 choices:[{t:'Continue',to:'med'}]},

med_out:{zone:'station',scene:'med',
 onEnter:s=>{setf('m_out');log('ines2');},
 text:`She laughs, and the tail laughs too: the fingernails rattle along its whole length.

"Out. I weigh four hundred kilos, love."

Then, serious: "Listen to me. Everything it builds is built for pressure. That's the only good news. Take it up past three thousand metres and it comes apart, or it takes whoever's carrying it and goes [r]bloom[/r]."

"Don't take anything up. Not the sample in Yuki's lab. Not yourself, if you're past halfway." She looks at your hands. "You'll know halfway. You'll feel it."`,
 choices:[{t:'Continue',to:'med'}]},

med_search:{zone:'station',scene:'med',
 onEnter:s=>{setf('m_search');once('msearch',()=>{give('o2can');give('adrenaline');});},
 text:`Most of the drawers are empty. One is full of teeth, sorted by size by someone very patient.

At the back of a cabinet you find an O2 canister and an adrenaline autoinjector.

[d]O2 canister and Adrenaline acquired.[/d]`,
 choices:[{t:'Continue',to:'med'}]},

med_mercy:{zone:'station',scene:'med',
 text:`"Yes," she says, so fast it's obvious she has been waiting nineteen days for someone to ask.

"The tail's the problem. It'll fight. Not the throat, it's grown armour there." She taps her temple. "Here. Quick. Don't let it see the knife."`,
 choices:[{t:'Do it',to:'med_kill',cls:'danger'},{t:'"Not yet."',to:'med'}]},

med_kill:{zone:'station',scene:'med',sfx:'sting',timed:{sec:5,fail:'med_kill_fail'},
 text:`You set the point of the knife at her temple. She closes her eyes.

The tail does not agree.

It rises behind you like a cobra, three metres of segmented meat, every fingernail along it flaring out like the scales of a furious fish-`,
 choices:[
  {t:'Drive the knife in. Now.',to:'med_kill_hit'},
  {t:'Throw yourself flat',to:'med_duck'}]},

med_duck:{zone:'station',scene:'med',
 text:`You drop. The tail whips through the air where your helmet was and buries a hundred fingernails in the cabinet door.

While it tears itself free, you stand, and you do it.`,
 choices:[{t:'Continue',to:'med_kill_done'}]},
med_kill_hit:{zone:'station',scene:'med',
 onEnter:s=>{once('mk_hit',()=>mod({hp:-15}));},
 text:`You push. At the same moment the tail comes down across your back, and a hundred fingernails scrape your suit like a bag of knives. Two of them get through.

But you push.`,
 choices:[{t:'Continue',to:'med_kill_done'}]},
med_kill_fail:{zone:'station',scene:'med',
 onEnter:s=>{once('mk_fail',()=>{mod({hp:-30,mut:5});});fx('hurt');},
 text:`You hesitate, and the tail does not.

It wraps your torso twice and squeezes, gently at first, then not gently. Fingernails find the seams of your suit and work into them, patient, like someone picking at a scab. Something pops in your side.

Ines screams at it, and it lets you go: sulky, like a dog called off.

On the floor, wheezing, you get up, and you do it.`,
 choices:[{t:'Continue',to:'med_kill_done'}]},
med_kill_done:{zone:'station',scene:'med',
 onEnter:s=>{s.flags.ines='dead';once('mk_done',()=>mod({san:-8}));},
 text:`It is over very quickly.

Her face relaxes into someone younger. The tail goes on moving for a long time afterwards, slowly writing something on the floor with its fingernails.

You don't read it.`,
 choices:[{t:'Continue',to:'med'}]},

/* ---- CREW */
crew:{zone:'station',scene:'crew',choir:.15,
 text:s=>s.seen.crew===1?`Six bunks. Five are empty.

The sixth has someone in it, under a sheet, and the sheet is [r]breathing[/r].

Photos are still taped above the bunks. Lena Voss's has a postcard tucked into the frame. Commander Bram Kessel's locker hangs open.`
 :`Crew quarters. `+(s.flags.sheet?`The shed skin lies on the bunk, deflated now, like a coat somebody stepped out of.`:`The sheet on the sixth bunk rises. Falls. Rises.`),
 choices:[
  {t:'Search Kessel\'s locker',to:'crew_bram',if:s=>!s.flags.c_bram},
  {t:'Search Lena\'s bunk',to:'crew_lena',if:s=>!s.flags.c_lena},
  {t:'Lift the sheet',to:'crew_sheet',cls:'danger',if:s=>!s.flags.sheet},
  {t:'Back to the ring',to:'ring'}]},

crew_bram:{zone:'station',scene:'crew',
 onEnter:s=>{setf('c_bram');log('bram1');},
 text:`Uniforms. A photo of two kids on a beach. A bottle of something brown with two fingers left in it.

Taped inside the door, a note in block capitals:

[b]HATCH CODE CHANGED. NOBODY GOES TO THE ANCHOR WITHOUT ME. CODE IS THE DAY WE FOUND IT, WRITTEN BACKWARDS, LIKE EVERYTHING ELSE DOWN HERE. - B.K.[/b]

[d]Log added.[/d]`,
 choices:[{t:'Continue',to:'crew'}]},

crew_lena:{zone:'station',scene:'crew',
 onEnter:s=>{setf('c_lena');log('lena1');once('clena',()=>give('o2can'));},
 text:`A postcard to someone called Mira, never sent. [d]Eighteen more days. Save me the room by the window.[/d]

Under the mattress, wrapped in a T-shirt like contraband: a full O2 canister.

[d]O2 canister acquired.[/d]`,
 choices:[{t:'Continue',to:'crew'}]},

crew_sheet:{zone:'station',scene:'crew',sfx:'sting',
 onEnter:s=>{setf('sheet');once('csh',()=>mod({san:-10}));},
 text:`You lift it.

It's a person. It's the [r]outside[/r] of a person. A whole human skin, shed in one piece like a snake's, still holding the shape of a man, Tomas Reyes by the tattoo on the forearm. The face is a soft empty mask.

It's breathing because it's full. The pink lichen has filled it like stuffing, and the lichen respires, slowly, so the empty chest rises and falls.

In the open mouth, neatly arranged in a circle, someone has placed all thirty-two of his teeth.

Above you, the ceiling vent rattles.`,
 choices:[{t:'Look up',to:'crew_crawl'}]},

crew_crawl:{zone:'station',scene:'crawler',sfx:'sting',timed:{sec:4,fail:'crew_bit'},
 text:`Something drops from the vent and lands on the bunk with a soft wet slap.

It's a hand. A woman's hand, walking on its fingertips. The fingers have grown long, too long, four joints each, and the fingernails at the ends have thickened into little hooves. In the centre of the palm, an [r]eye[/r] opens and looks at you.

It runs at your faceplate.`,
 choices:[
  {t:'Stomp it',to:'crew_stomp'},
  {t:'Burn it with a flare',to:'crew_burn',if:s=>has('flare'),fx:()=>take('flare')},
  {t:'Swat it away',to:'crew_swat'}]},
crew_stomp:{zone:'station',scene:'crew',
 onEnter:s=>{once('cst',()=>mod({san:-3}));},
 text:`You bring your boot down. It crunches like a bag of shrimp. The eye in the palm looks up at you, surprised, then fogs over.

The fingers keep walking in place for a while.`,
 choices:[{t:'Continue',to:'crew'}]},
crew_burn:{zone:'station',scene:'crew',
 text:`You jam the flare into its palm. It screams. A hand cannot scream, so it does it with the eye, somehow, and you will hear that sound for the rest of your life.

It curls up like a dead spider and smokes.`,
 choices:[{t:'Continue',to:'crew'}]},
crew_swat:{zone:'station',scene:'crew',
 onEnter:s=>{once('csw',()=>mod({hp:-6}));},
 text:`You swat it. It catches your glove and climbs, fast, and you feel the little hooves try the seams of your sleeve before you tear it off and fling it against the wall. It scuttles back into the vent.

It will remember you.`,
 choices:[{t:'Continue',to:'crew'}]},
crew_bit:{zone:'station',scene:'crawler',
 onEnter:s=>{once('cbit',()=>{mod({hp:-15,mut:6});infect();});fx('hurt');},
 text:`Too slow.

It lands on your faceplate and spreads its fingers across the glass like a face-hugging starfish. The eye in its palm presses right against the glass, looking into your eye from two centimetres away. Then a fingertip finds the seal at your collar and [r]goes in[/r].

You tear it off and smash it into the wall until it stops. There's a neat little puncture at your collar seam. It itches.

[r]You are infected.[/r]`,
 choices:[{t:'Continue',to:'crew'}]},

/* ---- LAB */
lab:{zone:'station',scene:'lab',choir:.25,sfx:s=>s.seen.lab===1?'sting':null,
 onEnter:s=>{once('lab_s',()=>mod({san:-8}));},
 text:s=>s.seen.lab===1?`The lab door unlocks with a cheerful chirp that sounds obscene in the silence.

The lab windows used to look out onto the trench. Now they look out onto Dr. Yuki Sato.

She is on the outside of the glass. She is on the [r]inside[/r] of the glass. She has been stretched, somehow, across the whole forward wall: a translucent membrane of her, thin as a drum skin, eight metres wide. Her face is in the centre, enormous, flattened, smooth, the features drifted apart like continents. Her eyes are two metres apart.

They follow you.

Below her, the specimen tank is cracked. A pink film fills the floor drain.`
 :`The lab. Yuki Sato's vast face watches you from the window, her eyes sliding slowly across the glass to keep you in view.`,
 choices:[
  {t:'Read Sato\'s terminal',to:'lab_term',if:s=>!s.flags.l_term},
  {t:'Open the cold store',to:'lab_cold',if:s=>!s.flags.l_cold},
  {t:'Take Specimen Zero',to:'lab_sample',if:s=>!s.inv.sample&&!s.flags.l_sample},
  {t:'Talk to Sato',to:'lab_sato'},
  {t:'Back to the ring',to:'ring'}]},

lab_term:{zone:'station',scene:'lab',
 onEnter:s=>{setf('l_term');log('sato1');log('sato2');log('sato3');},
 text:`The terminal is still logged in. Three entries matter.

[b]14/03.[/b] [d]Halvard brought up a sample from the vent at 8,190 m. Pink biofilm. Halvard wants to name it Lamina. Fine. Cake went uneaten.[/d]

[b]DAY 31.[/b] [d]It is not a parasite. Parasites take. Lamina restructures. I've synthesised a suppressor. One dose in the cold store; the rest went into Ines and it was not enough.[/d]

[b]FINAL.[/b] [d]I'm going to sit by the window. I want to see it. I think, soon, I'll be able to see everything.[/d]

[d]Logs added.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},

lab_cold:{zone:'station',scene:'lab',timed:{sec:3.5,fail:'lab_bitten'},
 onEnter:s=>{setf('l_cold');},
 text:`You kneel at the cold store. The seal is stiff.

Beside you, the floor drain gurgles.

A filament as thin as a hair lifts out of it, tasting the air like a tongue. Then another. Then they all turn toward the scratch-thin seam at your wrist, and [r]whip[/r]-`,
 choices:[
  {t:'Yank your hand back',to:'lab_dodge'},
  {t:'Jam a flare into the drain',to:'lab_burn',if:s=>has('flare'),fx:()=>take('flare')}]},
lab_dodge:{zone:'station',scene:'lab',
 onEnter:s=>{once('serum',()=>give('serum'));},
 text:`You throw yourself sideways. The filaments snap shut on air, confused, and slowly sink back into the drain like they're embarrassed.

You get the cold store open with your other hand. One injector. Handwritten label: [b]SUPPRESSOR - LAST - Y.S.[/b]

[d]Suppressor acquired.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},
lab_burn:{zone:'station',scene:'lab',
 onEnter:s=>{once('serum',()=>give('serum'));},
 text:`The flare goes into the drain hissing. The filaments shrivel back with a smell like burnt hair and sugar. Somewhere deep in the pipes, many small voices sing a single note of complaint.

The cold store holds one injector. Handwritten label: [b]SUPPRESSOR - LAST - Y.S.[/b]

[d]Suppressor acquired.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},
lab_bitten:{zone:'station',scene:'lab',
 onEnter:s=>{once('lbit',()=>{mod({mut:12,hp:-5});infect();give('serum');});fx('hurt');},
 text:`Too slow.

The filaments find your wrist seam and go in. It feels like a cold thread being pulled through the bone of your forearm, out the other side, and back.

You rip your arm away. The ends stay in you. You watch them, under the fabric of your sleeve, [r]settle[/r].

You get the cold store open with your shaking hand. One injector: [b]SUPPRESSOR - LAST - Y.S.[/b]

[r]You are infected.[/r] [d]Suppressor acquired.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},

lab_sample:{zone:'station',scene:'lab',
 onEnter:s=>{setf('l_sample');once('samp',()=>give('sample'));},
 text:`Specimen Zero sits in a containment flask the size of your palm, in a rack that has been bolted, welded and then bolted again.

Inside, the pink film slowly writes itself into the shape of a [r]hand[/r] pressing against the glass from the inside. As you lift it, the hand presses harder. It's warm. It's pleased.

Meridian wants this. It's why they paid you.

[d]Specimen Zero acquired. It drains your sanity while you carry it.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},

lab_sato:{zone:'station',scene:'lab',choir:.3,
 onEnter:s=>{if(s.mut<30) once('sato_s',()=>mod({san:-5})); else setf('satoheard');},
 text:s=>s.mut>=30?`Sato's mouth moves, two metres wide. Before, it was only a vibration in the glass. Now, with the new slits under your jaw open, you understand her perfectly.

[v]"Hello, Diver. Thank you for coming. The reactor key: Bram took it down to the Choir. Get it. Set the core. Burn us. [b]Please.[/b]"[/v]

[v]"And whatever you do, don't let it ride up with you. It wants the light so badly."[/v]

Her eyes close, slowly, two metres apart.`
 :`Her vast mouth moves slowly. The glass hums. You can't make out words, just a vibration that comes up through your boots and makes your teeth ache in their sockets.

[d]Maybe if you were a little more like her, you'd understand.[/d]`,
 choices:[{t:'Continue',to:'lab'}]},

/* ---- COMMS */
comms:{zone:'station',scene:'comms',choir:s=>s.flags.unplug?.2:.55,
 onEnter:s=>{once('comms_s',()=>mod({san:-8}));},
 text:s=>s.seen.comms===1?`Comms. Lena Voss sits at her station with her back to you, headphones on.

She turns around.

Her lower jaw is gone. Not gone: [r]grown[/r]. It hangs to her waist, elongated, hinged in three new places, flared at the end into a wide bell of cartilage like the horn of an old gramophone. Her tongue lies inside the bell, flat and broad as a speaker cone, vibrating.

The humming you heard on the radio is coming out of her. She's broadcasting it. She has been broadcasting it for nineteen days.

Her eyes are entirely human, and they are crying.`
 :`Comms. Lena turns her head to watch you, the great horn of her jaw swinging. `+(s.flags.unplug?`The transmitter is dark. Her tongue vibrates into the silence anyway.`:`The transmitter is live. The song pours out of her into the dark.`),
 choices:[
  {t:'Pull the transmitter plug',to:'comms_plug',if:s=>!s.flags.unplug},
  {t:'Repair the radio and call Meridian',to:'comms_radio',if:s=>!s.flags.cole,lock:s=>has('fuse')?null:'Blown fuse. Engineering has spares.'},
  {t:'Listen to her song',to:'comms_listen',cls:'mut',if:s=>s.mut>=25&&!s.flags.listen},
  {t:'Back to the ring',to:'ring'}]},

comms_plug:{zone:'station',scene:'comms',
 onEnter:s=>{setf('unplug');once('plug',()=>mod({san:6}));},
 text:`You find the transmitter feed and rip it out.

The humming in your helmet stops so suddenly your ears ring. Lena convulses, once, and the horn of her jaw swings toward you. For a second there's something like relief in her eyes.

Then she points, very deliberately, at the radio set: the fuse housing is black and blistered. She mimes slotting something in.

[d]Your sanity steadies a little.[/d]`,
 choices:[{t:'Continue',to:'comms'}]},

comms_radio:{zone:'station',scene:'comms',
 onEnter:s=>{setf('cole');take('fuse');log('cole1');},
 text:`The fuse seats with a thunk. The set warms up. You find the Meridian frequency.

[b]COLE:[/b] "-ree, Three, is that you? Thank God. Status?"

You tell him. You tell him all of it. There's a long silence.

[b]COLE:[/b] "Okay. Okay. Listen. Corporate's on the other line. They don't care about the crew. They want Specimen Zero. Bring it up and you are set for [b]life[/b], Three. Ten million. They said ten."

Another pause. His voice changes.

[b]COLE:[/b] "...and Three? If it's in you, don't come up. I'm sorry. I'll make sure the contract pays out. I'm sorry."`,
 choices:[{t:'Continue',to:'comms'}]},

comms_listen:{zone:'station',scene:'comms',choir:.8,
 onEnter:s=>{setf('listen');once('lis',()=>mod({san:-6,mut:3}));log('lena2');},
 text:`You stop fighting it. You let the song in.

The slits under your jaw flutter open, and suddenly it isn't humming. It's language.

[v]"It's not a song,"[/v] Lena is saying, through the horn, through you. [v]"It's a map. Every voice it takes, it takes a little higher. It's showing the others where we are."[/v]

[v]"It wants to go up. It wants the light. Don't carry it. Don't you dare carry it."[/v]

When you pull yourself back, you're humming. You don't remember starting.`,
 choices:[{t:'Continue',to:'comms'}]},

/* ---- ENGINEERING */
eng:{zone:'station',scene:'flood',choir:.15,
 text:s=>`ENGINEERING. The door opens on water.

The lower ring flooded at some point. The corridor beyond is submerged, black, ceiling to floor, for maybe forty metres. Your suit can take it, but the swim will burn air.`+(s.mut>=40?`

[v]Your neck itches. The slits under your jaw are opening and closing on their own. You realise, with a sick, calm certainty, that you could [b]breathe[/b] this water.[/v]`:''),
 choices:[
  {t:'Swim it on suit air',to:'eng_swim',hint:'heavy O2 use'},
  {t:'Crack your neck seal. Breathe the water.',to:'eng_gills',cls:'mut',if:s=>s.mut>=40},
  {t:'Back to the ring',to:'ring'}]},
eng_swim:{zone:'station',scene:'flood',drain:18,
 text:`You pull yourself hand over hand along a cable tray. Your lamp shows you things floating at the edge of the light: a mug, a boot, a long ribbon of something that was once part of a person and is now very interested in your lamp.

Your air gauge drops in steady little clicks. Your breathing sounds very loud.`,
 choices:[{t:'Surface into the reactor hall',to:s=>s.flags.stitched?'eng_room':'stitched1'}]},
eng_gills:{zone:'station',scene:'flood',drain:0,
 onEnter:s=>{once('gills1',()=>mod({san:-6,mut:5}));},
 text:`You crack the seal at your collar. The water comes in, cold, pressing, eight kilometres of it trying to be inside you.

The slits under your jaw open wide and [r]drink[/r].

It's the best breath you've ever taken. You hate how good it is. You swim the forty metres without using a single breath of suit air, and you are almost sad when it's over.`,
 choices:[{t:'Surface into the reactor hall',to:s=>s.flags.stitched?'eng_room':'stitched1'}]},

stitched1:{zone:'station',scene:'stitched',sfx:'sting',timed:{sec:4.5,fail:'st_caught'},
 onEnter:s=>{setf('stitched');once('st_s',()=>mod({san:-10}));},
 text:`You haul yourself out into the reactor hall, and something is already in here with you.

It's coming down the catwalk on too many legs. It used to be Tomas Reyes, the engineer, and it used to be some other people too. His torso is the centre. Around it, [r]arms[/r]. Not his: different skin tones, different sizes, one wearing a wedding ring. They've been grafted along his spine like the oars of a galley, and they row him across the floor.

His head is on backwards. He's smiling with the back of it: a second mouth has opened in his scalp.

"Diver," says the scalp-mouth, in Bram Kessel's voice. "Hold still. We'll make room."`,
 choices:[
  {t:'Run for the fuse cabinet',to:'st_run'},
  {t:'Flare in its face',to:'st_flare',if:s=>has('flare'),fx:()=>take('flare')},
  {t:'Hide under the catwalk',to:'st_hide'}]},
st_run:{zone:'station',scene:'stitched',timed:{sec:3,fail:'st_caught'},
 text:`You run. It is faster than you. Of course it is, it has [b]twenty arms[/b].

A hand closes around your ankle. Another one, with the wedding ring, closes around the first one, gently, as if they're holding hands.`,
 choices:[{t:'Kick free',to:'st_kick'},{t:'Cut the hands off',to:'st_cut'}]},
st_kick:{zone:'station',scene:'reactor',onEnter:s=>{once('stk',()=>mod({hp:-10}));},
 text:`You kick until something breaks. You don't know if it's its fingers or your ankle. You're free; you scramble behind the reactor shielding and it loses you, rowing in slow puzzled circles before sliding back into the water.`,
 choices:[{t:'Continue',to:'eng_room'}]},
st_cut:{zone:'station',scene:'reactor',onEnter:s=>{once('stc',()=>mod({san:-6}));},
 text:`You saw through the wrist with the ringed hand. It lets go of the other hand last, reluctantly. The creature makes a sound in five voices that might be grief.

It slides back into the water, and you are left holding a hand with a wedding ring on it. You set it down very carefully. You don't know why that matters. It matters.`,
 choices:[{t:'Continue',to:'eng_room'}]},
st_flare:{zone:'station',scene:'reactor',
 text:`The flare hits it square in the scalp-mouth. It shrieks in five voices at once and the arms row backwards in a panic, slapping the floor, carrying it back into the dark water in a boil of bubbles.

It'll be back. But not now.`,
 choices:[{t:'Continue',to:'eng_room'}]},
st_hide:{zone:'station',scene:'stitched',
 onEnter:s=>{if(s.san<40){once('sth',()=>mod({hp:-20}));}},
 text:s=>s.san<40?`You slide under the catwalk. It's a good spot. But your breathing is ragged and your hands are shaking against the grating, and it [r]hears[/r] you.

An arm reaches under, then three. They drag you out by the suit and squeeze you like a toothpaste tube before you get free and roll behind the reactor shielding. It loses you there and slides back into the water, humming.`
 :`You slide under the catwalk and make yourself very small and very slow.

It stops directly above you. Twenty fingers drum on the grating. You can see the backwards face through the gaps, its real face, upside down, eyes closed, as if asleep.

It moves on.`,
 choices:[{t:'Continue',to:'eng_room'}]},
st_caught:{zone:'station',scene:'stitched',
 onEnter:s=>{once('stcg',()=>{mod({hp:-30,mut:10});infect();});fx('hurt');},
 text:`The arms hold you down with tender, crushing strength.

The scalp-mouth comes close to your faceplate. It isn't biting. It's [r]kissing[/r] the seam at your neck, working at it with a tongue that's grown thin as a pipe-cleaner, and you feel it get in: cold, then warm, then nothing.

Then it lets you go, as if it's done what it came for.

"Room," it sighs. "Soon."

[r]You are infected.[/r]`,
 choices:[{t:'Crawl away',to:'eng_room'}]},

eng_room:{ch:'II. CALYX',zone:'station',scene:'reactor',choir:.15,checkpoint:true,
 text:s=>`The reactor hall. The core hums behind its shielding, blue light leaking out of the seams. Catwalks. A fuse cabinet. A locker marked EMERGENCY.

The reactor console blinks patiently: [b]COMMAND KEY REQUIRED[/b].`+(s.flags.overload?`

[r]The console shows a countdown: ${s.overload}. The whole hall is strobing red.[/r]`:''),
 choices:[
  {t:'Take a fuse',to:'eng_fuse',if:s=>!s.flags.e_fuse},
  {t:'Open the emergency locker',to:'eng_locker',if:s=>!s.flags.e_locker},
  {t:'Use the reactor console',to:'eng_console',if:s=>!s.flags.overload,lock:s=>has('reactorkey')?null:'Command key required (Kessel has it)'},
  {t:'Swim back to the ring',to:'eng_back'}]},
eng_fuse:{zone:'station',scene:'reactor',onEnter:s=>{setf('e_fuse');once('fuse',()=>give('fuse'));},
 text:`The fuse cabinet sticks, then gives. You pull a 40-amp ceramic fuse. Comms could use this.

[d]Fuse acquired.[/d]`,
 choices:[{t:'Continue',to:'eng_room'}]},
eng_locker:{zone:'station',scene:'reactor',onEnter:s=>{setf('e_locker');once('elock',()=>{give('o2can');give('flare');});},
 text:`Inside: an O2 canister and a flare. Someone has scratched into the inside of the door with a screwdriver, over and over, in a hand that gets worse as it goes:

[d]I AM TOMAS REYES. I AM TOMAS REYES. I AM TOMAS. I AM. I AM WE. WE ARE.[/d]

[d]O2 canister and Flare acquired.[/d]`,
 choices:[{t:'Continue',to:'eng_room'}]},
eng_console:{zone:'station',scene:'reactor',
 text:`You turn Kessel's key. The console wakes. The menu is short:

[b]1. DELAYED OVERLOAD (EVAC TIMER)
2. IMMEDIATE OVERLOAD[/b]

A note taped to the screen, in Kessel's capitals: [d]IF YOU'RE READING THIS AND YOU'RE STILL YOU, PICK ONE.[/d]`,
 choices:[
  {t:'Set delayed overload (evac timer)',to:'eng_set',cls:'danger'},
  {t:'Overload it NOW',to:'end_scuttle_now',cls:'danger'},
  {t:'Not yet',to:'eng_room'}]},
eng_set:{zone:'station',scene:'reactor',sfx:'sting',
 onEnter:s=>{setf('overload');s.overload=14;},
 text:`You key it in. The core's hum climbs a full octave and keeps climbing. Red strobes snap on. A calm recorded voice begins counting.

[r]CORE OVERLOAD. EVACUATE.[/r]

Somewhere far below, through eight kilometres of water and rock, the Choir changes its note. It has noticed.

[b]You have ${14} moves to reach the bell.[/b]`,
 choices:[{t:'Swim. Now.',to:'eng_back'}]},
eng_back:{zone:'station',scene:'flood',drain:12,
 text:s=>`You go back into the black water.`+(s.mut>=40?` The slits under your jaw drink it gratefully.`:` Your air gauge clicks down, steady and merciless.`)+(s.flags.overload?` The water is shaking. Every pipe in the station is ringing like a bell.`:``),
 choices:[{t:'Surface in the Ring Corridor',to:'ring'}]},

/* ---- HATCH */
hatch:{zone:'station',scene:'hatch',choir:.25,
 text:s=>s.flags.hatchopen?`The lower access hatch stands open. The cage lift waits on the anchor cable, swaying slightly, as if something below has just let go of it.`
 :`The LOWER ACCESS hatch is a steel disc two metres across, bolted into the floor of the ring. A keypad beside it wants four digits.

Someone has scratched words into the paint beside it, deep, with a lot of force:

[r]IT'S NOT A DOOR. IT'S A THROAT.[/r]`,
 keypad:{answer:'3041',ok:'hatch_ok',fail:'hatch_bad',back:'ring'},keypadIf:s=>!s.flags.hatchopen,
 choices:[{t:'Ride the lift down',to:'lift_down',cls:'danger'},{t:'Back to the ring',to:'ring'}]},
hatch_bad:{zone:'station',scene:'hatch',
 onEnter:s=>{s.flags.tries=(s.flags.tries||0)+1;if(s.flags.tries>=3){mod({hp:-15,san:-5});fx('hurt');}else mod({san:-3});},
 text:s=>s.flags.tries>=3?`[r]WRONG.[/r] An alarm whoops, once.

The hatch shudders. Something on the other side has heard the alarm and is pushing up. The steel bows. A dozen fingers worm through the gap at the rim and grab your boot and pull, and you leave skin behind getting free.

The fingers withdraw. The hatch settles. It's waiting.`
 :`The keypad buzzes. [r]WRONG.[/r] Below your feet, faintly, something knocks back. Four knocks. As if it's trying to tell you the number.`,
 choices:[{t:'Try again',to:'hatch'},{t:'Back to the ring',to:'ring'}]},
hatch_ok:{zone:'station',scene:'hatch',sfx:'thud',
 onEnter:s=>{setf('hatchopen');},
 text:`The keypad goes green. Bolts withdraw one by one with heavy clunks, like someone working down a spine.

The hatch swings up. Below is a shaft, and in the shaft a cage lift hangs on the anchor cable, which runs down into darkness.

The song comes up out of the shaft like warm air.`,
 choices:[{t:'Ride the lift down',to:'lift_down',cls:'danger'},{t:'Not yet',to:'ring'}]},

/* ------------------------------------------------ III. THE CHOIR */
lift_down:{ch:'III. THE CHOIR',depth:8300,zone:'deep',scene:'lift',choir:.6,drain:4,
 text:`The cage rides the anchor cable down the trench wall. It takes four minutes. They are long minutes.

The wall slides past your lamp: black rock, white bacterial mats, and then [r]eyes[/r], set into the rock in pairs, opening as your light passes and closing after it like a wave going down the wall with you.

The song gets louder. Not in your ears. In your teeth. In the long bones of your legs.

The cage stops with a jolt at the bottom of the world.`,
 choices:[{t:'Step out',to:'choir1'}]},

choir1:{ch:'III. THE CHOIR',depth:8412,zone:'deep',scene:'choir',choir:1,checkpoint:true,
 onEnter:s=>{once('ch_s',()=>mod({san:-12}));},
 text:s=>{let t=s.seen.choir1===1?`It's a cathedral. That's the only word your brain will offer.

Arches rise into the dark, ribbed and glistening, and the ribs are [r]ribs[/r]: human, whale, things that were never either. Between them stretch membranes of skin, pale as candle wax. Set into the skin, in rows like pews, are mouths. Thousands. Fish mouths, octopus beaks, human mouths. Every one open. Every one singing the same note.

At the altar end (there is an altar end) a figure sits on a throne grown from its own spine.

Commander Bram Kessel. The reactor key hangs at his chest on its chain. The chain has grown through his sternum like a vine through a fence.`
 :`The Choir. Ten thousand mouths, one note. Bram waits on his throne of spine.`;
  if(s.mut>=60) t+=`

[v]None of them turn toward you. You are not an intruder here. You are a late guest.[/v]`;
  if(s.inv.sample) t+=`

[v]Every mouth in the cathedral closes at once. In the silence, the flask on your hip is warm. It's pleased. Then the song resumes, one voice louder.[/v]`;
  if(s.flags.overload) t+=`

[r]Far above you, the core is counting: ${s.overload}.[/r]`;
  return t;},
 choices:[
  {t:'Walk the aisle to Bram',to:s=>s.mut>=60?'choir_bram':'choir_sneak',if:s=>!has('reactorkey')},
  {t:'Listen',to:'choir_listen',cls:'mut',if:s=>!s.flags.c_listen},
  {t:'Take off your helmet. Join them.',to:'choir_join',cls:'danger'},
  {t:'Ride the lift back up',to:'lift_up'}]},

choir_listen:{zone:'deep',scene:'choir',choir:1,
 onEnter:s=>{setf('c_listen');once('cl',()=>mod({san:-10,mut:8}));log('choir1');},
 text:`You stand still and let it in.

It has been here four hundred million years. Every animal that ever fell into the trench, it has kept, and it has kept them singing. It does not want to hurt anyone. It wants what everything wants.

[v]It wants to go up.[/v]

It cannot climb. It needs to be [r]carried[/r]. It has been waiting so long for something that comes down and goes back up again.

Something like you.

You come back to yourself with your hand on your helmet clasp.`,
 choices:[{t:'Continue',to:'choir1'}]},

choir_sneak:{zone:'deep',scene:'choir',choir:1,timed:{sec:4,fail:'choir_run'},
 text:`You start down the aisle. The mouths in the walls turn to follow your lamp. One by one. Then a hundred at a time.

The note bends.

Something is noticing you.`,
 choices:[
  {t:'Kill your lamp. Walk on blind.',to:'choir_dark'},
  {t:'Run for the altar',to:'choir_run'}]},
choir_dark:{zone:'deep',scene:'dark',choir:1,
 onEnter:s=>{once('cdk',()=>mod({san:-10}));},
 text:`Darkness. Total. You walk with your hand out.

Things touch your hand. Lips. Soft, curious, wet. Something takes one of your fingers into its mouth and sucks it gently, like a baby, and lets go. You keep walking. You keep walking.

The note bends back. You are not interesting in the dark.

You switch your lamp on at the foot of the throne.`,
 choices:[{t:'Look up at Bram',to:'choir_bram'}]},
choir_run:{zone:'deep',scene:'choir',choir:1,
 onEnter:s=>{once('crun',()=>{mod({hp:-20,mut:8});infect();});fx('hurt');},
 text:`You run. The membranes lash out as you pass, wet and clinging, wrapping your arms, your helmet, and you tear through them with a sound like ripping wet paper. Every mouth on both sides of the aisle screams the note at you at once.

You reach the throne with pink membrane hanging off you in rags. It's already working its way into the seams.

[r]You are infected.[/r]`,
 choices:[{t:'Look up at Bram',to:'choir_bram'}]},

choir_bram:{zone:'deep',scene:'bram',choir:.9,
 text:`Bram Kessel's face is sunken and grey and very tired. His spine has grown out of his back and down into the floor and back up into the throne he sits on; you can't tell where the man ends and the chair begins.

"You came for the key," he says. "Good. I was hoping somebody would."

"I brought it down so nobody could burn it. That was [r]it[/r] talking. It talks in your head in your own voice. I thought it was my idea for weeks."

He looks down at the chain through his sternum.

"Take it. I'm still enough me to want that. Take it, and go burn my station."`,
 choices:[{t:'Pull the chain',to:'choir_key',cls:'danger'},{t:'Step back',to:'choir1'}]},
choir_key:{zone:'deep',scene:'bram',choir:.9,sfx:'sting',
 onEnter:s=>{once('ckey',()=>{mod({hp:-10,san:-10});give('reactorkey');});},
 text:`The chain comes through him link by link. Each link is coated in something pink that doesn't want to let go. Bram doesn't scream. He hums, low, to keep from screaming, and the whole cathedral hums with him.

The key comes free, warm, slick, and heavy in your glove.

"Console in engineering," Bram says. "There's a delay, if you want to get out first. Or do it now. Your call, Diver."

"I'd go up. Somebody should."

[d]Reactor key acquired.[/d]`,
 choices:[{t:'Ride the lift back up',to:'lift_up'}]},

choir_join:{zone:'deep',scene:'choir',choir:1,
 text:`Your hands are on the helmet clasps. You don't remember putting them there. It doesn't matter.

The song is so warm. There's so much room.

One twist and you'll never be alone again.`,
 choices:[{t:'Open the helmet',to:'end_choir',cls:'danger'},{t:'No. NO.',to:'choir1'}]},

lift_up:{zone:'deep',scene:'lift',choir:.5,drain:4,
 text:`The cage climbs. The eyes in the trench wall open as you pass and close behind you, watching you go up, as if memorising the route.

The song follows you up the shaft, a little fainter at every metre. You feel it pulling at you, like a hand on your belt.`,
 choices:[{t:'Climb out into the ring',to:'ring'}]},

/* ---- hallucination */
hallu_helmet:{zone:'station',scene:'dark',
 onEnter:s=>{if(s.san<12&&!settings.god) return 'end_unsealed'; once('h'+s.moves,()=>mod({san:-4}));},
 text:`Your fingers are on the helmet clasps.

You don't remember putting them there. The first clasp is already open. Cold water beads at the seal.

You close it. You hold your own hands in your lap until they stop shaking.

[d]That wasn't you. Was it?[/d]`,
 choices:[{t:'Breathe',to:s=>s.returnTo||'ring'}]},

/* ------------------------------------------------ ENDINGS */
end_true:{end:true,depth:0,endName:'PRESSURE RELEASE',ending:'true',scene:'surface',choir:0,ch:'END',
 text:s=>`The bell drops its ballast, and you rise.

[d]8,000. 7,000. 6,000.[/d]

At 5,200 metres the bell shudders. Below you, the trench lights up: a soft white bloom against the wall of the world, silent at this distance. Then the shockwave arrives as a long, gentle push, like a hand on your back. Like someone helping you up.

The song stops.

Not fades. [b]Stops.[/b] All those voices, mid-note. You didn't know how loud it was until it was gone. You cry for most of the next three thousand metres, and you don't entirely know who for.`+
(s.flags.okmercy||s.flags.ines==='dead'?`

You think of `+[s.flags.okmercy?'Okafor\'s ribs folding shut like a flower at dusk':null,s.flags.ines==='dead'?'Ines\'s face going young':null].filter(Boolean).join(', and ')+`. You think you did right. Down there, right was very small, but it was there.`:``)+`

At the surface, Cole is waiting at the hatch with a decompression team and the face of a man who hasn't slept in nine days.

"Three," he says. "Are you- is it-"

You hold up your left hand. `+(s.mut<20?`Five fingers. Separate. [b]Yours.[/b]`:`Five fingers. The webbing between them is almost gone. Almost.`)+`

"I'm fine," you say. Then, because pressure makes people honest: "I'm not. But I'm [b]me[/b]."

Months later, sometimes, you catch yourself humming. You stop. Each time, it's a little easier to stop.`},

end_surface:{end:true,depth:0,endName:'SURFACE',ending:'surface',scene:'surface_grey',choir:.05,ch:'END',
 text:`The bell drops its ballast and you rise. You left CALYX standing.

At the surface, Cole helps you out of the bell and doesn't ask questions you can't answer. Meridian pays. You sign things. You go home.

The song is still on the radio band, if you know where to listen. You know where to listen. Some nights you listen for hours.

In March, Meridian sends a second team. Better suits. Six of them.

They stop transmitting after nine days.

Four months after that, a trawler off Guam hauls up a net full of fish that are all [r]one fish[/r]. The crew film it on their phones. In the background of the video, under the wind, if you know what you're listening for, something is humming.`},

end_cargo:{end:true,depth:0,endName:'CARGO',ending:'cargo',scene:'cargo',choir:.2,ch:'END',
 text:s=>`You rise with Specimen Zero warm against your hip.

On deck, Cole won't look at you. Two men in good jackets take the flask with gloved hands, and the bonus clears before you've finished decompressing. Ten million. They meant it.

The lab in Houston is very clean. You see it once, on a tour. Behind three layers of glass, Specimen Zero has been given a tank of its own, and pressure equipment, and a team. It's grown. It presses a hand against the glass when you walk past.

It's grown a [b]second[/b] hand.

On the fourteenth of March the following year, the lab in Houston stops answering its phones.`+(s.flags.overload?`

You think about CALYX, burned to slag at the bottom of the world, and how none of that mattered at all, in the end, because you carried it up yourself.`:``)+`

You're watching the news when you notice your own hand has begun, very gently, to [r]hum[/r].`},

end_bloom:{end:true,depth:0,endName:'BLOOM',ending:'bloom',scene:'bloom',choir:.6,ch:'END',
 text:`Ines told you. Not past halfway.

At 3,000 metres your body starts to disagree with the sky.

The soft bones it built for pressure have nothing left to push against, and so they [r]expand[/r]. Your ribs open first, outward, upward, the way Okafor's did, and it doesn't hurt. That's the worst part. It is so kind. Your skin learns to share with the inside of the bell. Your lungs climb out of your chest to see.

By the time the bell breaks the surface there's no diver in it. There is a flower, pink and wet and enormous, filling the bell like a fist fills a glove.

Cole opens the hatch.

You are so happy to see him. You have [b]so much room[/b] for him.`},

end_choir:{end:true,endName:'THE CHOIR',ending:'choir',scene:'choirend',choir:1,ch:'END',
 text:`The helmet comes away.

The water comes in like a held breath let go. It doesn't crush you. You were built for this now; your bones bend to it, your lungs open to it, your skin opens to the skin around you and you are [b]not alone[/b], for the first time in your life you are not alone.

You find your place in the pews, between Okafor's mother and something with a lantern on its head. You open your mouth. You sing. And the song climbs one voice higher.

One voice closer to the light.

Up on the surface, on a ship called Meridian, a man named Cole puts on his headphones, and hears, under the static, someone he knows, [r]humming[/r].`},

end_scuttle:{end:true,endName:'SCUTTLE',ending:'scuttle',scene:'blast',choir:0,ch:'END',
 text:s=>(s.zone==='deep'?`You were still at the bottom of the world when the timer ran out.

The light comes down the trench like a falling sun, and the Choir sees it coming, and for one second every mouth in the cathedral stops singing and simply [b]looks[/b].`
 :`You didn't make it to the bell.

The core lets go behind you, and for one long moment you are standing at the centre of a small white sun at the bottom of the sea.`)+`

It's very quick.

The last thing you hear is the song, every voice in it, cut off at once. And then, so faint you might have imagined it, one voice that sounds like Bram Kessel saying [b]thank you[/b].

Nobody on the surface ever learns what you did. The song is just gone from the radio band, one Tuesday, and nobody can explain it.

That's all right. Somebody should.`},

end_scuttle_now:{end:true,endName:'SCUTTLE',ending:'scuttle',scene:'blast',choir:0,ch:'END',
 text:`You choose IMMEDIATE.

You aren't sure what you were going to go up to anyway. You think of Cole's voice: [d]if it's in you, don't come up.[/d]

The core's hum climbs past hearing. The floor goes white. For one long moment you are standing at the centre of a small sun at the bottom of the world, and it is warm, warmer than the song, warmer than anything.

The last thing you hear is the Choir, every voice in it, cut off at once. And then, so faint you might have imagined it, one voice that sounds like Bram Kessel saying [b]thank you[/b].

The song is gone from the radio band one Tuesday. Nobody can explain it.

That's all right. Somebody should.`},

end_drowned:{end:true,endName:'DROWNED',ending:'drowned',scene:'drown',choir:.4,ch:'END',
 text:`The air gauge has been flashing for a while. You stopped looking at it.

The last breath tastes of metal and nothing. You pull at the air and the suit gives you nothing back, and your chest works and works like a fish on a deck.

The dark comes in from the edges of your faceplate.

As your eyes close, you see the lichen on the walls brighten, all at once, the way a crowd leans forward. [r]It doesn't waste anything.[/r] By morning you'll be useful.`},

end_opened:{end:true,endName:'OPENED',ending:'opened',scene:'opened',choir:.4,ch:'END',
 text:`Your body gives up the argument.

You sit down against the wall because your legs have stopped being legs. There's a warmth spreading in your chest that isn't blood, or isn't only blood, and when you look down your suit is bulging outward around your ribs, as if something inside is [r]opening[/r].

Like a flower. Like Okafor.

It doesn't hurt. That's the worst part. It is so kind.`},

end_unsealed:{end:true,endName:'UNSEALED',ending:'unsealed',scene:'mist',choir:.6,ch:'END',
 text:`It's fine. It's fine. The helmet is the only thing hurting you, and you're so tired of being hurt.

You open the clasps. All of them. You lift.

At eight kilometres the water does not come in. It [b]arrives[/b], all at once, with the weight of the whole ocean behind it.

In the fraction of a second before there's nothing left of you to think, you'd swear you heard the song welcome you home.`}
